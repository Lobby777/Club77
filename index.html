.board .card{--cw:46px}
.board .slot{width:46px;height:65px;border-radius:6px;border:1px dashed rgba(255,255,255,.18)}
.potline{text-align:center;font:600 15px var(--f-mono);color:var(--brass-2)}
.potline small{display:block;font:500 12px var(--f-body);color:var(--muted)}
.mine{margin-top:10px;border-top:1px dashed rgba(255,255,255,.12);padding-top:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mine .cards .card{--cw:56px}
.mine.v-omaha .cards .card,.mine.v-draw .cards .card{--cw:50px}
.mine .who{display:flex;gap:10px;align-items:center;font-size:14px}
.resline{text-align:center;font:600 14px var(--f-body);color:var(--brass-2);min-height:20px;margin-top:4px}
/* action bar */
.actions{position:sticky;bottom:0;z-index:4;background:linear-gradient(180deg,rgba(8,27,22,0),var(--night) 18%);padding-top:14px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));margin-top:6px}
.actions .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.actions .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.actions .grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.actions .who{font-size:13px;color:var(--muted);margin-bottom:6px;text-align:center}
.raise{display:flex;flex-direction:column;gap:6px;margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.raise input[type=range]{width:100%;accent-color:var(--brass)}
/* solver */
.solver{margin-top:12px;border:1px solid var(--line-2);border-radius:16px;background:linear-gradient(180deg,var(--panel-2),var(--panel));overflow:hidden}
.solver>header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.solver>header b{font:700 16px var(--f-display);color:var(--brass-2)}
.solver .body{padding:12px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:rgba(0,0,0,.22);border-radius:10px;padding:8px}
.kv small{display:block;font-size:11.5px;color:var(--muted)}
.kv b{font:600 17px var(--f-mono);font-variant-numeric:tabular-nums}
.recbox{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(99,211,143,.08);border:1px solid rgba(99,211,143,.35)}
.recbox .big{font:700 19px var(--f-display);color:var(--good)}
.recbox.bad{background:rgba(255,128,111,.08);border-color:rgba(255,128,111,.35)}
.recbox.bad .big{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:12.5px}
.bar .tr{height:10px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.bar .fl{height:100%;background:var(--brass);border-radius:6px}
.bar .fl.g{background:var(--good)}.bar .fl.r{background:var(--bad)}
.bar span:last-child{font-family:var(--f-mono);text-align:left;direction:ltr}
.eqbar{height:16px;border-radius:8px;background:rgba(255,128,111,.35);overflow:hidden;display:flex;direction:ltr}
.eqbar i{display:block;height:100%}
.note{font-size:13px;color:var(--muted);line-height:1.55}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.t td.n{font-family:var(--f-mono);direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
table.t tr.best td{color:var(--good);font-weight:600}
.scroll{overflow-x:auto}
/* blackjack */
.dealer{display:flex;flex-direction:column;align-items:center;gap:6px}
.dealer .cards .card{--cw:50px}
.lbl2{font:600 12px var(--f-body);letter-spacing:1.5px;color:var(--brass);}
.arc{text-align:center;font:700 12px var(--f-display);color:rgba(241,207,128,.55);letter-spacing:1px;margin:8px 0}
.bjseats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bjseat{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.bjseat.turn{border-color:var(--brass-2);box-shadow:0 0 0 1px var(--brass-2)}
.bjseat.picked{outline:2px dashed var(--warn);outline-offset:2px}
.bjseat .hd{display:flex;justify-content:space-between;gap:6px;font-size:13px}
.bjhand{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;border-radius:10px}
.bjhand.act{background:rgba(241,207,128,.1)}
.bjhand .cards .card{--cw:38px}
.tot{font:600 13px var(--f-mono);background:rgba(0,0,0,.4);padding:1px 8px;border-radius:999px}
.res{font:700 12px var(--f-body);padding:1px 8px;border-radius:999px}
.res.win,.res.bj{background:var(--good);color:#06240f}.res.lose,.res.bust{background:var(--bad);color:#2b0703}.res.push,.res.surr{background:var(--muted);color:#0b1a14}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{--cc:var(--chip-red);width:50px;height:50px;border-radius:50%;border:0;color:#fff;font:700 12px var(--f-mono);cursor:pointer;position:relative;text-shadow:0 1px 2px rgba(0,0,0,.7);
  background:radial-gradient(circle,color-mix(in srgb,var(--cc) 88%,#000) 0 46%,rgba(255,255,255,.92) 46.5% 49.5%,var(--cc) 50% 63%,transparent 63.5%),repeating-conic-gradient(from 7.5deg,#f3ebd7 0 15deg,var(--cc) 15deg 45deg);
  box-shadow:0 2px 0 color-mix(in srgb,var(--cc) 55%,#000),0 5px 10px rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.25);transition:transform .12s}
.chip::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.42),transparent 42%);pointer-events:none}
.chip.on{transform:translateY(-6px);box-shadow:0 0 0 2px var(--brass-2),0 2px 0 color-mix(in srgb,var(--cc) 55%,#000),0 10px 16px rgba(0,0,0,.5)}
.c5{--cc:#c4403a}.c10{--cc:#2f6cae}.c25{--cc:#2c8a5a}.c50{--cc:#d06a2c}.c100{--cc:#26262b}.c500{--cc:#6a3fa0}.c1000{--cc:#c9a227}
/* roulette */
.wheelwrap{display:flex;justify-content:center;position:relative;margin-top:4px}
.wheelwrap canvas{width:min(250px,70vw);height:auto;aspect-ratio:1;max-width:100%}
.ptr{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:16px solid var(--brass-2);filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.rlres{text-align:center;margin-top:6px;min-height:26px;font:700 18px var(--f-display)}
.hist{display:flex;gap:4px;overflow-x:auto;direction:ltr;padding:4px 0}
.hn{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font:600 12px var(--f-mono);color:#fff}
.hn.r{background:var(--suit-red)}.hn.b{background:var(--chip-blk)}.hn.g{background:var(--chip-grn)}
.rlboard{display:grid;grid-template-columns:1fr 1fr 1.25fr 1.25fr 1.25fr;gap:3px;direction:ltr;margin-top:10px;user-select:none}
.rc{min-height:31px;border-radius:5px;display:flex;align-items:center;justify-content:center;font:600 13px var(--f-mono);color:#fff;border:1px solid rgba(255,255,255,.18);cursor:pointer;position:relative;background:transparent;padding:0}
.rc.r{background:var(--suit-red)}.rc.b{background:var(--chip-blk)}.rc.g{background:var(--chip-grn)}
.rc.o{background:rgba(0,0,0,.25);font:600 12px var(--f-body)}
.rc.hit{box-shadow:0 0 0 2px var(--brass-2),0 0 10px var(--brass-2)}
.rc .bc{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;padding:0 4px;border-radius:999px;background:var(--brass-2);color:#2a1b06;font:700 10px var(--f-mono);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.6);z-index:1}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ptabs button{flex:none}
/* video poker */
.paytab{width:100%;border-collapse:collapse;font-size:12.5px;direction:rtl}
.paytab td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.06)}
.paytab td.n{font-family:var(--f-mono);text-align:left;direction:ltr}
.paytab td.on{color:var(--brass-2);font-weight:700}
.paytab tr.hit td{background:rgba(241,207,128,.18);color:var(--brass-2)}
.vpcards{display:flex;gap:6px;justify-content:center;direction:ltr;margin-top:14px}
.vpcards .slotc{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer}
.vpcards .card{--cw:min(17vw,62px)}
.held{font:700 11px var(--f-body);letter-spacing:1px;color:var(--warn);min-height:16px}
/* academy */
.lesson{line-height:1.7}
.lesson h3{margin-top:8px;color:var(--brass-2)}
.lesson ul{margin:4px 0;padding-inline-start:20px}
.lesson li{margin:3px 0}
.lesson p{max-width:65ch}
.chart{border-collapse:collapse;font:600 11.5px var(--f-mono);direction:ltr;margin:6px 0}
.chart th,.chart td{width:26px;height:24px;text-align:center;border:1px solid var(--night)}
.chart th{color:var(--muted);font-weight:500}
.a-H{background:#a33a32;color:#fff}.a-S{background:#d6b445;color:#231a00}.a-D,.a-Ds{background:#2f7d57;color:#fff}.a-P{background:#3765a8;color:#fff}.a-Rh{background:#e8e2d0;color:#1b1a17}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.legend span{padding:2px 8px;border-radius:6px}
.drill{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.score{display:flex;gap:14px;justify-content:center;font:600 14px var(--f-mono)}
/* modal & toast */
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#modal .sheet{background:var(--panel);border:1px solid var(--line-2);border-radius:18px;padding:16px;width:min(520px,100%);max-height:85vh;overflow:auto}
.cover{position:fixed;inset:0;z-index:15;background:radial-gradient(circle at 50% 40%,var(--felt-2),var(--night));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.cover h2{font-size:30px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(460px,92vw)}
.toast{background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .25s ease-out both;text-align:center}
.toast.bad{border-color:var(--bad)}.toast.good{border-color:var(--good)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle input{width:22px;height:22px;accent-color:var(--brass)}
.code{font:700 34px var(--f-mono);letter-spacing:6px;color:var(--brass-2);text-align:center;direction:ltr}
.plist{display:flex;flex-direction:column;gap:6px}
.plist div{display:flex;justify-content:space-between;background:rgba(0,0,0,.2);padding:8px 10px;border-radius:10px}
.bspots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:10px}
.bspot{grid-column:span 2;min-height:54px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.22);color:var(--ivory);font:600 14px var(--f-body);position:relative;cursor:pointer;padding:6px}
.bspot.big{grid-column:span 3;min-height:70px;font-size:17px}
.bspot.p{border-color:var(--chip-blue)}.bspot.b{border-color:var(--suit-red)}.bspot.t{border-color:var(--chip-grn)}
.bspot small{display:block;color:var(--muted);font:500 11px var(--f-mono)}
.bspot .bc{position:absolute;top:-7px;left:-4px;min-width:26px;height:22px;padding:0 5px;border-radius:999px;background:var(--brass-2);color:#2a1b06;font:700 11px var(--f-mono);display:grid;place-items:center}
.bspot.hit{box-shadow:0 0 0 2px var(--brass-2),0 0 12px rgba(241,207,128,.5)}
.bachands{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bachand{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:12px;background:rgba(0,0,0,.2)}
.bachand.win{box-shadow:0 0 0 2px var(--brass-2)}
.bachand .card{--cw:40px}
.road{display:grid;grid-template-rows:repeat(6,18px);grid-auto-flow:column;grid-auto-columns:18px;gap:3px;overflow-x:auto;direction:ltr;padding:4px 0;margin-top:8px}
.bead{width:18px;height:18px;border-radius:50%;font:700 9px var(--f-mono);display:grid;place-items:center;color:#fff}
.bead.p{background:var(--chip-blue)}.bead.b{background:var(--suit-red)}.bead.t{background:var(--chip-grn)}
.achs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:600px){.achs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ach{padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:4px}
.ach.on{border-color:var(--brass);background:linear-gradient(160deg,var(--rail-2),var(--panel))}
.ach b{font:700 15px var(--f-display)}.ach small{color:var(--muted);font-size:12px}
.ach .medal{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-display);background:var(--line);color:var(--muted)}
.ach.on .medal{background:var(--brass);color:#2a1b06}
.dec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.verdict{font:700 12px var(--f-body);padding:2px 8px;border-radius:999px;align-self:start}
.verdict.ok{background:var(--good);color:#06240f}.verdict.no{background:var(--bad);color:#2b0703}.verdict.mid{background:var(--warn);color:#2b2000}
.hud{font:600 10px var(--f-mono);color:var(--info)}
#netchat{position:fixed;z-index:12;top:calc(env(safe-area-inset-top,0px) + 66px);left:max(10px,env(safe-area-inset-left,0px))}
.chatbtn{background:var(--panel-2);border:1px solid var(--line-2);color:var(--ivory);border-radius:999px;padding:6px 12px;font:600 13px var(--f-body);cursor:pointer;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.chatbtn b{background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;font-size:11px}
.chatbox{width:min(330px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.chatlog{max-height:180px;overflow:auto;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
@media (max-width:420px){.brand small{display:none}.tile .glyph{font-size:26px}}
.tile .glyph{white-space:nowrap}
.lestop{display:flex;gap:10px;align-items:center;margin-top:12px}
.lesttl{font:700 16px var(--f-display);margin-bottom:6px}
.segbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;position:relative;z-index:1}
.segbar i{display:block;margin-left:auto;margin-right:0;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-2));border-radius:999px;transition:width .35s ease}
.segbar.thin{height:5px;width:100%}
.lslide{margin-top:14px;min-height:240px}
.lslide h3{color:var(--brass-2);font-size:20px}
.lesnav{margin-top:12px}
.formula{font:600 14px var(--f-mono);unicode-bidi:plaintext;text-align:center;background:var(--night);border:1px solid var(--line-2);border-radius:10px;padding:10px;margin:8px 0;color:var(--brass-2)}
.qcard{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-size:16.5px;line-height:1.6;padding:20px 14px;margin-top:6px}
.qcard p{max-width:52ch;margin:0}
.qcard .board{margin:4px 0}
.qopts{display:grid;gap:8px;margin-top:12px}
.qopt{min-height:54px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ivory);font:600 15px var(--f-body);cursor:pointer;padding:8px 10px;transition:transform .1s,background .2s}
.qopt:active{transform:scale(.98)}
.qopt.right{background:rgba(99,211,143,.18);border-color:var(--good);color:var(--good)}
.qopt.wrong{background:rgba(255,128,111,.15);border-color:var(--bad);color:var(--bad)}
.qopt:disabled{cursor:default}
.qfb{margin-top:10px;padding:12px;border-radius:12px;font-size:14.5px;line-height:1.6}
.qfb.ok{background:rgba(99,211,143,.1);border:1px solid rgba(99,211,143,.4)}
.qfb.no{background:rgba(255,128,111,.08);border:1px solid rgba(255,128,111,.4)}
.stars{display:inline-flex;gap:2px}.stars .st{font-size:15px;color:var(--line-2)}.stars .st.on{color:var(--brass-2)}
.lesdone .stars .st{font-size:36px}
.crsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.crsgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.crs{display:flex;flex-direction:column;gap:6px;text-align:right;padding:14px;border-radius:16px;border:1px solid var(--line-2);background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--cc) 40%,transparent),transparent 60%),linear-gradient(160deg,var(--panel-2),var(--panel));color:var(--ivory);cursor:pointer;min-height:178px;min-width:0}
.crs:active{transform:scale(.98)}
.crs b{font:700 17px var(--f-display)}.crs small{color:var(--muted);font-size:12.5px;line-height:1.35}
.crsic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--cc);color:#fff;font:800 17px var(--f-display);box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.crsic.big{width:54px;height:54px;font-size:22px;flex:none}
.lvlhead{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px;font:700 15px var(--f-display);color:var(--brass-2)}
.lvlhead.locked{color:var(--muted)}
.path{display:flex;flex-direction:column;gap:8px}
.node{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ivory);text-align:right;cursor:pointer;width:100%}
.node:disabled{opacity:.45;cursor:not-allowed}
.node b{display:block;font:700 15.5px var(--f-display)}.node small{color:var(--muted)}
.ndot{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-mono);background:var(--line);color:var(--muted)}
.ndot svg{width:18px;height:18px;fill:none;stroke:currentColor}
.node.done .ndot{background:var(--brass);color:#2a1b06}
.node.cur{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.node.cur .ndot{background:var(--ivory);color:var(--night);animation:pulse 1.6s ease-in-out infinite}
.node.test .ndot{background:var(--panel-2);border:2px dashed var(--brass);color:var(--brass-2)}
.node.test.done .ndot,.node.cert.done .ndot{background:var(--brass);border:0;color:#2a1b06}
@media (prefers-reduced-motion:reduce){.node.cur .ndot{animation:none}}
#tip{position:fixed;left:12px;right:12px;margin-inline:auto;max-width:460px;top:calc(env(safe-area-inset-top,0px) + 72px);z-index:14;background:var(--panel-2);border:1px solid var(--brass);border-radius:14px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.55);animation:tin .25s ease-out both;font-size:14.5px}
.tipdot{flex:none;font:700 11px var(--f-mono);background:var(--brass);color:#2a1b06;border-radius:999px;padding:2px 7px;margin-top:2px}

category, the high card decides, then the","קיקר":"kicker",". A יכול להיות גם הנמוך ברצף A-2-3-4-5.":". An ace can also be the low card in the straight A-2-3-4-5.","בהולדם משתמשים ב-5 הקלפים הטובים מבין 7 (2 ביד + 5 על השולחן). באומהה —":"In Hold'em you use the best 5 cards out of 7 (2 in hand + 5 on the board). In Omaha —","בדיוק 2":"exactly 2","מהיד ו-":"from your hand and","בדיוק 3":"exactly 3","מהשולחן.":"from the board.","סיכויי קופה ואקוויטי":"Pot odds and equity","זה הכלי הכי חשוב בפוקר, והסולבר מחשב אותו בשבילך בכל יד.":"This is the most important tool in poker, and the solver calculates it for you on every hand.","— החלק מהקופה ש":"— your share of the pot that","שייך":"belongs","לך לפי הסיכוי לנצח.":"to you based on your chance to win.","סיכויי קופה":"Pot odds","— כמה צריך לשלם ביחס למה שאפשר לזכות. קול של 50 לקופה של 150: משלמים 50 כדי לזכות ב-200, אז צריך לנצח 25%.":"— how much you have to pay relative to what you can win. Calling 50 into a pot of 150: you pay 50 to win 200, so you need to win 25%.","כלל: אם האקוויטי שלך גבוה מהאקוויטי הנדרש — קול רווחי לטווח ארוך.":"Rule: if your equity is higher than the required equity — calling is profitable long-term.","נוסחה: אקוויטי נדרש = קול ÷ (קופה + קול).":"Formula: required equity = call ÷ (pot + call).","אאוטים וחוק 2 ו-4":"Outs and the rule of 2 and 4","אאוט = קלף שיהפוך את היד שלך לכנראה מנצחת.":"An out = a card that will likely make your hand the winner.","דרו לצבע: 9 אאוטים · רצף פתוח משני הצדדים: 8 · רצף":"Flush draw: 9 outs · open-ended straight draw: 8 · gutshot","בטן":"straight draw",": 4 · שני קלפים גבוהים: 6 · צבע + רצף: 15":": 4 · two overcards: 6 · flush + straight draw: 15","בפלופ: אאוטים × 4 ≈ % עד הריבר.":"On the flop: outs × 4 ≈ % by the river.","בטרן: אאוטים × 2 ≈ % לקלף האחרון.":"On the turn: outs × 2 ≈ % for the last card.","דוגמה: דרו לצבע בטרן ≈ 18%. אם מהמרים עליך חצי קופה צריך 25% — פולד, אלא אם יש לך סיכוי לזכות בהרבה יותר כשתתפוס (implied odds).":"Example: a flush draw on the turn ≈ 18%. If someone bets half the pot you need 25% — fold, unless you stand to win a lot more when you hit (implied odds).","פוזיציה וידיים פותחות":"Position and opening hands","מי שמדבר אחרון רואה מה כולם עשו לפניו. לכן משחקים יותר ידיים ככל שמתקרבים לכפתור.":"Whoever acts last sees what everyone did before them. That's why you play more hands the closer you are to the button.","פוזיציה מוקדמת":"Early position",": זוגות 77+, AK, AQ, AJs, KQs.":": pairs 77+, AK, AQ, AJs, KQs.","אמצע":"Middle",": מוסיפים 55+, AT, KJ, QJs, JTs.":": add 55+, AT, KJ, QJs, JTs.",": כל זוג, כל A עם קלף צבע, מחברים בצבע (65s+), שני קלפי תמונה.":": any pair, any suited ace, suited connectors (65s+), two face cards.",": מגנים בהרבה ידיים — כבר שילמת.":": defend with many hands — you've already paid.","פתיחה נכונה = רייז ל-2.5–3 בליינדים, לא קול.":"A good open = raise to 2.5–3 blinds, not a call.","אומהה — מה שונה":"Omaha — what's different","4 קלפים ביד, חייבים להשתמש ב-2 בדיוק.":"4 cards in hand, you must use exactly 2.","הידיים קרובות הרבה יותר באקוויטי: AA לפני פלופ מנצח רק כ-65% מול יד אקראית (בהולדם 85%).":"Hands are much closer in equity: AA before the flop wins only about 65% against a random hand (85% in Hold'em).","הנאטס":"The nuts","חשוב: צבע נמוך או רצף נמוך מפסידים הרבה כסף.":"matter: a low flush or low straight loses a lot of money.","פוט-לימיט: אפשר להמר לכל היותר את גודל הקופה.":"Pot-limit: the most you can bet is the size of the pot.","ידיים טובות: מחוברות ובשתי צורות, כמו A-K-Q-J בשני צבעים.":"Good hands: connected and double-suited, like A-K-Q-J in two suits.","פוקר 5 קלפים — כמה להחליף":"5-Card Draw — how many to swap","זוג: מחליפים 3.":"Pair: draw 3.","שני זוגות: מחליפים 1 (סיכוי לפול האוס 8.5%).":"Two pair: draw 1 (8.5% chance of a full house).","שלישייה: מחליפים 2.":"Trips: draw 2.","4 לצבע: מחליפים 1 (19% לצבע).":"4 to a flush: draw 1 (19% to make the flush).","4 לרצף פתוח: מחליפים 1 (17%).":"4 to an open-ended straight: draw 1 (17%).","(בלי החלפה) עם יד בינונית — בלוף ששולח מסר של יד מוכנה.":"(no draw) with a medium hand — a bluff that signals a made hand.","הסולבר מראה את האקוויטי של כל החלפה מול יריבים שמחליפים בעצמם.":"The solver shows the equity of every draw option against opponents who draw too.","למה הבית תמיד מנצח":"Why the house always wins","על מספר בודד מקבלים 35:1, אבל יש 37 תאים (אירופאית) או 38 (אמריקאית). התשלום":"A single number pays 35:1, but there are 37 pockets (European) or 38 (American). A","ההוגן":"fair","היה 36:1 או 37:1 — ההפרש הוא יתרון הבית.":"payout would be 36:1 or 37:1 — the difference is the house edge.","אירופאית: 1/37 =":"European: 1/37 =","מכל הימור.":"of every bet.","אמריקאית: 2/38 =":"American: 2/38 =","— כמעט כפול. תמיד לבחור אירופאית.":"— almost double. Always choose European.","אותו יתרון לכל הימור: אדום, תריסר או מספר בודד. משתנה רק כמה התוצאה":"The same edge on every bet: red, a dozen or a single number. Only how much the result","קופצת":"swings","אסטרטגיית Jacks or Better":"Jacks or Better strategy","בטבלת 9/6 (פול האוס 9, צבע 6) המשחק מחזיר 99.54% — הכי קרוב לשוויון בקזינו. תנאי: לשחק 5 מטבעות (הרויאל קופץ ל-800 למטבע) ולהחזיק נכון.":"With the 9/6 pay table (full house 9, flush 6) the game returns 99.54% — the closest to break-even in the casino. Conditions: play 5 coins (the royal jumps to 800 per coin) and hold correctly.","סדר עדיפויות מקוצר (מהגבוה):":"Short priority list (highest first):","יד מוכנה של רצף ומעלה · 4 לרויאל":"Made straight or better · 4 to a royal","שלישייה · שני זוגות · 4 לרצף צבע":"Trips · two pair · 4 to a straight flush","זוג גבוה (J+) · 3 לרויאל · 4 לצבע":"High pair (J+) · 3 to a royal · 4 to a flush","זוג נמוך · 4 לרצף פתוח · 2 קלפים גבוהים בצבע":"Low pair · 4 to an open straight · 2 suited high cards","קלפים גבוהים בודדים · אחרת — להחליף הכל":"Single high cards · otherwise — draw all five","הסולבר בשולחן מחשב את כל 32 האפשרויות במדויק, אז כל טעות מקבלת מספר.":"The solver at the table calculates all 32 options exactly, so every mistake gets a number.","כללי":"General","ניהול כסף ומשחק אחראי":"Bankroll management and responsible play","בכל משחק כאן — חוץ מבלאק ג׳ק עם ספירה ופוקר מול שחקנים חלשים — התוחלת שלילית. הכסף זז לבית לאט אבל בטוח.":"In every game here — except blackjack with counting and poker against weak players — the expected value is negative. Money moves to the house slowly but surely.","קבעו סכום לסשן מראש, והפסיקו כשהוא נגמר.":"Set an amount for the session in advance, and stop when it's gone.","שיטות הימור (מרטינגייל, פיבונאצ׳י) לא משנות את התוחלת. הן רק מחליפות הרבה רווחים קטנים בהפסד גדול ונדיר.":"Betting systems (Martingale, Fibonacci) don't change the expected value. They just trade many small wins for a rare big loss.","המשחק הזה הוא עם צ׳יפים וירטואליים בלבד. אם הימורים אמיתיים מתחילים להרגיש לא בשליטה — אפשר לפנות לקו הסיוע של הרשות למלחמה בסמים והתמכרויות.":"This game uses virtual chips only. If real gambling starts to feel out of control — reach out to a gambling support helpline in your country.","מאמן ספירת קלפים":"Card counting trainer","קלפים רצים על המסך — מה הספירה? הקצב עולה":"Cards fly across the screen — what's the count? The pace keeps rising","ספירה רצה וחפיסות שנשארו → הספירה האמיתית":"Running count and decks left → the true count","פתיחה לפני הפלופ":"Pre-flop opening","יד ופוזיציה → רייז או פולד":"Hand and position → raise or fold","מאמן אסטרטגיה בסיסית":"Basic strategy trainer","יד + קלף דילר → בחר מהלך":"Hand + dealer card → choose a move","סיכויי קופה: קול או פולד?":"Pot odds: call or fold?","קופה, הימור ואאוטים":"Pot, bet and outs","מי מנצח?":"Who wins?","שתי ידיים ולוח — בחר את הזוכה":"Two hands and a board — pick the winner","אקדמיה":"Academy","/6 תעודות":"/6 certificates","סימולטור אסטרטגיה — בלאק ג׳ק":"Strategy simulator — blackjack","תחושה מול אסטרטגיה בסיסית מול ספירה, על עשרות אלפי ידיים":"Gut feeling vs basic strategy vs counting, over tens of thousands of hands","מבחני סיום":"Final exams","90% ומעלה = תעודה ו-200 XP. השאלות משתנות בכל פעם.":"90% or more = a certificate and 200 X atically on the join screen.","הוזמנת לאתגר — הקוד כבר מולא.":"You've been invited to a challenge — the code is filled in.","טורניר גדול":"Big tournament","יד יפה!":"Nice hand!","בהצלחה":"Good luck","אוי":"Ouch","צ׳אט":"Chat","צ׳אט החדר":"Room chat","הודעה…":"Message…","שלח":"Send","עוד אין הודעות":"No messages yet","פיינאפל וקרייזי פיינאפל":"Pineapple and Crazy Pineapple","וריאציה של טקסס הולדם: כל שחקן מקבל":"A Texas Hold'em variant: every player gets","3 קלפים":"3 cards","וזורק אחד, ומשם המשחק זהה להולדם (2 ביד + 5 על השולחן).":"and discards one, and from there the game is the same as Hold'em (2 in hand + 5 on the board).","פיינאפל:":"Pineapple:","זורקים אחרי סבב ההימורים הראשון, לפני הפלופ.":"discard after the first betting round, before the flop.","קרייזי פיינאפל:":"Crazy Pineapple:","משחקים את הפלופ עם 3 קלפים, וזורקים רק אחרי סבב ההימורים של הפלופ.":"play the flop with 3 cards, and discard only after the flop betting round.","הידיים חזקות יותר מבהולדם רגיל, אז זוג גבוה שווה פחות. צבעים ורצפים נפוצים יותר.":"Hands are stronger than in regular Hold'em, so a high pair is worth less. Flushes and straights are more common.","לפני הזריקה: שמרו זוג אם יש, אחרת את שני הקלפים הגבוהים או את אלה שבאותה צורה ומחוברים.":"Before discarding: keep a pair if you have one, otherwise the two highest cards or the suited, connected ones.","בקרייזי: אחרי הפלופ זרקו את הקלף שהכי פחות מתחבר ללוח, גם אם הוא גבוה.":"In Crazy: after the flop, discard the card that connects least with the board, even if it's high.","היריבים זורקים גם הם את הקלף הכי גרוע שלהם — לכן הם חזקים יותר ממה שנראה.":"Opponents also discard their worst card — so they're stronger than they look.","Push/Fold — סוף טורניר":"Push/Fold — late tournament","כשנשארים עם 15 בליינדים או פחות, אין מקום לרייז קטן ולפלופ: אם תעלה ותקבל רייז, תצטרך לזרוק. לכן משחקים":"With 15 blinds or fewer there's no room for a small raise and a flop: if you raise and get re-raised, you'll have to fold. So you play","דחוף או קפל":"push or fold","— אול-אין או פולד.":"— all-in or fold.","ככל שהסטאק קצר יותר — דוחפים יותר ידיים.":"The shorter the stack — the more hands you push.","ככל שהפוזיציה מאוחרת יותר — דוחפים יותר (פחות שחקנים יכולים להתעורר עם יד).":"The later the position — the more you push (fewer players can wake up with a hand).","היתרון של הדחיפה הוא שגם כשמקבלים קול, יש לך עדיין 30–50% לנצח, ופעמים רבות כולם פשוט מקפלים.":"The advantage of pushing is that even when called you still have 30–50% to win, and often everyone just folds.","בטורנירים הסולבר עובר אוטומטית לטבלה הזו כשהסטאק שלך מתחת ל-15 בליינדים.":"In tournaments the solver switches to this chart automatically when your stack drops below 15 blinds.","לובי":"Lobby","אתגרים":"Challenges","דירוג":"Ranking","פרופיל":"Profile","סיכום הסשן ·":"Session summary ·","הזכייה הגדולה":"Biggest win","זמן":"Time","דק׳":"min","סשן טוב. זכרו: בטווח הארוך יתרון הבית מנצח — המזל לא נשאר תמיד.":"Good session. Remember: in the long run the house edge wins — luck doesn't last forever.","הפסדים הם חלק מהמשחק. היסטוריית הידיים מראה איפה ההחלטות עלו כסף.":"Losses are part of the game. The hand history shows where your decisions cost money.","יצאת באפס.":"You broke even.","כינוי":"Nickname","איך יקראו לך בשולחן":"What they'll call you at the table","רווח כולל":"Total profit","המשחק האהוב":"Favorite game","תעודות · הישגים":"Certificates · achievements","סטטיסטיקה וגרף יתרה":"Stats and balance graph","רווח, דיוק ומזל לאורך זמן":"Profit, accuracy and luck over time","ידיים · ניתוח כל החלטה":"hands · analysis of every decision","תצוגה ותחושה":"Look and feel","חפיסה בארבעה צבעים":"Four-color deck","♦ כחול ו-♣ ירוק — קל יותר לזהות צבע בפוקר":"♦ blue and ♣ green — easier to tell suits apart in poker","משחק מהיר":"Fast play","חלוקה, בוטים וגלגל מהירים יותר":"Faster dealing, bots and wheel","רטט":"Vibration","בטלפונים שתומכים":"On phones that support it","חשבון ושמירה":"Account and saving","מדריכים":"Tutorials","יד מודרכת ראשונה בכל משחק":"A guided first hand in every game","הפעל מחדש":"Restart","הגדרות נוספות":"More settings","לוח ניהול":"Admin panel","הודעות, חדרים, שחקנים ומתנות":"Announcements, rooms, players and gifts","מתחילים":"Beginner","מתקדמים":"Intermediate","מומחים":"Expert","מכפילים את ההימור על אדום אחרי כל הפסד, עד שמרוויחים 100 או נגמר הכסף (קופה 1,000, הימור בסיס 10). 1,000 סשנים:":"Double the bet on red after every loss, until you're up 100 or out of money (bankroll 1,000, base bet 10). 1,000 sessions:","מה זו תוחלת":"What is expected value","מה זו תוחלת?":"What is expected value?","תוחלת (EV — Expected Value) היא כמה מרוויחים או מפסידים":"Expected value (EV) is how much you win or lose","בממוצע":"on average","בכל הימור, אם חוזרים עליו המון פעמים.":"per bet, if you repeat it many, many times.","החישוב: כל תוצאה כפול הסיכוי שלה, ומחברים.":"The calculation: each outcome times its probability, added up.","EV = סיכוי לזכות × רווח − סיכוי להפסיד × הפסד":"EV = chance to win × profit − chance to lose × loss","דוגמה: מטבע":"Example: a coin","מהמרים 10 על":"You bet 10 on","עץ":"heads",". עץ — מרוויחים 10, פלי — מפסידים 10.":". Heads — you win 10, tails — you lose 10.","משחק הוגן. עכשיו נניח שעל עץ משלמים רק 9:":"A fair game. Now suppose heads only pays 9:","בכל הימור של 10 מפסידים בממוצע חצי צ׳יפ. כך בדיוק קזינו מרוויח.":"On every bet of 10 you lose half a chip on average. That's exactly how a casino makes money.","יתרון הבית הוא התוחלת השלילית של השחקן, באחוזים מההימור. ברולטה אירופאית הוא 2.7%: מכל 100 שמהמרים, הקזינו שומר בממוצע 2.70.":"The house edge is the player's negative expected value, as a percentage of the bet. In European roulette it's 2.7%: of every 100 bet, the casino keeps 2.70 on average.","בטווח קצר הכל יכול לקרות. בטווח ארוך — התוצאה נצמדת לתוחלת.":"In the short run anything can happen. In the long run — the result hugs the expected value.","מטבע הוגן: מרוויחים 10 בניצחון ומפסידים 10 בהפסד. מה התוחלת?":"A fair coin: you win 10 on a win and lose 10 on a loss. What's the EV?","הימור משלם 2 בזכייה (סיכוי 30%) ומפסיד 1 בהפסד. מה התוחלת?":"A bet pays 2 on a win (30% chance) and loses 1 on a loss. What's the EV?","יתרון בית של 5% אומר ש…":"A 5% house edge means…","בממוצע מפסידים 5 על כל 100 שמהמרים":"On average you lose 5 for every 100 you bet","מפסידים ב-5% מהסיבובים":"You lose 5% of rounds","הקזינו מנצח ב-55% מהפעמים":"The casino wins 55% of the time","אחרי 20 הימורים בטוח מפסידים":"After 20 bets you're sure to lose","זה ממוצע לטווח ארוך, לא תוצאה של סיבוב.":"It's a long-run average, not the result of one round.","שיחקת 10 ידיים בהימור עם תוחלת שלילית והרווחת. מה זה אומר?":"You played 10 hands of a negative-EV bet and won. What does that mean?","שהיה לך מזל בטווח הקצר":"You got lucky in the short run","שהתוחלת בעצם חיובית":"The EV is actually positive","שמצאת שיטה":"You found a system","שהקזינו טעה":"The casino made a mistake","בטווח קצר המזל גדול מהתוחלת.":"In the short run luck outweighs expected value.","מה התוחלת של הימור 100 על אדום ברולטה אירופאית?":"What's the EV of a 100 bet on red in European roulette?","כ-−2.70":"About −2.70","כ-−5.26":"About −5.26","כ-+2.70":"About +2.70","הסתברות בקלפים ובגלגל":"Probability with cards and wheels","הסתברות בסיסית":"Basic probability","הסתברות = מספר התוצאות המתאימות ÷ מספר כל התוצאות.":"Probability = number of matching outcomes ÷ number of all outcomes.","בחפיסה 52 קלפים: 4 צורות × 13 ערכים. הסיכוי לשלוף אס: 4/52 ≈ 7.7%. הסיכוי ללב: 13/52 = 25%.":"A 52-card deck: 4 suits × 13 ranks. The chance to draw an ace: 4/52 ≈ 7.7%. The chance of a heart: 13/52 = 25%.","או":"or","ו":"and","וגם":"and","(תוצאות שלא חופפות): מחברים. אס או מלך: 4/52 + 4/52 ≈ 15.4%.":"(non-overlapping outcomes): add them. Ace or king: 4/52 + 4/52 ≈ 15.4%.","(בזה אחר זה): מכפילים. שני אסים ברצף: 4/52 × 3/51 ≈ 0.45%.":"(one after another): multiply them. Two aces in a row: 4/52 × 3/51 ≈ 0.45%.","לפחות פעם אחת":"at least once",": 1 פחות הסיכוי שזה אף פעם לא קורה.":": 1 minus the chance it never happens.","תלוי או בלתי תלוי":"Dependent or independent","ברולטה, בקוביות ובמטבע כל סיבוב לא יודע מה קרה קודם. אחרי 5 אדומים ברצף, הסיכוי לאדום נשאר 18/37.":"In roulette, dice and coins, each round doesn't know what happened before. After 5 reds in a row, the chance of red stays 18/37.","בקלפים זה שונה: קלף שיצא כבר לא בחפיסה. זה הבסיס לספירת קלפים בבלאק ג׳ק.":"Cards are different: a card that's been dealt is no longer in the deck. That's the basis of card counting in blackjack.","מה הסיכוי לשלוף קלף תמונה (J, Q, K)?":"What's the chance of drawing a face card (J, Q, K)?","3 ערכים × 4 צורות = 12.":"3 ranks × 4 suits = 12.","מה הסיכוי ששני הקלפים הראשונים יהיו אסים?":"What's the chance that the first two cards are both aces?","כ-0.45%":"About 0.45%","כ-7.7%":"About 7.7%","כ-1.5%":"About 1.5%","כ-15%":"About 15%","יצא אדום 6 פעמים ברצף. מה הסיכוי לשחור עכשיו (אירופאית)?":"Red came up 6 times in a row. What's the chance of black now (European)?","פחות מ-40%":"Less than 40%","למה ספירת קלפים עובדת בבלאק ג׳ק ולא ברולטה?":"Why does card counting work in blackjack and not in roulette?","קלפים שיצאו לא חוזרים לנעל עד הערבוב":"Dealt cards don't return to the shoe until the shuffle","בבלאק ג׳ק יש פחות שחקנים":"Blackjack has fewer players","הדילר עושה טעויות":"The dealer makes mistakes","ברולטה יש 0":"Roulette has a 0","בבלאק ג׳ק הסיכויים משתנים לפי מה שיצא.":"In blackjack the odds change based on what's been dealt.","מה הסיכוי שבשתי הטלות מטבע ייצא לפחות עץ אחד?":"What's the chance of at least one heads in two coin flips?","יתרון הבית בכל משחק":"The house edge in every game","טבלת יתרון הבית":"House edge table","וידאו פוקר 9/6 (משחק מושלם)":"Video poker 9/6 (perfect play)","בלאק ג׳ק עם אסטרטגיה בסיסית":"Blackjack with basic strategy","באקרה — בנקאי":"Baccarat — Banker","באקרה — שחקן":"Baccarat — Player","רולטה אירופאית":"European roulette","פוקר 3 קלפים — אנטה":"Three Card Poker — Ante","הימורי צד בבלאק ג׳ק":"Blackjack side bets","רולטה אמריקאית":"American roulette","באקרה — טאי":"Baccarat — Tie","בפוקר רגיל אין יתרון בית: משחקים נגד שחקנים, והקזינו גובה עמלה מכל קופה (rake).":"Regular poker has no house edge: you play against other players, and the casino takes a fee from each pot (rake).","מה זה אומר בכסף":"What this means in money","ההפסד הצפוי = סכום כל ההימורים × יתרון הבית. מי שמהמר 25 ליד ו-60 ידיים בשעה מגלגל 1,500 בשעה:":"Expected loss = total of all bets × house edge. Someone betting 25 a hand at 60 hands an hour wagers 1,500 an hour:","בלאק ג׳ק עם אסטרטגיה (0.5%): כ-7.5 לשעה.":"Blackjack with strategy (0.5%): about 7.5 an hour.","רולטה אירופאית (2.7%): כ-40 לשעה.":"European roulette (2.7%): about 40 an hour.","טאי בבאקרה (14.4%): כ-216 לשעה.":"Baccarat Tie (14.4%): about 216 an hour.","אותו כסף, אותו זמן — הבדל של פי 30.":"Same money, same time — a 30× difference.","איזה הימור הכי טוב לשחקן מהרשימה?":"Which bet on the list is best for the player?","בנקאי בבאקרה":"Banker in baccarat","טאי בבאקרה":"Tie in baccarat","מספר ברולטה אמריקאית":"A number in American roulette","1.06% לעומת 14.4%, 5.26% וכ-6%.":"1.06% vs 14.4%, 5.26% and about 6%.","למה בפוקר אין יתרון בית?":"Why is there no house edge in poker?","משחקים נגד שחקנים, והקזינו לוקח עמלה":"You play against players, and the casino takes a fee","הקלפים הוגנים יותר":"The cards are fairer","הדילר לא משחק":"The dealer doesn't play","זה אסור בחוק":"It's illegal","הכסף עובר בין השחקנים.":"The money moves between the players.","מהמרים 20 ליד, 50 ידיים בשעה, ביתרון בית 2%. מה ההפסד הצפוי לשעה?":"You bet 20 a hand, 50 hands an hour, at a 2% house edge. What's the expected loss per hour?","1,000 מגלגלים × 2%.":"1,000 wagered × 2%.","מה יתרון הבית בבלאק ג׳ק למי שלא יודע אסטרטגיה?":"What's the blackjack house edge for someone who doesn't know strategy?","כ-2% ויותר":"About 2% or more","טעויות מכפילות אותו פי 4 ויותר.":"Mistakes multiply it 4× or more.","שונות: מזל מול מתמטיקה":"Variance: luck vs math","שונות":"Variance","התוחלת אומרת מה קורה בממוצע. השונות אומרת כמה התוצאות קופצות מסביב לממוצע.":"Expected value tells you what happens on average. Variance tells you how much results jump around the average.","הימור על אדום: תוצאות קרובות לאפס. הימור על מספר בודד: רוב הזמן מפסידים, ופעם ב-37 זוכים פי 35 — אותה תוחלת, שונות ענקית.":"A bet on red: results close to zero. A bet on a single number: most of the time you lose, and once in 37 you win 35× — same expected value, huge variance.","חוק המספרים הגדולים":"The law of large numbers","ככל שמשחקים יותר, הממוצע מתקרב לתוחלת. אחרי 10 סיבובים אפשר להיות ברווח גדול; אחרי 10,000 כמעט בטוח שתהיה קרוב ל":"The more you play, the closer the average gets to the expected value. After 10 spins you can be well up; after 10,000 you'll almost certainly be close to","מינוס יתרון הבית":"minus the house edge","מזל מכריע ערב אחד — מתמטיקה מכריעה שנה.":"Luck decides an evening — math decides a year.","מה זה אומר לשחקן":"What this means for a player","שופטים החלטה לפי התוחלת, לא לפי התוצאה. דאבל על 11 שהפסיד עדיין היה נכון.":"Judge a decision by its expected value, not its result. A double on 11 that lost was still right.","רצף הפסדים לא אומר שמשהו":"A losing streak doesn't mean something","חייב":"has","להשתנות.":"to change.","בגרף היתרה בפרופיל רואים את הקו שלך מול הקו הצפוי — זו השונות בפעולה.":"The balance graph in your profile shows your line against the expected line — that's variance in action.","עשית דאבל על 11 מול 6 והפסדת. איך לשפוט את ההחלטה?":"You doubled on 11 vs 6 and lost. How should you judge the decision?","היא הייתה נכונה — התוצאה היא מזל":"It was right — the result is luck","טעות, כי הפסדת":"A mistake, because you lost","צריך לבדוק עוד 2 ידיים":"Need to check 2 more hands","אין דרך לדעת":"There's no way to know","מעריכים החלטה לפי התוחלת שלה.":"You evaluate a decision by its expected value.","מה ההבדל בין הימור על אדום לבין מספר בודד ברולטה?":"What's the difference between betting red and a single number in roulette?","אותה תוחלת, שונות שונה מאוד":"Same expected value, very different variance","למספר בודד תוחלת טובה יותר":"A single number has better EV","לאדום אין יתרון בית":"Red has no house edge","אין הבדל":"No difference","שניהם −2.7%.":"Both are −2.7%.","מה אומר חוק המספרים הגדולים?":"What does the law of large numbers say?","עם הרבה סיבובים הממוצע מתקרב לתוחלת":"With many rounds the average approaches the expected value","אחרי הפסדים מגיעים ניצחונות":"Wins come after losses","מי שמהמר יותר מרוויח יותר":"Whoever bets more wins more","ההסתברויות משתנות עם הזמן":"Probabilities change over time","הוא מדבר על ממוצע, לא על":"It's about averages, not about","תיקון":"correcting","רצפים.":"streaks.","הפסדת 8 ידיים ברצף בבלאק ג׳ק. מה הכי נכון?":"You lost 8 blackjack hands in a row. What's the right move?","להמשיך לפי האסטרטגיה בהימור הרגיל":"Keep playing by strategy at your normal bet","להכפיל כדי להחזיר":"Double up to win it back","לשנות אסטרטגיה":"Change strategy","לעבור לשולחן":"Move to a","חם":"hot","רצפים הם חלק נורמלי מהשונות.":"Streaks are a normal part of variance.","ניהול כסף":"Money management","תקציב של 1,000. מה גודל הימור סביר?":"Budget of 1,000. What's a reasonable bet size?","הכל בבת אחת":"All at once","1%–2% מהתקציב.":"1%–2% of the budget.","מה זה":"What is","לרדוף אחרי הפסדים":"chasing losses","להגדיל הימורים כדי להחזיר כסף שהפסדת":"Raising bets to win back money you lost","לעצור אחרי הפסד":"Stopping after a loss","לעבור משחק":"Switching games","לשחק לאט":"Playing slowly","זה מגדיל סיכון בלי לשנות תוחלת.":"It increases risk without changing expected value.","איזו שיטת הימור הופכת את הרולטה לרווחית?":"Which betting system makes roulette profitable?","אף אחת":"None","מרטינגייל":"Martingale","פיבונאצ׳י":"Fibonacci","דלמבר":"D'Alembert","סכום של הימורים שליליים נשאר שלילי.":"A sum of negative bets stays negative.","מה הערך הכספי של הצ׳יפים במשחק הזה?":"What's the cash value of the chips in this game?","אין — זה לבידור ולימוד":"None — it's for fun and learning","אפשר לפדות אותם":"You can cash them out","הם שווים שקלים":"They're worth real money","אפשר להעביר לבנק":"You can transfer them to a bank","צ׳יפים וירטואליים בלבד.":"Virtual chips only.","כללים מעשיים":"Practical rules","תקציב לסשן":"Session budget",": סכום שמוכנים להפסיד, ולא יותר.":": an amount you're willing to lose, and no more.","גודל יחידה":"Unit size",": 1%–2% מהתקציב לכל הימור מאפשר לשרוד תנודות.":": 1%–2% of the budget per bet lets you survive swings.","מגבלת הפסד":"Loss limit",": מחליטים מראש מתי עוצרים — ולא":": decide in advance when you stop — and not","רק עוד יד אחת":"just one more hand","לא רודפים":"Don't chase",": הגדלת הימור אחרי הפסד מגדילה רק את הסיכון.":": raising your bet after a loss only raises the risk.","הטעות של המהמר ומערכות הימור":"The gambler's fallacy and betting systems","הטעות של המהמר":"The gambler's fallacy","יצא אדום 7 פעמים — עכשיו חייב לצאת שחור.":"Red came up 7 times — now black has to come.","זו הטעות הנפוצה ביותר בקזינו. לגלגל, לקובייה ולמטבע אין זיכרון.":"It's the most common mistake in the casino. Wheels, dice and coins have no memory.","גם ההפך שגוי:":"The opposite is wrong too:","היד חמה":"a hot hand","— רצף ניצחונות לא מנבא את הבא.":"— a winning streak doesn't predict the next one.","מערכות הימור":"Betting systems",": מכפילים אחרי כל הפסד. רוב הזמן רווח קטן, ולפעמים הפסד ענק כשמגיעים לגבול השולחן או לסוף הכסף.":": double after every loss. Most of the time a small win, and sometimes a huge loss when you hit the table limit or run out of money.","פיבונאצ׳י / דלמבר":"Fibonacci / D'Alembert",": אותו רעיון בעלייה איטית יותר.":": the same idea with a slower climb.","אף מערכת לא הופכת הימורים עם תוחלת שלילית לרווחיים — היא רק משנה את צורת הסיכון.":"No system turns negative-EV bets into profitable ones — it only changes the shape of the risk.","יצא שחור 5 פעמים ברצף. מה נכון?":"Black came up 5 times in a row. What's true?","הסיכוי לאדום בסיבוב הבא לא השתנה":"The chance of red next spin hasn't changed","עכשיו יותר סביר אדום":"Red is now more likely","עכשיו יותר סביר שחור":"Black is now more likely","הגלגל מקולקל":"The wheel is broken","כל סיבוב עצמאי.":"Each spin is independent.","מה החולשה של מרטינגייל?":"What's the weakness of the Martingale?","רצף הפסדים קצר מגיע לגבול השולחן או מוחק את הקופה":"A short losing streak hits the table limit or wipes out the bankroll","מפסידה כל סיבוב":"It loses every round","אסורה בקזינו":"It's banned in casinos","מסובכת לחישוב":"It's complicated to calculate","אחרי 8 הפסדים ההימור פי 256.":"After 8 losses the bet is 256×.","מה מערכת הימור באמת משנה?":"What does a betting system really change?","את צורת התוצאות, לא את התוחלת":"The shape of the results, not the expected value","את יתרון הבית":"The house edge","את הסיכוי בכל סיבוב":"The chance in each round","את המספרים שיוצאים":"The numbers that come up","התוחלת נשארת שלילית.":"The expected value stays negative.","היד חמה, ממשיך להעלות":"I'm on a hot streak, I'll keep raising",". מה הבעיה?":". What's the problem?","ניצחונות קודמים לא משפיעים על הבא":"Previous wins don't affect the next one","אין בעיה":"No problem","צריך להוריד הימור":"You should lower your bet","זה נכון רק ברולטה":"It's only true in roulette","הטעות ההפוכה של המהמר.":"The reverse gambler's fallacy.","כמה שווה מלך?":"What's a king worth?","כל קלפי התמונה שווים 10.":"All face cards are worth 10.","מה זו יד":"What is a","יד עם אס שנספר כ-11":"A hand with an ace counted as 11","יד מתחת ל-12":"A hand under 12","יד בלי קלפי תמונה":"A hand with no face cards","יד של שני קלפים":"A two-card hand","אפשר לקחת קלף בלי להישרף.":"You can take a card without busting.","מה עושה דאבל?":"What does a double do?","מכפיל את ההימור ומקבל קלף אחד בלבד":"Doubles the bet and gets exactly one card","מכפיל ומקבל כמה קלפים שרוצים":"Doubles and gets as many cards as you want","מפצל את היד":"Splits the hand","מוותר על חצי":"Gives up half","כמה מחזירה כניעה?":"What does surrender return?","חצי מההימור":"Half the bet","את כל ההימור":"The whole bet","פי 1.5":"1.5×","איזה זוג תמיד מפצלים?":"Which pair do you always split?","אסים ושמיניות":"Aces and eights","עשרות":"Tens","חמישיות":"Fives","רביעיות":"Fours","ספירת היד: רך, קשה וטבעי":"Counting your hand: soft, hard and natural","חישוב יד":"Counting a hand","2–10: לפי המספר.":"2–10: face value.","A: 1 או 11 — מה שטוב יותר בלי לעבור 21.":"A: 1 or 11 — whichever is better without going over 21.","A+6 = 7 או 17 —":"A+6 = 7 or 17 —","17 רך":"soft 17",". אם מוסיפים 9: האס הופך ל-1 → 16 קשה.":". Add a 9: the ace becomes 1 → hard 16.","בלאק ג׳ק טבעי":"Natural blackjack","A עם 10 או תמונה בשני הקלפים הראשונים = 21":"An A with a 10 or face card in the first two cards = 21","טבעי":"natural",". הוא מנצח כל 21 אחר ומשלם 3:2 (על 10 מקבלים 15). 21 אחרי פיצול הוא 21 רגיל.":". It beats any other 21 and pays 3:2 (bet 10, get 15). 21 after a split is a regular 21.","מעל 21 = הפסד מיידי, גם אם הדילר יישרף אחר כך. זה היתרון המרכזי של הקזינו: השחקן משחק ראשון.":"Over 21 = immediate loss, even if the dealer busts later. That's the casino's main edge: the player acts first.","16 קשה":"Hard 16","16 רך":"Soft 16","האס הופך ל-1.":"The ace becomes 1.","כמה משלם בלאק ג׳ק טבעי על הימור 20 (3:2)?":"What does a natural blackjack pay on a bet of 20 (3:2)?","השחקן נשרף והדילר גם נשרף. מה קורה?":"The player busts and the dealer busts too. What happens?","השחקן הפסיד":"The player loses","השחקן ניצח":"The player wins","מחלקים מחדש":"Redeal","השחקן משחק ראשון.":"The player acts first.","A+K אחרי פיצול אסים — בלאק ג׳ק?":"A+K after splitting aces — blackjack?","לא, זה 21 רגיל":"No, it's a regular 21","כן, משלם 3:2":"Yes, pays 3:2","כן, משלם 2:1":"Yes, pays 2:1","תיקו אוטומטי":"Automatic tie","הדילר וחוקי השולחן":"The dealer and the table rules","לדילר אין החלטות":"The dealer has no decisions","הדילר לוקח קלף עד 16 ועוצר מ-17. בחלק מהשולחנות הוא לוקח גם על 17 רך (H17) — זה כתוב על הבד.":"The dealer hits until 16 and stands from 17. At some tables they also hit soft 17 (H17) — it's printed on the felt.","הקלף הגלוי":"The up card","2–6 הם קלפים":"2–6 are","חלשים":"weak",": הדילר ייאלץ לקחת ויישרף בכ-35%–42%. 7 עד A":"cards: the dealer will have to hit and busts about 35%–42% of the time. 7 through A are","חזקים":"strong",": הוא נשרף רק 17%–26%.":": they bust only 17%–26%.","מכאן האסטרטגיה: מול קלף חלש — זהירות ודאבלים; מול חזק — צריך לשפר את היד.":"Hence the strategy: against a weak card — caution and doubles; against a strong one — you need to improve your hand.","הצצה וביטוח":"Peek and insurance","כשלדילר A או 10 גלוי הוא מציץ אם יש לו בלאק ג׳ק לפני שאתה משחק. מול A מציעים ביטוח (חצי מההימור, משלם 2:1). בלי ספירת קלפים — לא לוקחים.":"When the dealer shows an A or a 10, they peek for blackjack before you play. Against an A you're offered insurance (half your bet, pays 2:1). Without counting cards — don't take it.","לדילר 16. מה הוא עושה?":"The dealer has 16. What do they do?","לוקח קלף":"Hit","עוצר":"Stand","בוחר לפי השחקנים":"Choose based on the players","מפצל":"Split","באיזה קלף גלוי הדילר נשרף הכי הרבה?":"Which up card makes the dealer bust most?","מול 5 ו-6 כ-42%.":"Against 5 and 6, about 42%.","מה זה H17?":"What is H17?","הדילר לוקח קלף על 17 רך":"The dealer hits soft 17","הדילר עוצר על 17":"The dealer stands on 17","השחקן חייב לקחת על 17":"The player must hit on 17","הבית משלם 17:1":"The house pays 17:1","לקחת ביטוח בלי ספירה?":"Take insurance without counting?","לא — הוא מפסיד כ-7%":"No — it loses about 7%","כן, תמיד":"Yes, always","רק עם בלאק ג׳ק":"Only with blackjack","רק מול A אדום":"Only against a red A","כמה משלם ביטוח כשלדילר בלאק ג׳ק?":"What does insurance pay when the dealer has blackjack?","אין תשלום":"No payout","אסטרטגיה בסיסית: ידיים קשות":"Basic strategy: hard hands","הכללים החשובים":"The key rules","17 ומעלה: תמיד עומדים.":"17 and up: always stand.","13–16 מול 2–6: עומדים. מול 7–A: קלף (או כניעה ב-15/16).":"13–16 vs 2–6: stand. Vs 7–A: hit (or surrender on 15/16).","12: עומדים רק מול 4–6.":"12: stand only vs 4–6.","11: דאבל (חוץ ממול A כשהדילר עומד על 17 רך). 10: דאבל מול 2–9. 9: דאבל מול 3–6.":"11: double (except vs A when the dealer stands on soft 17). 10: double vs 2–9. 9: double vs 3–6.","13 מול 2?":"13 vs 2?","12 מול 3?":"12 vs 3?","10 מול 9?":"10 vs 9?","ידיים רכות וזוגות":"Soft hands and pairs","19 רך ומעלה: עומדים.":"Soft 19 and up: stand.","A,7 (18 רך): עומדים מול 2, 7, 8; דאבל מול 3–6; קלף מול 9, 10, A.":"A,7 (soft 18): stand vs 2, 7, 8; double vs 3–6; hit vs 9, 10, A.","A,2 עד A,6: דאבל מול 4–6 (A,6 גם מול 3), אחרת קלף.":"A,2 to A,6: double vs 4–6 (A,6 also vs 3), otherwise hit.","תמיד: A,A ו-8,8. אף פעם: 10,10 ו-5,5.":"Always: A,A and 8,8. Never: 10,10 and 5,5.","9,9: מפצלים חוץ ממול 7, 10, A.":"9,9: split except vs 7, 10, A.","2,2 / 3,3 / 7,7 מול 2–7. 6,6 מול 2–6. 4,4 רק מול 5–6.":"2,2 / 3,3 / 7,7 vs 2–7. 6,6 vs 2–6. 4,4 only vs 5–6.","A,7 מול 9?":"A,7 vs 9?","18 רך לא מספיק מול 9.":"Soft 18 isn't enough vs 9.","5,5 מול 6?":"5,5 vs 6?","5,5 משחקים כמו 10.":"5,5 plays like 10.","9,9 מול 7?":"9,9 vs 7?","18 כבר מנצח את ה-17 הצפוי.":"18 already beats the expected 17.","5 טעויות יקרות":"5 costly mistakes","מה הבעיה בפיצול 10,10?":"What's wrong with splitting 10,10?","הורסים 20 שמנצח ברוב המקרים":"You break up a 20 that wins most of the time","מאבדים ביטוח":"You lose insurance","מותר רק ב-H17":"Only allowed with H17","עם בלאק ג׳ק מול A?":"with blackjack vs an A?","זה ביטוח — לא כדאי בלי ספירה":"It's insurance — not worth it without counting","תמיד לקחת":"Always take it","זה אסור":"It's not allowed","משלם 3:2":"Pays 3:2","לדילר 10, אז עם 16 אני עומד":"The dealer has a 10, so I stand on 16",". נכון?":". Right?","לא — כניעה, ואם אין, קלף":"No — surrender, and if you can't, hit","רק בשולחן 6:5":"Only at a 6:5 table","רק עם 3 קלפים":"Only with 3 cards","איך החוקים משנים את היתרון":"How the rules change the edge","איזה חוק הכי יקר לשחקן?":"Which rule costs the player the most?","דילר H17":"Dealer H17","כ-1.4%.":"About 1.4%.","מה עדיף לשחקן?":"Which is better for the player?","יותר חפיסות":"More decks","רק 8":"Only 8","כמה מוסיף H17 ליתרון הבית?":"How much does H17 add to the house edge?","כ-0.2%":"About 0.2%","כניעה מאוחרת מותרת. זה…":"Late surrender is allowed. That's…","טוב לשחקן":"Good for the player","רע לשחקן":"Bad for the player","לא משנה":"Makes no difference","טוב רק לדילר":"Good only for the dealer","מה הספירה הרצה אחרי: 5, K, 3, A, 6?":"What's the running count after: 5, K, 3, A, 6?","ספירה גבוהה אומרת ש…":"A high count means…","נשארו הרבה 10 ואסים — טוב לשחקן":"Lots of 10s and aces remain — good for the player","נשארו הרבה קלפים נמוכים":"Lots of low cards remain","הדילר ינצח":"The dealer will win","צריך לעזוב":"You should leave","ספירה אמיתית וגובה הימור":"True count and bet size","למה מחלקים בחפיסות":"Why divide by decks","+6 כשנשארה חפיסה אחת זה המון 10 ואסים ביחס לקלפים. +6 עם 6 חפיסות — כמעט כלום. ספירה אמיתית = ספירה רצה ÷ חפיסות שנשארו.":"+6 with one deck left is a lot of 10s and aces relative to the cards. +6 with 6 decks — almost nothing. True count = running count ÷ decks remaining.","מרווח הימורים":"Bet spread","ספירה אמיתית 1 ומטה: יחידה אחת.":"True count 1 and below: one unit.","+2: 2 יחידות. +3: 4. +4: 6. +5 ומעלה: 8.":"+2: 2 units. +3: 4. +4: 6. +5 and up: 8.","היתרון מגיע מגודל ההימור: מעט כשהקזינו מוביל, הרבה כשאתה מוביל. בסימולטור באקדמיה רואים את זה על 100,000 ידיים.":"The edge comes from bet size: small when the casino leads, big when you lead. The academy simulator shows this over 100,000 hands.","הערכת חפיסות":"Estimating decks","בקזינו מעריכים בעין את גובה הקלפים שנזרקו. במשחק כאן מספר הקלפים בנעל כתוב למעלה — מחלקים ב-52.":"In a casino you eyeball the height of the discard pile. In this game the number of cards in the shoe is shown at the top — divide by 52.","ספירה רצה +9, נשארו 3 חפיסות. ספירה אמיתית?":"Running count +9, 3 decks left. True count?","ספירה אמיתית +4 במרווח 1–8. כמה יחידות?":"True count +4 with a 1–8 spread. How many units?","למה מגדילים הימור בספירה גבוהה?":"Why raise your bet at a high count?","כי אז לשחקן יש יתרון":"Because then the player has the edge","הדילר עייף":"The dealer is tired","זה מבלבל את הקזינו":"It confuses the casino","זה חובה":"It's required","סטיות לפי ספירה":"Count-based deviations","16 מול 10, בלי כניעה, ספירה אמיתית +1?":"16 vs 10, no surrender, true count +1?","10,10 מול 6 בספירה +4?":"10,10 vs 6 at count +4?","מאיזו ספירה אמיתית לוקחים ביטוח?":"At what true count do you take insurance?","12 מול 3 בספירה +2?":"12 vs 3 at count +2?","מהמרים ששני הקלפים הראשונים יהיו זוג: מעורב (צבע שונה) 6:1, צבעוני (אותו צבע, צורה שונה) 12:1, מושלם (אותה צורה) 25:1.":"You bet that your first two cards will be a pair: mixed (different color) 6:1, colored (same color, different suit) 12:1, perfect (same suit) 25:1.","שני הקלפים שלך + הקלף הגלוי של הדילר = יד פוקר של 3 קלפים: צבע 5:1, רצף 10:1, שלישייה 30:1, רצף צבע 40:1, שלישייה באותה צורה 100:1.":"Your two cards + the dealer's up card = a 3-card poker hand: flush 5:1, straight 10:1, trips 30:1, straight flush 40:1, suited trips 100:1.","השורה התחתונה":"The bottom line","ב-6 חפיסות Perfect Pairs מפסיד כ-6% ו-21+3 כ-4.6% — פי 10 מההימור הראשי עם אסטרטגיה. הסולבר בשולחן מחשב את הסיכויים לפי הנעל, ולפעמים הם הופכים לרווחיים.":"With 6 decks Perfect Pairs loses about 6% and 21+3 about 4.6% — 10× more than the main bet with strategy. The solver at the table calculates the odds from the shoe, and sometimes they turn profitable.","כמה משלם זוג מושלם?":"What does a perfect pair pay?","8♥ ו-8♦ זה…":"8♥ and 8♦ is…","זוג צבעוני (12:1)":"A colored pair (12:1)","לא זוג":"Not a pair","שניהם אדומים, צורה שונה.":"Both red, different suits.","5♠ 6♠ והדילר 7♠ ב-21+3?":"5♠ 6♠ and dealer 7♠ in 21+3?","רצף צבע (40:1)":"Straight flush (40:1)","איזה הימור עדיף לטווח ארוך?":"Which bet is better long-term?","ההימור הראשי עם אסטרטגיה":"The main bet with strategy","שניהם יחד":"Both together","מה חזק יותר?":"Which is stronger?","מה החלש מהרשימה?":"Which is weakest on the list?","A-2-3-4-5 זה רצף?":"Is A-2-3-4-5 a straight?","כן — הנמוך ביותר":"Yes — the lowest one","רק באומהה":"Only in Omaha","רק באותה צורה":"Only if suited","מהלך יד בטקסס הולדם":"How a Texas Hold'em hand plays out","בליינדים וכפתור":"Blinds and the button","הכפתור (D) מסמן את הדילר. שני השחקנים משמאלו שמים הימורי חובה: בליינד קטן ובליינד גדול. הכפתור זז בכל יד.":"The button (D) marks the dealer. The two players to its left post forced bets: the small blind and the big blind. The button moves every hand.","4 סבבים":"4 rounds",": 2 קלפים לכל אחד, הימור ראשון.":": 2 cards each, first betting round.",": 3 קלפים משותפים, הימור.":": 3 community cards, betting.",": קלף רביעי, הימור.":": a fourth card, betting.",": קלף חמישי, הימור אחרון.":": a fifth card, final betting.","בשואודאון מנצחת יד 5 הקלפים הטובה ביותר מתוך 7.":"At showdown the best 5-card hand out of 7 wins.","הפעולות":"The actions","— להעביר בלי להמר (רק אם אף אחד לא הימר).":"— pass without betting (only if nobody has bet).","הימור / רייז":"Bet / Raise","— לשים או להעלות.":"— put chips in or increase.","— להשוות.":"— match.","— לוותר.":"— give up.","— כל הצ׳יפים; מי שיש לו פחות זוכה רק בקופה עד הסכום שלו.":"— all your chips; whoever has less can only win the pot up to their amount.","כמה קלפים משותפים יש בריבר?":"How many community cards are there on the river?","מתי מותר צ׳ק?":"When can you check?","כשאף אחד לא הימר בסבב":"When nobody has bet this round","תמיד":"Always","רק בריבר":"Only on the river","רק בבליינד הגדול":"Only in the big blind","מה זה בליינד?":"What is a blind?","הימור חובה לפני החלוקה":"A forced bet before the deal","קלף הפוך":"A face-down card","בלוף":"A bluff","קופה צדדית":"A side pot","בשואודאון בונים יד מ…":"At showdown you make a hand from…","5 הטובים מתוך 7":"The best 5 out of 7","2 הקלפים שביד":"The 2 cards in your hand","כל 7":"All 7","3 מהשולחן בלבד":"Only 3 from the board","מי מדבר אחרון אחרי הפלופ?":"Who acts last after the flop?","הכפתור (או הקרוב אליו שנשאר)":"The button (or the closest remaining player)","הבליינד הקטן":"The small blind","הבליינד הגדול":"The big blind","מי שהימר ראשון":"Whoever bet first","קיקרים וקופה מתחלקת":"Kickers and split pots","כששני שחקנים עם אותה קטגוריה (נגיד זוג A), מכריעים הקלפים הנוספים —":"When two players have the same category (say a pair of aces), the extra cards decide —",". A-K מנצח A-Q על לוח A-7-5-3-2.":". A-K beats A-Q on an A-7-5-3-2 board.","הלוח משחק":"Playing the board","אם 5 הקלפים הטובים לשניכם הם הלוח עצמו (נגיד רצף על השולחן), הקופה מתחלקת.":"If the best 5 cards for both of you are the board itself (say a straight on the table), the pot is split.","מי שהלך אול-אין זוכה רק במה שכל אחד שם עד הסכום שלו. השאר הולך לקופה צדדית בין האחרים.":"Whoever goes all-in only wins what each player put in up to their amount. The rest goes to a side pot among the others.","לוח A♠ 9♦ 7♣ 4♥ 2♠. יד א׳ A-K, יד ב׳ A-Q. מי מנצח?":"Board A♠ 9♦ 7♣ 4♥ 2♠. Hand A: A-K, Hand B: A-Q. Who wins?","יד א׳ — קיקר K":"Hand A — K kicker","אין מנצח":"No winner","לוח 5-6-7-8-9 בצורות שונות, ולאף אחד אין קלף שמשפר. מה קורה?":"Board 5-6-7-8-9 offsuit, and nobody has a card that improves. What happens?","הקופה מתחלקת":"The pot is split","מי שיש לו קלף גבוה ביד":"Whoever has the high card in hand","שחקן הלך אול-אין עם 100, ושניים שמו 300 כל אחד. על כמה הוא יכול לזכות?":"A player went all-in with 100, and two others put in 300 each. How much can they win?","100 מכל אחד מהשלושה.":"100 from each of the three.","איפה משחקים הכי הרבה ידיים?":"Where do you play the most hands?","בכפתור":"On the button","בפוזיציה הראשונה":"In first position","בבליינד הקטן":"In the small blind","למה פוזיציה מאוחרת טובה?":"Why is late position good?","רואים מה כולם עשו לפני שמחליטים":"You see what everyone did before you decide","משלמים פחות":"You pay less","מקבלים קלפים טובים":"You get better cards","אפשר לבלף רק שם":"You can only bluff there","קופה 300, הימור 100 עליך. כמה אקוויטי צריך?":"Pot 300, a bet of 100 to you. How much equity do you need?","יש לך 40% וצריך 25%. מה עושים?":"You have 40% and need 25%. What do you do?","קול (לפחות)":"Call (at least)","תמיד אול-אין":"Always all-in","כמה אאוטים לרצף פתוח משני הצדדים?":"How many outs does an open-ended straight draw have?","9 אאוטים בפלופ — כמה % עד הריבר?":"9 outs on the flop — what % by the river?","כ-36%":"About 36%","כ-18%":"About 18%","כ-9%":"About 9%","כ-50%":"About 50%","כמה אאוטים לרצף":"How many outs for a","גודל הימור":"Bet sizing","למה מהמרים?":"Why bet?","לערך":"For value",": יד טובה, ורוצים שידיים חלשות ישלמו.":": a good hand, and you want weaker hands to pay.","כבלוף":"As a bluff",": יד חלשה, ורוצים שידיים טובות יוותרו.":": a weak hand, and you want better hands to fold.","הגנה":"Protection",": לחייב דרואים לשלם כדי לראות קלף.":": make draws pay to see a card.","כמה להמר":"How much to bet","פתיחה לפני הפלופ: 2.5–3 בליינדים, ועוד בליינד לכל מי שנכנס לפניך.":"Opening pre-flop: 2.5–3 blinds, plus one blind for each player who entered before you.","אחרי הפלופ: חצי עד שלושה רבעים קופה.":"After the flop: half to three-quarters of the pot.","לוח":"A","רטוב":"wet","(הרבה דרואים): הימור גדול יותר. לוח":"board (lots of draws): bet bigger. A","יבש":"dry",": קטן יותר.":"board: smaller.","המחיר ליריב":"The price for your opponent","הימור של חצי קופה מחייב את היריב ל-25% אקוויטי כדי לקרוא. קופה מלאה — 33%. ככל שההימור גדול יותר, דרואים צריכים יותר סיכוי.":"A half-pot bet forces your opponent to have 25% equity to call. A full pot — 33%. The bigger the bet, the more chance draws need.","מהמרים חצי קופה. כמה אקוויטי היריב צריך?":"You bet half the pot. How much equity does your opponent need?","גודל פתיחה סטנדרטי לפני פלופ?":"Standard pre-flop open size?","2.5–3 בליינדים":"2.5–3 blinds","בליינד אחד":"One blind","10 בליינדים":"10 blinds","לוח עם הרבה דרואים. מה עדיף?":"A board with lots of draws. What's better?","הימור גדול יותר":"A bigger bet","הימור קטן":"A small bet","תמיד צ׳ק":"Always check","מה המטרה של הימור לערך?":"What's the goal of a value bet?","שידיים חלשות ממך ישלמו":"Getting weaker hands to pay you","שכולם יוותרו":"Getting everyone to fold","להסתיר בלוף":"Hiding a bluff","לחסוך צ׳יפים":"Saving chips","טווחי ידיים":"Hand ranges","שחקן העלה מהפוזיציה הראשונה. הטווח שלו…":"A player raised from first position. Their range is…","צר — ידיים חזקות":"Narrow — strong hands","רחב — כל יד":"Wide — any hand","רק זוגות":"Only pairs","רק בלופים":"Only bluffs","למה האקוויטי מול":"Why is equity against a","טווח":"range","נמוך יותר מאשר מול יד אקראית?":"lower than against a random hand?","כי הידיים החלשות כבר קיפלו":"Because the weak hands already folded","הסולבר טועה":"The solver is wrong","יש יותר שחקנים":"There are more players","שחקן הימר פעמיים אחרי הפלופ. מה הוא כנראה מחזיק?":"A player bet twice after the flop. What are they probably holding?","יד עשויה או דרו חזק":"A made hand or a strong draw","קלף גבוה בלבד":"Just a high card","זוג קטן תמיד":"Always a small pair","בלוף: מתי וכמה":"Bluffing: when and how much","מתי בלוף מרוויח":"When a bluff is profitable","בלוף רווחי אם היריב מקפל מספיק פעמים. הימור בגודל הקופה צריך להצליח 50%; חצי קופה — 33%.":"A bluff is profitable if your opponent folds often enough. A pot-sized bet needs to work 50% of the time; half pot — 33%.","אחוז קיפול נדרש = הימור ÷ (קופה + הימור)":"Required fold rate = bet ÷ (pot + bet)","את מי לבלף":"Who to bluff","שמקפל הרבה — כן.":"who folds a lot — yes.","שקורא הכל — לא! מולו מהמרים רק לערך.":"who calls everything — no! Against them, only bet for value.","לוח שמתאים לסיפור שלך (קלף שלישי לצבע אחרי שהימרת לאורך היד).":"A board that fits your story (a third flush card after you bet throughout the hand).","ה-HUD בשולחן מראה VPIP: שחקן עם VPIP גבוה קורא הרבה.":"The HUD at the table shows VPIP: a player with a high VPIP calls a lot.","חצי-בלוף":"Semi-bluff","הימור עם דרו: אם היריב מקפל — ניצחת; אם הוא קורא — עדיין יש סיכוי לתפוס. זה הבלוף הבריא ביותר.":"A bet with a draw: if your opponent folds — you win; if they call — you still have a chance to hit. It's the healthiest bluff.","מהמרים 100 לקופה של 100. כמה פעמים היריב צריך לקפל?":"You bet 100 into a pot of 100. How often does your opponent need to fold?","מול שחקן שקורא הכל כדאי…":"Against a player who calls everything you should…","לא לבלף ולהמר לערך":"Not bluff, and bet for value","לבלף הרבה":"Bluff a lot","לקפל הכל":"Fold everything","מה זה חצי-בלוף?":"What is a semi-bluff?","הימור עם דרו שיכול להשתפר":"A bet with a draw that can improve","הימור של חצי קופה":"A half-pot bet","בלוף בחצי מהידיים":"Bluffing half your hands","קול במקום רייז":"Calling instead of raising","VPIP של 55% אומר ש…":"A VPIP of 55% means…","השחקן נכנס להרבה ידיים — קשה לבלף אותו":"The player enters lots of hands — hard to bluff","השחקן טייט":"The player is tight","תמיד מעלה":"Always raises","מקפל הכל":"Folds everything","Push/Fold בטורנירים":"Push/Fold in tournaments","כמה בליינדים זה סטאק קצר?":"How many blinds is a short stack?","15 ומטה":"15 or fewer","3 בלבד":"Only 3","למה לא רייז קטן עם 8 בליינדים?":"Why not a small raise with 8 blinds?","אם יעלו עליך תצטרך לזרוק חלק גדול מהסטאק":"If someone re-raises you'd have to fold a big part of your stack","מבזבז זמן":"It wastes time","הבוטים לא מבינים":"The bots don't understand it","מאיפה דוחפים יותר ידיים?":"Where do you push more hands from?","מהכפתור ומהבליינד הקטן":"From the button and the small blind","מהפוזיציה הראשונה":"From first position","רק מהבליינד הגדול":"Only from the big blind","יש לך A♥ K♥ ועוד שניים, ועל השולחן 3 לבבות. צבע?":"You have A♥ K♥ plus two more, and there are 3 hearts on the board. Flush?","כן — 2 מהיד ו-3 מהשולחן":"Yes — 2 from your hand and 3 from the board","רק עם 4 לבבות ביד":"Only with 4 hearts in hand","על השולחן 4 לבבות ויש לך לב אחד. צבע?":"There are 4 hearts on the board and you have one heart. Flush?","לא — חייבים בדיוק 2 מהיד":"No — you must use exactly 2 from your hand","רק באומהה הי-לו":"Only in Omaha Hi-Lo","כן אם הוא A":"Yes if it's the A","מה ההימור המקסימלי בפוט-לימיט?":"What's the maximum bet in pot-limit?","גודל הקופה (כולל הקריאה)":"The size of the pot (including the call)","כל הסטאק":"The whole stack","פי 2 מהבליינד":"2× the blind","כמה קלפים מקבלים בהתחלה?":"How many cards do you get at the start?","מתי זורקים בקרייזי פיינאפל?":"When do you discard in Crazy Pineapple?","לפני ההימור הראשון":"Before the first bet","בריבר":"On the river","לא זורקים":"You don't discard","A♠ A♦ 7♣ לפני הפלופ. מה זורקים?":"A♠ A♦ 7♣ before the flop. What do you discard?","שומרים את הזוג.":"Keep the pair.","זוג — כמה מחליפים?":"A pair — how many do you draw?","שני זוגות — כמה מחליפים?":"Two pair — how many do you draw?","4 לצבע — מה הסיכוי לצבע אחרי החלפה?":"4 to a flush — what's the chance of a flush after the draw?","כ-19%":"About 19%","כ-4%":"About 4%","כ-35%":"About 35%","9 מתוך 47.":"9 out of 47.","הלוח וסוגי ההימורים":"The layout and bet types","הגלגל":"The wheel","אירופאית: 37 תאים — 1–36 (חצי אדומים, חצי שחורים) ו-0 ירוק. אמריקאית מוסיפה 00 — 38 תאים.":"European: 37 pockets — 1–36 (half red, half black) and a green 0. American adds 00 — 38 pockets.","הימורים פנימיים":"Inside bets","מספר בודד: 35:1":"Single number: 35:1","שני מספרים (Split): 17:1":"Two numbers (split): 17:1","שורה של 3: 11:1":"Row of 3 (street): 11:1","פינה של 4: 8:1":"Corner of 4: 8:1","שתי שורות (6): 5:1":"Two rows (6, six line): 5:1","הימורים חיצוניים":"Outside bets","אדום/שחור, זוגי/אי-זוגי, 1–18/19–36: 1:1":"Red/black, even/odd, 1–18/19–36: 1:1","תריסר או עמודה (12 מספרים): 2:1":"Dozen or column (12 numbers): 2:1","ה-0 אינו אדום, שחור, זוגי או נמוך — ולכן הימורי 1:1 מפסידים כשהוא יוצא.":"0 isn't red, black, even or low — so 1:1 bets lose when it comes up.","יצא 0. מה קורה להימור על זוגי?":"0 came up. What happens to a bet on even?","מפסיד":"Loses","זוכה":"Wins","מוחזר":"Returned","מתחלק":"Split","כמה משלם תריסר?":"What does a dozen pay?","כמה תאים בגלגל אירופאי?":"How many pockets on a European wheel?","למה מספר בודד משלם 35:1 ולא 36:1?":"Why does a single number pay 35:1 and not 36:1?","ההפרש הוא יתרון הבית":"The difference is the house edge","מסורת":"Tradition","יש 35 מספרים":"There are 35 numbers","כך זה הוגן":"That's what makes it fair","אירופאית או אמריקאית?":"European or American?","אירופאית — 2.70% במקום 5.26%":"European — 2.70% instead of 5.26%","אמריקאית — יותר מספרים":"American — more numbers","תלוי בצבע":"Depends on the color","מה יתרון הבית בהימור על תריסר באירופאית?":"What's the house edge on a dozen bet in European?","כל ההימורים באירופאית: 1/37.":"Every bet in European: 1/37.","מספרים":"numbers","חמים":"Hot","קרים":"cold","מספרים חמים":"Hot numbers","שולחנות מציגים את 20 התוצאות האחרונות, ואנשים רואים":"Tables display the last 20 results, and people see","דפוסים":"patterns",". עם 37 תאים, ב-20 סיבובים בטוח שמספרים יחזרו ואחרים לא יופיעו.":". With 37 pockets, in 20 spins some numbers are bound to repeat and others won't appear.","ב-37 סיבובים, בממוצע כשליש מהמספרים לא יוצאים בכלל — וזה נורמלי לגמרי.":"In 37 spins, on average about a third of the numbers don't come up at all — and that's completely normal.","מתי כן יש הטיה?":"When is there really a bias?","היו בהיסטוריה גלגלים פיזיים פגומים. בקזינו מודרני — ובמשחק הזה, שמשתמש במחולל אקראי קריפטוגרפי — אין. בדקנו מיליוני סיבובים כדי לוודא.":"Historically there were faulty physical wheels. In a modern casino — and in this game, which uses a cryptographic random generator — there aren't. We tested millions of spins to make sure.","17 לא יצא 80 סיבובים. מה הסיכוי שייצא עכשיו?":"17 hasn't come up for 80 spins. What's the chance it comes up now?","1/37 — כמו תמיד":"1/37 — same as always","גבוה יותר":"Higher","נמוך יותר":"Lower","ב-37 סיבובים, האם סביר שכל המספרים ייצאו?":"In 37 spins, is it likely that every number comes up?","לא — בממוצע כשליש לא יוצאים":"No — on average about a third don't","רק באמריקאית":"Only in American","רק בשולחן חדש":"Only at a new table","מה עושה לוח המספרים החמים?":"What does the hot numbers board do?","מראה את העבר — לא מנבא":"Shows the past — doesn't predict","מנבא את הבא":"Predicts the next one","משנה תשלומים":"Changes payouts","מגדיל סיכויים":"Increases your odds","צירופי הימורים":"Bet combinations","כיסוי הרבה מספרים":"Covering lots of numbers","כל צירוף נותן תוחלת של −2.7% על סך ההימורים. מה שמשתנה: כמה פעמים זוכים ובכמה.":"Every combination has an expected value of −2.7% of the total bet. What changes: how often you win and by how much.","שני תריסרים (24 מספרים): זוכים ב-65% מהסיבובים, אבל כל זכייה מחזירה רק פי 1.5 מההימור הכולל.":"Two dozens (24 numbers): you win 65% of spins, but each win returns only 1.5× the total bet.","נסו בעצמכם":"Try it yourself","הסולבר בשולחן מחשב כל צירוף: סיכוי לרווח, רווח מקסימלי, הפסד מקסימלי ותוחלת. נסו לבנות צירוף":"The solver at the table calculates every combination: chance of profit, max win, max loss and expected value. Try to build a","מנצח":"winning","— ותראו שהתוחלת תמיד −2.7%.":"combination — and you'll see the expected value is always −2.7%.","10 על תריסר ראשון ו-10 על שני. יצא 5. רווח נקי?":"10 on the first dozen and 10 on the second. 5 comes up. Net profit?","זוכים 30 (כולל 10) ומפסידים 10: 30−20.":"You win 30 (including the 10) and lose 10: 30−20.","מה התוחלת של כל צירוף באירופאית?":"What's the expected value of any combination in European?","−2.7% מסך ההימורים":"−2.7% of the total bet","תלוי בצירוף":"Depends on the combination","חיובית אם מכסים 30 מספרים":"Positive if you cover 30 numbers","מכסים את כל 36 המספרים בלי 0. מה יקרה?":"You cover all 36 numbers but not 0. What happens?","כמעט תמיד הפסד קטן, ו-0 מוחק הכל":"Almost always a small loss, and 0 wipes out everything","רווח בטוח":"Guaranteed profit","תיקו תמיד":"Always break even","הקזינו לא מרשה":"The casino doesn't allow it","חוקים וטבלת תשלומים":"Rules and the pay table","איך משחקים":"How to play","מקבלים 5 קלפים, מסמנים אילו להחזיק ומחליפים את השאר פעם אחת. משלמים לפי היד הסופית — אין יריב.":"You get 5 cards, mark which to hold and swap the rest once. You're paid based on the final hand — there's no opponent.","טבלת 9/6":"The 9/6 table","ב-Jacks or Better התשלום הנמוך הוא זוג J ומעלה (מחזיר את ההימור).":"In Jacks or Better the lowest payout is a pair of jacks or better (returns your bet).","= פול האוס משלם 9 וצבע 6 — הטבלה הטובה ביותר.":"= full house pays 9 and flush 6 — the best table.","5 מטבעות":"5 coins","ר function score(cat,a,b,c,d,e){return ((((cat*15+(a||0))*15+(b||0))*15+(c||0))*15+(d||0))*15+(e||0);}

function evalHand(cards,n){

  for(let s=0;s<4;s++)if(SC[s]>=5){const sf=straightHi(SM[s]);if(sf)return score(8,sf);const k=[];for(let r=14;r>=2&&k.length<5;r--)if(SM[s]&(1<<r))k.push(r);return score(5,k[0],k[1],k[2],k[3],k[4]);}
  let quad=0,t1=0,t2=0,p1=0,p2=0,p3=0;
  for(let r=14;r>=2;r--){const k=RC[r];if(k===4)quad=r;else if(k===3){if(!t1)t1=r;else if(!t2)t2=r;}else if(k===2){if(!p1)p1=r;else if(!p2)p2=r;else if(!p3)p3=r;}}
  if(quad){let kk=0;for(let r=14;r>=2;r--)if(r!==quad&&RC[r]){kk=r;break;}return score(7,quad,kk);}
  if(t1&&(t2||p1))return score(6,t1,Math.max(t2,p1));
  const sh=straightHi(mask);if(sh)return score(4,sh);
  if(t1){const k=[];for(let r=14;r>=2&&k.length<2;r--)if(RC[r]&&r!==t1)k.push(r);return score(3,t1,k[0],k[1]);}
  if(p1&&p2){let kk=0;for(let r=14;r>=2;r--)if(RC[r]&&r!==p1&&r!==p2){kk=r;break;}return score(2,p1,p2,kk);}
  if(p1){const k=[];for(let r=14;r>=2&&k.length<3;r--)if(RC[r]===1)k.push(r);return score(1,p1,k[0],k[1],k[2]);}
  const k=[];for(let r=14;r>=2&&k.length<5;r--)if(RC[r])k.push(r);return score(0,k[0],k[1],k[2],k[3],k[4]);

const T5=[0,0,0,0,0];
function bestOmaha(h,b){let best=-1;const n=h.length,m=b.length;if(m<3)return -1;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)for(let x=0;x<m;x++)for(let y=x+1;y<m;y++)for(let z=y+1;z<m;z++){T5[0]=h[i];T5[1]=h[j];T5[2]=b[x];T5[3]=b[y];T5[4]=b[z];const s=evalHand(T5,5);if(s>best)best=s;}
  return best;}

function pine3(hole,board){let best=-1;const n=board.length;for(let x=0;x<3;x++){let k=0;for(let y=0;y<3;y++)if(y!==x)H3[k++]=hole[y];for(let j=0;j<n;j++)H3[k++]=board[j];const sc=evalHand(H3,k);if(sc>best)best=sc;}return best;}
function handScore(v,hole,board){if(v==='omaha')return bestOmaha(hole,board);if(isPine(v)&&hole.length===3)return pine3(hole,board);if(v==='draw')return evalHand(hole,5);const a=hole.concat(board);return evalHand(a,a.length);}
const CATS=[_T('קלף גבוה'),_T('זוג'),_T('שני זוגות'),_T('שלישייה'),_T('רצף'),_T('צבע'),_T('פול האוס'),_T('רביעייה'),_T('רצף צבע')];

/* Monte Carlo equity (hold'em / omaha) */
function mcEquity(v,hole,board,nOpp,iters,ranges){
  const used=new Uint8Array(52);hole.forEach(c=>used[c]=1);board.forEach(c=>used[c]=1);
  const d=[];for(let c=0;c<52;c++)if(!used[c])d.push(c);
  const hn=v==='omaha'?4:(isPine(v)&&hole.length===3)?3:2,need=5-board.length,L=d.length;const fb=board.slice();const oh=new Array(hn);
  let win=0,tie=0,eq=0;const cats=new Float64Array(9);
  for(let it=0;it<iters;it++){
    let k=0;
    fb.length=board.length;
    for(let i=0;i<need;i++){const j=k+Math.floor(Math.random()*(L-k));const t=d[k];d[k]=d[j];d[j]=t;fb.push(d[k++]);}
    const my=handScore(v,hole,fb);cats[catOf(my)]++;
    let lost=false,ties=0;
    for(let o=0;o<nOpp&&!lost;o++){const rg=ranges&&ranges[o];let tries=0;
      for(;;){for(let i=0;i<hn;i++){const j=k+Math.floor(Math.random()*(L-k));const t=d[k];d[k]=d[j];d[j]=t;oh[i]=d[k++];}
        if(!rg||tries>=25||acceptOpp(v,oh,board,rg))break;k-=hn;tries++;}
      const s=handScore(v,oh,fb);if(s>my)lost=true;else if(s===my)ties++;}
    if(!lost){if(ties){tie++;eq+=1/(ties+1);}else{win++;eq+=1;}}
  }
  return {win:win/iters,tie:tie/iters,eq:eq/iters,cats:Array.from(cats,x=>x/iters)};
}
/* five-card draw: bot discard heuristic (max 3) */
function botDraw(h){
  const v=evalHand(h,5),c=catOf(v);if(c>=4)return [];
  const r=h.map(rk),cnt={};r.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  if(c>=1)return [0,1,2,3,4].filter(i=>cnt[r[i]]===1).sort((a,b)=>r[a]-r[b]).slice(0,3);
  const sc=[0,0,0,0];h.forEach(x=>sc[x&3]++);const fs=sc.indexOf(4);if(fs>=0)return [0,1,2,3,4].filter(i=>(h[i]&3)!==fs);
  const u=r.slice().sort((a,b)=>a-b);
  for(const drop of [0,4]){const rest=u.filter((x,k)=>k!==drop);if(rest[3]-rest[0]===3&&rest[3]<14)return [r.indexOf(u[drop])];}
  return [0,1,2,3,4].sort((a,b)=>r[b]-r[a]).slice(2);
}
function eqDraw(hand,disc,nOpp,iters){
  const used=new Uint8Array(52);hand.forEach(c=>used[c]=1);const d=[];for(let c=0;c<52;c++)if(!used[c])d.push(c);const L=d.length;
  let eq=0,imp=0;const cats=new Float64Array(9);const base=catOf(evalHand(hand,5));const my=[0,0,0,0,0],oh=[0,0,0,0,0];
  for(let it=0;it<iters;it++){
    let k=0;const take=()=>{const j=k+Math.floor(Math.random()*(L-k));const t=d[k];d[k]=d[j];d[j]=t;return d[k++];};
    for(let i=0;i<5;i++)my[i]=hand[i];for(const i of disc)my[i]=take();
    const ms=evalHand(my,5),mc=catOf(ms);cats[mc]++;if(mc>base)imp++;
    let lost=false,ties=0;
    for(let o=0;o<nOpp&&!lost;o++){for(let i=0;i<5;i++)oh[i]=take();for(const i of botDraw(oh))oh[i]=take();const s=evalHand(oh,5);if(s>ms)lost=true;else if(s===ms)ties++;}
    if(!lost)eq+=ties?1/(ties+1):1;

function drawOptions(hand,nOpp){
  const opts=[];

/* ================= blackjack math ================= */
const bjVal=c=>{const r=rk(c);return r===14?1:r>=10?10:r;};
function bjTot(cd){let t=0,a=false;for(const c of cd){const v=bjVal(c);t+=v;if(v===1)a=true;}const soft=a&&t+10<=21;return {t:soft?t+10:t,hard:t,soft};}
const hiLo=c=>{const v=bjVal(c);return v>=2&&v<=6?1:(v===10||v===1)?-1:0;};
function dealerDist(up,p,h17){
  const memo=new Map();
  function rec(t,soft){const tot=soft&&t+10<=21?t+10:t;
    if(tot>=17&&!(h17&&soft&&t+10===17)){const r=[0,0,0,0,0,0];if(tot>21)r[5]=1;else r[tot-17]=1;return r;}
    const key=t*2+(soft?1:0);if(memo.has(key))return memo.get(key);
    const r=[0,0,0,0,0,0];for(let c=1;c<=10;c++){if(!p[c])continue;const s=rec(t+c,soft||c===1);for(let k=0;k<6;k++)r[k]+=p[c]*s[k];}
    memo.set(key,r);return r;}
  const r=[0,0,0,0,0,0];let norm=0;
  const skip=c=>(up===1&&c===10)||(up===10&&c===1);
  for(let c=1;c<=10;c++)if(!skip(c))norm+=p[c];
  for(let c=1;c<=10;c++){if(skip(c)||!p[c])continue;const s=rec(up+c,up===1||c===1);for(let k=0;k<6;k++)r[k]+=p[c]/norm*s[k];}
  return r;
}
function standEV(tot,D){if(tot>21)return -1;let ev=D[5];for(let k=0;k<5;k++){const dt=17+k;if(tot>dt)ev+=D[k];else if(tot<dt)ev-=D[k];}return ev;}
function bjEVs(cd,D,p,L){
  const memo=new Map();
  const totOf=(t,s)=>s&&t+10<=21?t+10:t;
  function best(t,s){const tot=totOf(t,s);if(tot>21)return -1;return Math.max(standEV(tot,D),hitEV(t,s));}
  function hitEV(t,s){const key=t*2+(s?1:0);if(memo.has(key))return memo.get(key);let ev=0;for(let c=1;c<=10;c++){if(!p[c])continue;const nt=t+c,ns=s||c===1;ev+=p[c]*(totOf(nt,ns)>21?-1:best(nt,ns));}memo.set(key,ev);return ev;}
  function dblEV(t,s){let ev=0;for(let c=1;c<=10;c++){if(!p[c])continue;ev+=p[c]*standEV(totOf(t+c,s||c===1),D);}return 2*ev;}
  let t=0,s=false;cd.forEach(c=>{const v=bjVal(c);t+=v;if(v===1)s=true;});
  const R={stand:standEV(totOf(t,s),D),hit:hitEV(t,s)};
  if(L.dbl)R.double=dblEV(t,s);
  if(L.split){const v=bjVal(cd[0]);let one=0;
    for(let c=1;c<=10;c++){if(!p[c])continue;const nt=v+c,ns=v===1||c===1;
      if(v===1)one+=p[c]*standEV(totOf(nt,ns),D);
      else one+=p[c]*Math.max(best(nt,ns),dblEV(nt,ns));}
    R.split=2*one;}
