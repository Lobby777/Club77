}
/* basic strategy: 6 decks, dealer stands soft 17, double after split, late surrender */
function bsRaw(cd,up,allowPair=true,h17=false){
  const v=cd.map(bjVal);const T=bjTot(cd);
  if(allowPair&&cd.length===2&&v[0]===v[1]){const pv=v[0];
    if(pv===8&&up===11&&h17)return 'Rp';if(pv===1||pv===8)return 'P';if(pv===10)return 'S';
    if(pv===9)return [7,10,11].includes(up)?'S':'P';
    if(pv===7)return up<=7?'P':'H';if(pv===6)return up<=6?'P':'H';
    if(pv===4)return up===5||up===6?'P':'H';
    if(pv===2||pv===3)return up<=7?'P':'H';}
  if(T.soft){const t=T.t;
    if(t>=20)return 'S';if(t===19)return h17&&up===6?'Ds':'S';
    if(t===18)return (up>=3&&up<=6)||(h17&&up===2)?'Ds':(up===2||up===7||up===8)?'S':'H';
    if(t===17)return up>=3&&up<=6?'D':'H';
    if(t===15||t===16)return up>=4&&up<=6?'D':'H';
    return up>=5&&up<=6?'D':'H';}
  const t=T.t;
  if(t>=18)return 'S';if(t===17)return h17&&up===11?'Rs':'S';
  if(t===16)return up<=6?'S':up>=9?'Rh':'H';
  if(t===15)return up<=6?'S':(up===10||(h17&&up===11))?'Rh':'H';
  if(t>=13)return up<=6?'S':'H';
  if(t===12)return up>=4&&up<=6?'S':'H';
  if(t===11)return up===11&&!h17?'H':'D';
  if(t===10)return up<=9?'D':'H';
  if(t===9)return up>=3&&up<=6?'D':'H';
  return 'H';
}
function bsAction(cd,up,L,h17){let a=bsRaw(cd,up,!!L.split,h17);
  if(a==='Rp')a=L.surr?'Rp':'P';if(a==='Rp')return 'surr';

  if(a==='D')return L.dbl?'double':'hit';if(a==='Ds')return L.dbl?'double':'stand';
  if(a==='Rh')return L.surr?'surr':'hit';
  return {H:'hit',S:'stand',P:'split'}[a];}

const BOT_POOL=[[_T('יוסי'),'rock'],[_T('מאיה'),'maniac'],[_T('דודו'),'fish'],[_T('רונית'),'pro'],[_T('שמעון'),'pro'],[_T('ליאור'),'maniac'],[_T('אבי'),'rock'],[_T('נועה'),'fish'],[_T('גלית'),'pro'],[_T('ערן'),'rock']];
const STY={rock:{l:_T('סלע'),loose:-.06,aggr:.35,bluff:.03},maniac:{l:_T('אגרסיבי'),loose:.08,aggr:.95,bluff:.22},fish:{l:_T('קולר'),loose:.1,aggr:.15,bluff:.03,sticky:1},pro:{l:_T('מקצוען'),loose:0,aggr:.6,bluff:.09},count:{l:_T('סופר קלפים')},wild:{l:_T('מהמר')},basic:{l:_T('לפי הספר')}};
function botsFor(n,taken=[]){const pool=shuffle(BOT_POOL.filter(b=>!taken.includes(b[0])));return pool.slice(0,n);}
function startGame(){const c=SETUP;track('game_start',{game:c.g==='poker'?(c.kind==='cash'?c.variant:c.kind):c.g,mode:c.mode||'solo',help:c.help||0});sessStart(c.g==='poker'?(c.kind==='cash'?c.variant:'tour'):c.g);S.solver=c.help>=1;S.coach=c.help===2;S.last=JSON.parse(JSON.stringify(c));save();
  if(c.g==='poker'&&c.kind==='mtt'){if(bal()<c.buy){toast(_T('אין מספיק צ׳יפים לדמי הכניסה'),'bad');return;}const N=c.mttN;let k=0;const stys=['rock','maniac','fish','pro','pro','rock'];
    const bot=()=>({n:mttBotName(k),t:'bot',sty:stys[k++%stys.length],c:1500});
    const mine=[{n:meName(),t:'me',c:1500}];for(let i=0;i<8;i++)mine.push(bot());
    const others=[];for(let t=1;t<N/9;t++){const ts=[];for(let i=0;i<9;i++)ts.push(bot());others.push(mkTable('holdem',ts,10,20));}
    addBal(-c.buy);pkCreate('holdem',mine,10,20,{buy:c.buy,n:N,mtt:{tables:others}});go('pk');pkNextHand();return;}
  if(c.g==='poker'){const tour=c.kind==='tour';const [sb,bb]=tour?TOUR_LV[0]:STAKES_PK[c.stakes];const buy=tour?1500:bb*100;
    if(tour){if(bal()<c.buy){toast(_T('אין מספיק צ׳יפים לדמי הכניסה'),'bad');return;}}
    else if(bal()<bb*20){toast(_T('צריך לפחות ')+fmt(bb*20)+_T(' צ׳יפים לשולחן הזה'),'bad');return;}
    const myStack=tour?buy:Math.min(buy,bal());const seats=[];
    if(c.mode==='hotseat'){c.names.forEach((n,i)=>seats.push({n:(n||'').trim()||(_T('שחקן ')+(i+1)),t:i===0?'me':'local',c:i===0?myStack:buy}));botsFor(c.hbots).forEach(([n,s])=>seats.push({n,t:'bot',sty:s,c:buy}));}
    else{seats.push({n:meName(),t:'me',c:myStack});botsFor(c.mode==='solo'?1:c.bots).forEach(([n,s])=>seats.push({n,t:'bot',sty:s,c:buy}));}

    pkCreate(c.variant,seats,sb,bb,tour?{buy:c.buy}:null);go('pk');pkNextHand();return;}
  if(c.g==='tcp'){tcpInit();go('tcp');return;}
  if(c.g==='bac'){bacInit();go('bac');return;}
  if(c.g==='bj'){const min=BJ_MIN[c.stakes];if(bal()<min){toast(_T('אין מספיק צ׳יפים למינימום של השולחן'),'bad');return;}
    const seats=[];
    if(c.mode==='hotseat')c.names.forEach((n,i)=>seats.push({n:(n||'').trim()||(_T('שחקן ')+(i+1)),t:i===0?'me':'local',c:min*100}));
    else{const nb=c.mode==='solo'?0:c.bots;const stys=['count','basic','wild','basic'];const names=botsFor(nb);
      names.forEach(([n],i)=>{if(i===Math.floor(nb/2))seats.push({n:meName(),t:'me',c:0});seats.push({n,t:'bot',sty:stys[i],c:min*100});});

const PK={st:null,deck:[],timer:null,myStart:0,viewer:-1,cover:-1,sel:[],raiseTo:0,solveKey:'',solve:null,needRebuy:false};
const VAR_NAME={holdem:_T('טקסס הולדם'),omaha:_T('אומהה פוט-לימיט'),draw:_T('פוקר 5 קלפים'),pine:_T('פיינאפל'),crazy:_T('קרייזי פיינאפל')};
const STREET_HE={pre:_T('פרה-פלופ'),flop:_T('פלופ'),turn:_T('טרן'),river:_T('ריבר'),bet1:_T('סבב הימורים ראשון'),draw:_T('החלפת קלפים'),disc:_T('זריקת קלף'),bet2:_T('סבב הימורים שני'),done:_T('סוף היד'),idle:''};
const holeN=v=>v==='omaha'?4:v==='draw'?5:isPine(v)?3:2;
const inHand=p=>!p.out&&!p.f;
const canAct=p=>!p.out&&!p.f&&!p.a;

const TOUR_LV=[[10,20],[15,30],[25,50],[50,100],[75,150],[100,200],[150,300],[200,400],[300,600],[500,1000],[750,1500],[1000,2000],[1500,3000],[2000,4000]];
function pkCreate(v,seats,sb,bb,tour){PK.st=mkTable(v,seats,sb,bb);PK.st.tour=tour?{buy:tour.buy,lvl:0,hpl:tour.mtt?8:6,n:tour.n||seats.length,places:{},over:null,lastUp:0,mtt:tour.mtt||null}:null;PK.prof={};PK.hud={};PK.told=false;PK.viewer=-1;PK.cover=-1;PK.needRebuy=false;}
function pkLog(m){const s=PK.st;s.log.unshift(m);if(s.log.length>6)s.log.length=6;}
function nextSeat(i,pred){const s=PK.st,n=s.seats.length;for(let k=1;k<=n;k++){const j=((i+k)%n+n)%n;if(pred(s.seats[j]))return j;}return -1;}
const potTotal=()=>PK.st.seats.reduce((a,p)=>a+p.tot,0);
function post(i,amt){const p=PK.st.seats[i];const a=Math.min(amt,p.c);p.c-=a;p.b+=a;p.tot+=a;if(p.c===0)p.a=true;}
function pkNextHand(){const s=PK.st;if(!s)return;clearTimeout(PK.timer);
  if(s.tour){if(s.tour.mtt?mttStep():pkTourStep())return;}
  else{
  s.seats.forEach(p=>{if(p.c<=0&&p.t==='bot'){const nb=botsFor(1,s.seats.map(q=>q.n))[0]||[_T('בוט'),'pro'];pkLog(_L`${p.n} יצא/ה, ${nb[0]} התיישב/ה`);p.n=nb[0];p.sty=nb[1];p.c=s.bb*100;}});
  const me=s.seats.find(p=>p.t==='me');
  if(me&&me.c<=0){PK.needRebuy=true;s.street='idle';if(CUR.v==='pk')pkRender();return;}}
  if(s.seats.filter(p=>p.c>0).length<2){s.street='idle';toast(_T('אין מספיק שחקנים עם צ׳יפים'));if(CUR.v==='pk')pkRender();return;}
  pkStartHand();pkTick();}
function pkStartHand(){const s=PK.st,n=s.seats.length;
  s.hand++;s.board=[];s.discDone=false;s.discFrom='';s.res=null;s.auto=false;PK.sel=[];PK.solveKey='';PK.raiseTo=0;
  s.seats.forEach(p=>{p.h=[];p.b=0;p.tot=0;p.ac=false;p.a=false;p.last='';p.show=false;p.dr=-1;p.out=p.c<=0;p.f=p.out;p.hx={pr:0,pc:0,lp:0,agg:0};if(!p.out)hudOf(p).h++;});s.lastAgg=-1;
  s.btn=nextSeat(s.btn<0?rnd(n):s.btn,p=>!p.out);
  PK.deck=newDeck();const hn=holeN(s.v);
  for(let k=0;k<hn;k++)s.seats.forEach(p=>{if(!p.out)p.h.push(PK.deck.pop());});
  const act=s.seats.filter(p=>!p.out).length;let sbI,bbI;
  if(act===2){sbI=s.btn;bbI=nextSeat(sbI,p=>!p.out);}else{sbI=nextSeat(s.btn,p=>!p.out);bbI=nextSeat(sbI,p=>!p.out);}
  post(sbI,s.sb);post(bbI,s.bb);s.seats[sbI].last=_T('בליינד קטן');s.seats[bbI].last=_T('בליינד גדול');
  s.cur=s.bb;s.minR=s.bb;s.street=s.v==='draw'?'bet1':'pre';
  const me=s.seats.find(p=>p.t==='me');PK.myStart=me?me.c+me.tot:0;
  pkLog(_L`יד #${s.hand} — ${s.seats[s.btn].n} על הכפתור`);

function pkLegal(i){const s=PK.st,p=s.seats[i];const toCall=Math.min(s.cur-p.b,p.c);const all=p.b+p.c;let maxTo=all;
  if(s.v==='omaha')maxTo=Math.min(all,s.cur+potTotal()+(s.cur-p.b));
  const minTo=Math.min(s.cur+s.minR,maxTo);return {toCall,canCheck:s.cur===p.b,minTo,maxTo,canRaise:all>s.cur&&maxTo>s.cur};}
function pkAct(i,a,amt){const s=PK.st,p=s.seats[i];if(!p||s.turn!==i||s.street==='draw'||s.street==='disc'||s.street==='done')return false;
  const L=pkLegal(i);const pre=s.street==='pre'||s.street==='bet1',curB=s.cur;

function cat(a,b,c,d,e){const s0=a&3,sf=(b&3)===s0&&(c&3)===s0&&(d&3)===s0&&(e&3)===s0;R[0]=(a>>2)+2;R[1]=(b>>2)+2;R[2]=(c>>2)+2;R[3]=(d>>2)+2;R[4]=(e>>2)+2;

if(st&&sf)return r0===14&&r4===10?0:1;if(r0===r3||r1===r4)return 2;if((r0===r2&&r3===r4)||(r0===r1&&r2===r4))return 3;if(sf)return 4;if(st)return 5;
if(r0===r2||r1===r3||r2===r4)return 6;let p=0,hi=0;if(r0===r1){p++;hi=r0;}if(r1===r2){p++;if(r1>hi)hi=r1;}if(r2===r3){p++;if(r2>hi)hi=r2;}if(r3===r4){p++;if(r3>hi)hi=r3;}
if(p===2)return 7;if(p===1&&hi>=11)return 8;return 9;}
onmessage=e=>{const hand=e.data.hand;const pay=PAY.slice();pay[0]=e.data.royal;const used=new Uint8Array(52);hand.forEach(c=>used[c]=1);const rem=[];for(let c=0;c<52;c++)if(!used[c])rem.push(c);const N=rem.length;
const out=[];const h=new Int32Array(5);
for(let m=31;m>=0;m--){let k=0;for(let i=0;i<5;i++)if(m&(1<<i))h[k++]=hand[i];const need=5-k;const cnt=new Float64Array(10);let total=0;
function rec(s,d){if(d===need){cnt[cat(h[0],h[1],h[2],h[3],h[4])]++;total++;return;}for(let a=s;a<=N-(need-d);a++){h[k+d]=rem[a];rec(a+1,d+1);}}
rec(0,0);let ev=0;for(let c=0;c<10;c++)ev+=cnt[c]*pay[c];out.push({m,ev:ev/total,dist:Array.from(cnt,x=>x/total)});postMessage({progress:(32-m)/32});}

const VP={deck:[],hand:[],held:[false,false,false,false,false],phase:'bet',coins:5,denom:5,res:null,solve:null,prog:0,won:0};

async function roomApi(){if(inClaude()){if(ROOMAPI!==undefined)return ROOMAPI;try{ROOMAPI=await window.claude.use('room');}catch(e){ROOMAPI=null;}return ROOMAPI;}return (FB.on&&FB.user&&FB.db)?FBROOM:null;}

  if(!RAPI&&!inClaude()&&fbCfg()){h+=_L`<div class="panel stack"><h3>מתחברים כדי לשחק עם חברים</h3><p class="muted">חדרי אונליין עובדים לכל מי שמתחבר עם Google לאתר. כל חבר נכנס לאותו אתר, מתחבר, ומצטרף עם קוד החדר.</p><button class="btn" data-a="fbin">התחבר עם Google</button><button class="btn dark" data-a="setup" data-g="bj">או: בלאק ג׳ק מאותו טלפון</button></div>`;}
  else if(!RAPI){h+=_L`<div class="panel stack"><h3>אונליין לא זמין כאן</h3><p class="muted">משחק אונליין עובד כשהמשחק פתוח בתוך Claude וכל החברים נכנסים לאותו קישור שיתוף כשהם מחוברים לחשבון. בינתיים אפשר לשחק עם חברים מאותו טלפון.</p><button class="btn" data-a="setup" data-g="bj">בלאק ג׳ק מאותו טלפון</button><button class="btn dark" data-a="setup" data-g="poker" data-var="holdem">פוקר מאותו טלפון</button></div>`;}
  else if(!NET){h+=_L`<div class="panel stack"><label class="lbl" for="nick">הכינוי שלך</label><input class="txt" id="nick" maxlength="14" value="${esc(S.nick)}" placeholder="למשל: אורי"></div>
    <div class="panel stack"><h3>פתח חדר</h3>${seg('netg',[['bj',_T('בלאק ג׳ק')],['holdem',_T('הולדם')],['omaha',_T('אומהה')],['draw',_T('5 קלפים')]],SETUP.netg||'holdem')}<button class="btn" data-a="netcreate">צור חדר וקבל קוד</button></div>
    <div class="panel stack"><h3>הצטרף לחדר</h3><input class="txt" id="joincode" maxlength="6" placeholder="קוד בן 4 תווים" style="direction:ltr;text-align:center;letter-spacing:4px"><button class="btn dark" data-a="netjoin">הצטרף</button></div>

    <label class="lbl">בוטים נוספים</label>${seg('netbots',[0,1,2,3].map(n=>[n,n]),NET.bots)}</div><button class="btn" data-a="netstart" ${Object.keys(NET.guests).length?'':'disabled'}>התחל ${g==='bj'?_T('בלאק ג׳ק'):VAR_NAME[g]}</button>${Object.keys(NET.guests).length?'':_T('<p class="hint">ממתינים שלפחות חבר אחד יצטרף…</p>')}`;}

  h+=`</div>`;V.innerHTML=h;const ni=$('#nick');if(ni)ni.addEventListener('input',()=>{S.nick=ni.value.trim();save();});}
async function netCreate(){const R=await roomApi();if(!R)return;track('online_room',{role:'host'});const code=Math.random().toString(36).slice(2,6);
  try{const r=await R.join('c77-'+code);NET={role:'host',code,r,game:SETUP.netg||'holdem',phase:'lobby',guests:{},bots:1,last:{}};
    await r.presence({role:'host',nick:S.nick||_T('מארח'),game:NET.game,phase:'lobby'});NET.unsub=r.onPeers(netPeers);chatRender();render();}
  catch(e){toast(_T('לא הצלחתי לפתוח חדר: ')+esc(e.code||e.message||''),'bad');}}
async function netJoin(){track('online_room',{role:'guest'});const code=($('#joincode')?.value||'').trim().toLowerCase();if(!/^[a-z0-9]{4}$/.test(code)){toast(_T('הקוד צריך להיות 4 תווים'),'bad');return;}const R=await roomApi();if(!R)return;
  try{const r=await R.join('c77-'+code);NET={role:'guest',code,r,seq:Date.now(),myPeer:null,host:null,mySeat:-1};await r.presence({role:'guest',nick:S.nick||_T('אורח')});NET.unsub=r.onPeers(netPeers);chatRender();render();}
  catch(e){toast(_T('לא הצלחתי להצטרף: ')+esc(e.code||e.message||''),'bad');}}
function netPeers(ch){if(!NET)return;const peers=ch.peers||[];netChatScan(peers);
  if(NET.role==='host'){
    peers.forEach(p=>{if(p.sameTab||!p.presence||p.presence.role!=='guest')return;if(!NET.guests[p.peer])NET.guests[p.peer]={nick:String(p.presence.nick||_T('אורח')).slice(0,14)};
      const act=p.presence.act;if(act&&typeof act.n==='number'&&act.n>(NET.last[p.peer]||0)){NET.last[p.peer]=act.n;netApply(p.peer,act);}});
    (ch.left||[]).forEach(p=>{delete NET.guests[p.peer];const st=NET.game==='bj'?BJ.st:PK.st;if(st&&NET.phase==='play'){const s=st.seats.find(x=>x.peer===p.peer);if(s){s.t='bot';s.sty=NET.game==='bj'?'basic':'pro';s.n+=_T(' (בוט)');toast(esc(s.n)+_T(' התנתק — בוט ממשיך במקומו'));NET.game==='bj'?bjTick():pkTick();}}});
    if(CUR.v==='online')render();return;}
  const me=peers.find(p=>p.sameTab);if(me)NET.myPeer=me.peer;
  const host=peers.find(p=>p.presence&&p.presence.role==='host');
  if(!host&&NET.host){NET.host=null;toast(_T('המארח עזב את החדר'),'bad');}
  NET.host=host||null;if(!host){if(CUR.v==='online')render();return;}
  const pr=host.presence;
  if(pr.phase==='play'&&pr.s){const st=pr.s;if(st.g==='pk'){PK.st=st;}else{BJ.st=st;}NET.mySeat=st.seats.findIndex(x=>x.peer===NET.myPeer);
    const view=st.g==='pk'?'pk':'bj';if(CUR.v!==view){CUR={v:view};}if(view==='bj'&&NET.mySeat>=0)BJ.betSeat=NET.mySeat;render();}
  else if(CUR.v==='online')render();}
function netApply(peer,act){const st=NET.game==='bj'?BJ.st:PK.st;if(!st||NET.phase!=='play')return;const i=st.seats.findIndex(x=>x.peer===peer);if(i<0)return;
  if(NET.game==='bj'){if(bjAct(i,String(act.a),+act.amt||0,act.d))bjTick();}
  else{const ok=act.a==='disc'?pkDiscAct(i,Array.isArray(act.d)?+act.d[0]:0):act.a==='draw'?pkDrawAct(i,Array.isArray(act.d)?act.d.map(Number):[]):pkAct(i,String(act.a),+act.amt||0);if(ok)pkTick();}}

/* ================= THREE CARD POKER ================= */
const TCP={phase:'bet',ante:25,pp:0,target:'ante',ph:[],dh:[],res:null,play:false,key:0,deck:[]};
const TC_CATS=[_T('קלף גבוה'),_T('זוג'),_T('צבע'),_T('רצף'),_T('שלישייה'),_T('רצף צבע')];
const TC_PP=[0,1,4,6,30,40],TC_AB=[0,0,0,1,4,5];
function tc3(h){const r=h.map(rk).sort((a,b)=>b-a);const fl=(h[0]&3)===(h[1]&3)&&(h[1]&3)===(h[2]&3);let st=0;
  if(r[0]!==r[1]&&r[1]!==r[2]){if(r[0]-r[2]===2)st=r[0];else if(r[0]===14&&r[1]===3&&r[2]===2)st=3;}
  let cat,k;if(st&&fl){cat=5;k=[st];}else if(r[0]===r[2]){cat=4;k=[r[0]];}else if(st){cat=3;k=[st];}else if(fl){cat=2;k=r;}
  else if(r[0]===r[1]||r[1]===r[2]){cat=1;k=[r[1],r[0]===r[1]?r[2]:r[0]];}else{cat=0;k=r;}
  return ((cat*15+(k[0]||0))*15+(k[1]||0))*15+(k[2]||0);}
const tcCat=v=>Math.floor(v/3375);
const tcQual=v=>tcCat(v)>=1||Math.floor(v/225)%15>=12;
function tcName(v){const c=tcCat(v),a=RCH(Math.floor(v/225)%15);return c===0?a+_T(' גבוה'):c===1?_T('זוג ')+a:c===4?_T('שלישיית ')+a:TC_CATS[c]+_T(' עד ')+a;}
function tcpInit(){TCP.phase='bet';TCP.ante=25;TCP.pp=0;TCP.target='ante';TCP.ph=[];TCP.dh=[];TCP.res=null;TCP.play=false;}
function tcpChip(v){if(TCP.phase!=='bet')return;const k=TCP.target;const nv=TCP[k]+v;const need=(k==='ante'?nv*2+TCP.pp:TCP.ante*2+nv);if(need>bal()){toast(_T('צריך כיסוי גם להימור המשחק (בגובה האנטה)'),'bad');return;}TCP[k]=Math.min(nv,5000);tcpRender();}
function tcpDeal(){if(TCP.ante<5){toast(_T('אנטה מינימלי 5'));return;}if(TCP.ante*2+TCP.pp>bal()){toast(_T('אין מספיק צ׳יפים'),'bad');return;}
  addBal(-(TCP.ante+TCP.pp));TCP.deck=newDeck();TCP.ph=[TCP.deck.pop(),TCP.deck.pop(),TCP.deck.pop()];TCP.dh=[TCP.deck.pop(),TCP.deck.pop(),TCP.deck.pop()];TCP.phase='decide';TCP.play=false;TCP.res=null;TCP.key++;TCP.solve=null;tcpRender();}
function tcpSolve(){if(TCP.solve)return TCP.solve;const used=new Set(TCP.ph);const rem=[];for(let c=0;c<52;c++)if(!used.has(c))rem.push(c);
  const pv=tc3(TCP.ph);const ab=TC_AB[tcCat(pv)];let ev=0,n=0,q=0,w=0,t=0;const h=[0,0,0];const L=rem.length;
  for(let a=0;a<L;a++)for(let b=a+1;b<L;b++)for(let c=b+1;c<L;c++){h[0]=rem[a];h[1]=rem[b];h[2]=rem[c];const dv=tc3(h);n++;let r;
    if(!tcQual(dv))r=1;else{q++;if(pv>dv){r=2;w++;}else if(pv===dv){r=0;t++;}else r=-2;}ev+=r+ab;}
  TCP.solve={play:ev/n,fold:-1,pq:q/n,pw:q?w/q:0,pt:q?t/q:0,ab,pp:TC_PP[tcCat(pv)]};return TCP.solve;}
function tcpDecide(play){if(TCP.phase!=='decide')return;if(play&&bal()<TCP.ante){toast(_T('אין מספיק צ׳יפים להימור המשחק'),'bad');return;}
  const R=tcpSolve();if(S.coach){const ok=play===(R.play>-1);recDec('tcp',ok);if(!ok)toast(play?_L`הסולבר: לקפל — לשחק שווה ${R.play.toFixed(2)} אנטה, לקפל −1`:_L`הסולבר: לשחק — EV ${R.play.toFixed(2)} אנטה מול −1 בקיפול`,'bad');}
  TCP.play=play;if(play)addBal(-TCP.ante);
  const pv=tc3(TCP.ph),dv=tc3(TCP.dh),A=TCP.ante;let ret=0;const lines=[];
  if(play){const ab=TC_AB[tcCat(pv)]*A;if(!tcQual(dv)){ret+=A*2+A;lines.push(_T('הדילר לא העפיל — האנטה משולם, המשחק חוזר'));}
    else if(pv>dv){ret+=A*4;lines.push(_T('ניצחת את הדילר'));}else if(pv===dv){ret+=A*2;lines.push(_T('תיקו'));}else lines.push(_T('הדילר ניצח'));
    if(ab){ret+=ab;lines.push(_T('בונוס אנטה +')+fmt(ab));}}else lines.push(_T('קיפלת'));
  if(TCP.pp){const m=TC_PP[tcCat(pv)];if(m){ret+=TCP.pp*(m+1);lines.push(_T('פייר פלוס +')+fmt(TCP.pp*m));}else lines.push(_T('פייר פלוס לא נכנס'));}
  if(ret)addBal(ret);const net=ret-(A+TCP.pp+(play?A:0));recHand('tcp',net,-0.0337*A-0.0232*TCP.pp);chal('tcp_10');if(tcCat(pv)===5)unlock('tcp_sf');
  TCP.res={net,txt:lines.join(' · ')+` · <b class="${net>0?'good':net<0?'bad':''}">${sgn(net)}</b>`};TCP.phase='done';tcpRender();}

/* ================= BACCARAT ================= */
const BAC={shoe:[],cut:14,bets:{},prev:{},chip:25,phase:'bet',coup:null,order:[],step:0,res:null,road:[],key:0,mc:null,mcKey:-1,timer:null};
const bv=c=>{const r=rk(c);return r===14?1:r>=10?0:r;};
const bTot=h=>h.reduce((a,c)=>a+bv(c),0)%10;
function bacInit(){BAC.shoe=newDeck(8);BAC.shoe.pop();BAC.cut=14+rnd(10);BAC.bets={};BAC.prev={};BAC.phase='bet';BAC.coup=null;BAC.res=null;BAC.road=[];BAC.mcKey=-1;}
function bacCoup(draw){const P=[draw(),draw()],B=[draw(),draw()];const pt=bTot(P),bt=bTot(B);
  if(pt<8&&bt<8){let p3=null;if(pt<=5){p3=draw();P.push(p3);}
    if(p3===null){if(bt<=5)B.push(draw());}
    else{const v=bv(p3);if(bt<=2||(bt===3&&v!==8)||(bt===4&&v>=2&&v<=7)||(bt===5&&v>=4&&v<=7)||(bt===6&&(v===6||v===7)))B.push(draw());}}
  return {P,B,pt:bTot(P),bt:bTot(B)};}
const BAC_SPOT={p:[_T('שחקן'),'1:1'],b:[_T('בנקאי'),'0.95:1'],t:[_T('טאי'),'8:1'],pp:[_T('זוג שחקן'),'11:1'],bp:[_T('זוג בנקאי'),'11:1']};
function bacBet(k){if(BAC.phase!=='bet')return;const tot=Object.values(BAC.bets).reduce((a,b)=>a+b,0);if(tot+BAC.chip>bal()){toast(_T('אין מספיק צ׳יפים'),'bad');return;}BAC.bets[k]=(BAC.bets[k]||0)+BAC.chip;bacRender();}
function bacDeal(){if(BAC.phase!=='bet')return;const tot=Object.values(BAC.bets).reduce((a,b)=>a+b,0);if(!tot){toast(_T('הניחו הימור'));return;}if(tot>bal()){toast(_T('אין מספיק צ׳יפים'),'bad');return;}
  if(BAC.shoe.length<BAC.cut){BAC.shoe=newDeck(8);BAC.shoe.pop();BAC.cut=14+rnd(10);BAC.road=[];toast(_T('נעל חדשה — 8 חפיסות'));}
  addBal(-tot);BAC.prev={...BAC.bets};BAC.stake={...BAC.bets};BAC.coup=bacCoup(()=>BAC.shoe.pop());
  const c=BAC.coup;BAC.order=[['P',0],['B',0],['P',1],['B',1]];if(c.P[2]!=null)BAC.order.push(['P',2]);if(c.B[2]!=null)BAC.order.push(['B',2]);
  BAC.step=0;BAC.key++;BAC.phase='deal';BAC.res=null;bacStep();}
function bacStep(){BAC.step++;if(CUR.v==='bac')bacRender();if(BAC.step<BAC.order.length)BAC.timer=setTimeout(bacStep,520*SPD());else BAC.timer=setTimeout(bacSettle,450*SPD());}
function bacSettle(){const c=BAC.coup;const w=c.pt>c.bt?'p':c.bt>c.pt?'b':'t';const pp=rk(c.P[0])===rk(c.P[1]),bp=rk(c.B[0])===rk(c.B[1]);let ret=0;const B=BAC.stake;
  if(B.p)ret+=w==='p'?B.p*2:w==='t'?B.p:0;if(B.b)ret+=w==='b'?B.b*1.95:w==='t'?B.b:0;if(B.t&&w==='t')ret+=B.t*9;if(B.pp&&pp)ret+=B.pp*12;if(B.bp&&bp)ret+=B.bp*12;
  ret=Math.floor(ret);if(ret)addBal(ret);const tot=Object.values(B).reduce((a,b)=>a+b,0);const net=ret-tot;recHand('bac',net,-(B.b||0)*.0106-(B.p||0)*.0124-(B.t||0)*.1436-((B.pp||0)+(B.bp||0))*.1036);if(B.t&&w==='t')unlock('bac_tie');if(B.b&&w==='b')chal('bac_b5');
  BAC.road.push(w);if(BAC.road.length>90)BAC.road.shift();BAC.res={w,net,pp,bp};BAC.phase='bet';BAC.bets={};bacRender();}
function bacMC(){if(BAC.mcKey===BAC.shoe.length&&BAC.mc)return BAC.mc;const d=BAC.shoe.slice();const L=d.length;const N=12000;let p=0,b=0,t=0,pp=0,bp=0;
  for(let i=0;i<N;i++){let k=0;const draw=()=>{const j=k+Math.floor(Math.random()*(L-k));const x=d[k];d[k]=d[j];d[j]=x;return d[k++];};const r=bacCoup(draw);
    if(r.pt>r.bt)p++;else if(r.bt>r.pt)b++;else t++;if(rk(r.P[0])===rk(r.P[1]))pp++;if(rk(r.B[0])===rk(r.B[1]))bp++;}
  p/=N;b/=N;t/=N;pp/=N;bp/=N;BAC.mc={p,b,t,pp,bp,ev:{p:p-b,b:.95*b-p,t:8*t-(1-t),pp:11*pp-(1-pp),bp:11*bp-(1-bp)}};BAC.mcKey=BAC.shoe.length;return BAC.mc;}
function bacRender(V=$('#view')){const c=BAC.coup;const shownN=BAC.phase==='deal'?BAC.step:(c?9:0);

  const hand=side=>{const arr=c?(side==='P'?c.P:c.B):[];const vis=arr.filter((x,k)=>shown(side,k));return {html:arr.map((x,k)=>shown(side,k)?cardHTML(x,'',`bac${BAC.key}${side}${k}`):'').join(''),tot:vis.length?bTot(vis):null};};
  const P=hand('P'),Bh=hand('B');const r=BAC.res;const bets=BAC.phase==='deal'?BAC.stake:BAC.bets;
  let h=_L`<div class="tbar"><button class="btn ghost sm" data-a="home">קום</button><h2>באקרה</h2><span class="pill gold">8 חפיסות</span><span class="pill">${BAC.shoe.length} קלפים</span>${helpBtn()}</div>
  <div class="felt"><div class="bachands"><div class="bachand ${r&&r.w==='p'?'win':''}"><span class="lbl2" style="color:var(--info)">שחקן</span><div class="cards">${P.html||'<div style="height:57px"></div>'}</div>${P.tot!=null?`<span class="tot">${P.tot}</span>`:''}</div>
    <div class="bachand ${r&&r.w==='b'?'win':''}"><span class="lbl2" style="color:var(--bad)">בנקאי</span><div class="cards">${Bh.html||'<div style="height:57px"></div>'}</div>${Bh.tot!=null?`<span class="tot">${Bh.tot}</span>`:''}</div></div>
   <div class="resline">${r?`${{p:_T('השחקן מנצח'),b:_T('הבנקאי מנצח'),t:_T('טאי')}[r.w]}${r.pp?_T(' · זוג שחקן'):''}${r.bp?_T(' · זוג בנקאי'):''} · <b class="${r.net>0?'good':r.net<0?'bad':''}">${sgn(r.net)}</b>`:BAC.phase==='deal'?_T('מחלקים…'):_T('הניחו הימורים')}</div>
   <div class="bspots">${['pp','t','bp','p','b'].map(k=>`<button class="bspot ${k==='p'||k==='b'?'big':''} ${k[0]==='p'&&k!=='pp'?'p':''} ${k==='b'?'b':''} ${k==='t'?'t':''} ${r&&((k===r.w)||(k==='pp'&&r.pp)||(k==='bp'&&r.bp))?'hit':''}" data-a="bacbet" data-k="${k}" ${BAC.phase!=='bet'?'disabled':''}>${BAC_SPOT[k][0]}<small>${BAC_SPOT[k][1]}</small>${bets[k]?`<span class="bc">${bets[k]>=1000?(bets[k]/1000).toFixed(1)+'K':bets[k]}</span>`:''}</button>`).join('')}</div>
   ${BAC.road.length?`<div class="road">${BAC.road.map(x=>`<span class="bead ${x}">${{p:'P',b:'B',t:'T'}[x]}</span>`).join('')}</div>`:''}</div>
  <div class="actions"><div class="chips">${[5,25,100,500,1000].map(x=>`<button class="chip c${x} ${BAC.chip===x?'on':''}" data-a="bacchip" data-v="${x}">${x>=1000?'1K':x}</button>`).join('')}</div>
   <div class="grid" style="margin-top:8px"><button class="btn dark" data-a="bacclear" ${BAC.phase!=='bet'?'disabled':''}>נקה</button><button class="btn dark" data-a="bacrebet" ${BAC.phase!=='bet'||!Object.keys(BAC.prev).length?'disabled':''}>שוב</button><button class="btn" data-a="bacdeal" ${BAC.phase!=='bet'?'disabled':''}>חלק</button></div></div>`;
  if(S.solver){const M=bacMC();const cnt={p:0,b:0,t:0};BAC.road.forEach(x=>cnt[x]++);
    const myEV=Object.entries(bets).reduce((a,[k,v])=>a+M.ev[k]*v,0);
    h+=_L`<section class="solver"><header><b>סולבר חי</b><span class="spacer"></span><span class="pill">12,000 סימולציות מהנעל</span></header><div class="body">
     <div class="kv"><div><small>שחקן מנצח</small><b>${pct(M.p,1)}</b></div><div><small>בנקאי מנצח</small><b>${pct(M.b,1)}</b></div><div><small>טאי</small><b>${pct(M.t,1)}</b></div></div>
     <div class="scroll"><table class="t"><tr><th>הימור</th><th>תשלום</th><th>EV ל-100</th><th>בנעל מלאה</th></tr>${[['b','1.06%'],['p','1.24%'],['t','14.36%'],['pp','10.36%'],['bp','10.36%']].map(([k,ed])=>`<tr class="${k==='b'?'best':''}"><td>${BAC_SPOT[k][0]}</td><td class="n">${BAC_SPOT[k][1]}</td><td class="n">${(M.ev[k]*100).toFixed(2)}</td><td class="n">−${ed}</td></tr>`).join('')}</table></div>
     ${Object.keys(bets).length?_L`<p class="note">התוחלת של ההימורים שלך עכשיו: <b class="${myEV>=0?'good':'bad'}">${sgn(myEV)}</b> לחלוקה.</p>`:''}
     <p class="note">בנקאי הוא ההימור הכי טוב בשולחן; טאי וזוגות מפסידים פי 10. הסימולציה משתמשת בקלפים שנשארו בנעל, ולכן הסיכויים זזים מעט (±0.5% זה רעש סימולציה). ${BAC.road.length>5?_L`בנעל הזו: P ${cnt.p} · B ${cnt.b} · T ${cnt.t}. "רצפים" בדרך לא מנבאים את החלוקה הבאה.`:''}</p></div></section>`;}

/* ================= SOUND ================= */
let ACTX=null,LASTCARD=0,AU=null;
/* audio engine: compressor + synthetic room reverb + cached noise; every sound is physically modelled, no plain beeps */
function au(){if(AU)return AU;const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;const c=new A();ACTX=c;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.18;
  const master=c.createGain();master.gain.value=.85;master.connect(comp);comp.connect(c.destination);
  const len=Math.floor(c.sampleRate*1.9);const ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++){const k=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-k,3.4)*(i<c.sampleRate*.012?i/(c.sampleRate*.012):1);}}
  const rev=c.createConvolver();rev.buffer=ir;const wet=c.createGain();wet.gain.value=.3;rev.connect(wet);wet.connect(master);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate);const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  AU={c,master,rev,noise:nb};return AU;}
function nz(t,dur,o={}){const {c,noise,master,rev}=AU;const s=c.createBufferSource();s.buffer=noise;const fl=c.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||3000,t);
  if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+dur);fl.Q.value=o.q||1;const e=c.createGain();const a=o.a||.001;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(o.g||.3,t+a);e.gain.exponentialRampToValueAtTime(.0001,t+Math.max(dur,a+.002));
  s.connect(fl);fl.connect(e);e.connect(o.dest||master);if(o.rev){const sd=c.createGain();sd.gain.value=o.rev;e.connect(sd);sd.connect(rev);}s.start(t,Math.random()*.6);s.stop(t+dur+.03);}
function osc(t,f,dur,o={}){const {c,master}=AU;const x=c.createOscillator(),e=c.createGain();x.type=o.type||'sine';x.frequency.setValueAtTime(f,t);if(o.detune)x.detune.value=o.detune;
  const a=o.a||.004;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(o.g||.1,t+a);e.gain.exponentialRampToValueAtTime(.0001,t+dur);x.connect(e);e.connect(o.dest||master);x.start(t);x.stop(t+dur+.03);}
/* one clay chip hitting another: two resonant body modes + a soft low thud + faint ring */
function clack(t,v=1,p=1){v*=2.4;nz(t,.024,{f:2500*p,q:5,g:.5*v});nz(t,.017,{f:4700*p,q:8,g:.3*v});nz(t,.035,{type:'lowpass',f:850,q:.7,g:.22*v});osc(t,3900*p,.04,{g:.025*v,a:.001});}
/* a chip dropped on a stack bounces 2–3 times */
function chipDrop(t,v=1){const p=.92+Math.random()*.16;clack(t,v,p);clack(t+.026+Math.random()*.012,v*.5,p*1.04);if(Math.random()<.65)clack(t+.052+Math.random()*.02,v*.26,p*.97);}
/* a dealer pushing a pile: many chips, irregular, front-loaded */
function cascade(t,n,span,v=.55){for(let i=0;i<n;i++){const tt=t+Math.pow(Math.random(),1.4)*span;clack(tt,v*(.45+Math.random()*.55),.85+Math.random()*.3);}}
/* glockenspiel-like chime: inharmonic partials, chorus, mallet click, room */
function chime(t,f,o={}){const {c,master,rev}=AU;const g=o.g||.06,dur=o.dur||1.5;const out=c.createGain();out.connect(master);const sd=c.createGain();sd.gain.value=o.rev??.7;out.connect(sd);sd.connect(rev);
  osc(t,f,dur,{g:g,dest:out,a:.002,detune:-4});osc(t,f,dur*.9,{g:g*.6,dest:out,a:.002,detune:5});
  [[2.76,.3,.45],[5.4,.11,.25],[8.93,.04,.14]].forEach(([m,a,d])=>osc(t,f*m,dur*d,{g:g*a,dest:out,a:.0015}));
  nz(t,.012,{type:'highpass',f:5000,q:.7,g:g*.6,dest:out});}
function cardSnd(t){const p=.9+Math.random()*.2;nz(t,.08,{f:1500*p,f2:4300*p,q:.9,g:.5,a:.014});nz(t+.065,.035,{type:'lowpass',f:650,q:.5,g:.42});nz(t+.066,.014,{f:2900,q:2,g:.18});}
function ballTick(t){const p=.85+Math.random()*.3;nz(t,.016,{f:3300*p,q:6,g:.6,rev:.15});osc(t,2050*p,.022,{g:.08,a:.001});}
function whoosh(t,dur,g=.08){nz(t,dur,{f:350,f2:3200,q:.8,g,a:dur*.7,rev:.4});}
function snd(t){if(t==='chip')vib(6);else if(t==='win'||t==='bigwin')vib([18,40,18]);else if(t==='level')vib([30,60,30,60,60]);if(!S.sound)return;
  try{const A=au();if(!A)return;const c=A.c;if(c.state==='suspended'&&c.resume)Promise.resolve(c.resume()).catch(()=>{});const n=c.currentTime+.01;
    if(t==='card')cardSnd(n);
    else if(t==='chip')chipDrop(n,.9);
    else if(t==='tick')ballTick(n);
    else if(t==='right'){chime(n,1319,{g:.045,dur:.7,rev:.5});chime(n+.08,1760,{g:.04,dur:.8,rev:.5});}
    else if(t==='wrong'){nz(n,.14,{type:'lowpass',f:320,q:.8,g:.55});osc(n,150,.22,{g:.07,type:'triangle'});}
    else if(t==='win'){cascade(n,6,.32,.3);[784,988,1175].forEach((f,i)=>chime(n+.06+i*.085,f,{g:.05,dur:1.3}));}
    else if(t==='bigwin'){cascade(n,18,.9,.32);[1047,1319,1568,2093].forEach((f,i)=>chime(n+.05+i*.09,f,{g:.05,dur:1.6}));[1047,1319,1568].forEach(f=>chime(n+.5,f,{g:.035,dur:2.2}));}
    else if(t==='level'){whoosh(n,.45,.07);[523,587,659,784,880,1047,1175].forEach((f,i)=>chime(n+.25+i*.06,f,{g:.04,dur:.9}));[1047,1319,1568,2093].forEach(f=>chime(n+.72,f,{g:.04,dur:2.6,rev:.9}));cascade(n+.7,10,.6,.22);}
  }catch(e){}}
function sndCard(){const now=Date.now();if(now-LASTCARD<70)return;LASTCARD=now;setTimeout(()=>snd('card'),0);}

/* ================= CAREER (XP & levels) ================= */

const PF_PCT=(()=>{const pts=r=>r===14?10:r===13?8:r===12?7:r===11?6:r/2;
  const chen=(a,b,s)=>{const hi=Math.max(a,b),lo=Math.min(a,b);let sc;if(a===b)sc=Math.max(5,pts(hi)*2);else{sc=pts(hi);if(s)sc+=2;const gap=hi-lo-1;sc-=gap===0?0:gap===1?1:gap===2?2:gap===3?4:5;if(gap<=1&&hi<12)sc+=1;}return Math.ceil(sc);};
  const cls=[];for(let a=2;a<=14;a++)for(let b=2;b<=a;b++){if(a===b)cls.push({k:RCH(a)+RCH(b),v:chen(a,b,false),n:6});else{cls.push({k:RCH(a)+RCH(b)+'s',v:chen(a,b,true),n:4});cls.push({k:RCH(a)+RCH(b)+'o',v:chen(a,b,false),n:12});}}
  cls.sort((x,y)=>y.v-x.v);const M={};let cum=0,i=0;while(i<cls.length){let j=i,tot=0;while(j<cls.length&&cls[j].v===cls[i].v){tot+=cls[j].n;j++;}for(let k=i;k<j;k++)M[cls[k].k]=(cum+tot)/1326;cum+=tot;i=j;}return M;})();
function pfKey(a,b){const x=rk(a),y=rk(b);const hi=Math.max(x,y),lo=Math.min(x,y);return hi===lo?RCH(hi)+RCH(lo):RCH(hi)+RCH(lo)+((a&3)===(b&3)?'s':'o');}
function drawish(h,b){const all=h.concat(b);const sc=[0,0,0,0],hs=[0,0,0,0];all.forEach(c=>sc[c&3]++);h.forEach(c=>hs[c&3]++);for(let s=0;s<4;s++)if(sc[s]>=4&&hs[s]>=1)return true;
  let m=0,hm=0;all.forEach(c=>{m|=1<<rk(c);});h.forEach(c=>{hm|=1<<rk(c);});if(m&(1<<14))m|=2;if(hm&(1<<14))hm|=2;
  for(let lo=1;lo<=10;lo++){let cnt=0;for(let r=lo;r<lo+5;r++)if(m&(1<<r))cnt++;if(cnt>=4&&(hm&(31<<lo)))return true;}return false;}
function madeOrDraw(v,h,b){const c=catOf(handScore(v,h,b));const bc=catOf(evalHand(b,b.length));if(c>=1&&c>bc)return true;return b.length<5&&drawish(h,b);}
function acceptOpp(v,h,b,r){if(!r)return true;if(v==='holdem'&&r.frac<1&&PF_PCT[pfKey(h[0],h[1])]>r.frac)return false;if(r.agg>0&&b.length>=3&&!madeOrDraw(v,h,b))return Math.random()<Math.pow(.3,r.agg);return true;}
function oppRange(i){const s=PK.st,p=s.seats[i];if(s.v==='draw'||!p.hx)return null;const x=p.hx;let f=x.pr>=2?.06:x.pr===1?.16:x.pc?.32:x.lp?.6:1;if(s.v!=='holdem')f=1;
  const pr=PK.prof[i];if(pr&&pr.loose)f=Math.min(1,f*1.7);const agg=pr&&pr.loose?Math.max(0,x.agg-1):x.agg;return (f>=1&&!agg)?null:{frac:f,agg};}
function oppRanges(i){const s=PK.st;const out=[];s.seats.forEach((q,j)=>{if(j!==i&&inHand(q))out.push(oppRange(j));});return out;}
function rangeTxt(j){const r=oppRange(j);const p=PK.st.seats[j];if(!r)return _T('כל יד אפשרית');const a=[];if(r.frac<1)a.push(_L`טופ ${pct(r.frac,0)} מהידיים (לפי הפעולות לפני הפלופ)`);if(p.hx.agg)a.push(_L`הימר/ה ${p.hx.agg}× אחרי הפלופ — בעיקר ידיים עשויות ודרואים`);if(PK.prof[j]&&PK.prof[j].loose)a.push(_T('משחק/ת אגרסיבי — הטווח רחב'));return a.join(' · ');}

function simHand(tb,sb,bb){const sv={st:PK.st,deck:PK.deck,ms:PK.myStart,rec:PK.rec,prof:PK.prof,sk:PK.solveKey,sl:PK.solve,sel:PK.sel,rt:PK.raiseTo,hud:PK.hud,told:PK.told};
  try{PK.st=tb;PK.prof={};PK.hud={};tb.sb=sb;tb.bb=bb;pkStartHand();let g=0;while(tb.street!=='done'&&g++<800){if(tb.auto){pkEndRound();continue;}if(tb.turn<0)break;botAct(tb.turn);}}
  catch(e){}
  finally{PK.st=sv.st;PK.deck=sv.deck;PK.myStart=sv.ms;PK.rec=sv.rec;PK.prof=sv.prof;PK.solveKey=sv.sk;PK.solve=sv.sl;PK.sel=sv.sel;PK.raiseTo=sv.rt;PK.hud=sv.hud;PK.told=sv.told;}}
function tourAlive(){const s=PK.st;const all=s.tour&&s.tour.mtt?[...s.seats,...s.tour.mtt.tables.flatMap(t=>t.seats)]:s.seats;return all.filter(p=>p.c>0||inHand(p)).length;}
function mttStep(){const s=PK.st,T=s.tour,M=T.mtt;if(T.over)return true;
  if(s.hand>0)M.tables.forEach(tb=>{if(tb.seats.filter(p=>p.c>0).length>=2)simHand(tb,s.sb,s.bb);});
  const all=[...s.seats,...M.tables.flatMap(t=>t.seats)];const alive=all.filter(p=>p.c>0).length;
  const newly=all.filter(p=>p.c<=0&&T.places[p.pid]==null);newly.forEach((p,k)=>{T.places[p.pid]=alive+newly.length-k;});
  const me=s.seats.find(p=>p.t==='me');
  if(me&&me.c<=0){pkTourEnd(T.places[me.pid]);return true;}
  if(alive<=1){pkTourEnd(1);return true;}
  const aliveOf=t=>t.seats.filter(q=>q.c>0).length;
  while(M.tables.length&&alive<=9*M.tables.length){let bi=0;M.tables.forEach((t,i)=>{if(aliveOf(t)<aliveOf(M.tables[bi]))bi=i;});
    const brk=M.tables.splice(bi,1)[0];const targets=[s,...M.tables];
    brk.seats.filter(p=>p.c>0).forEach(p=>{let tg=targets[0];targets.forEach(t=>{if(aliveOf(t)<aliveOf(tg))tg=t;});const np=mkSeat({n:p.n,t:p.t,c:p.c,sty:p.sty,pid:p.pid});
      const slot=tg.seats.findIndex(q=>q.c<=0);if(slot>=0)tg.seats[slot]=np;else tg.seats.push(np);if(tg===s)pkLog(_L`${p.n} עבר/ה לשולחן שלך`);});
    if(!M.tables.length){toast(_T('שולחן הגמר!'),'good');pkLog(_T('שולחן הגמר — ')+alive+_T(' שחקנים'));}else pkLog(_T('שולחן נשבר והשחקנים פוזרו'));}
  if(s.hand>0&&s.hand%T.hpl===0&&T.lvl<TOUR_LV.length-1&&T.lastUp!==s.hand){T.lvl++;T.lastUp=s.hand;[s.sb,s.bb]=TOUR_LV[T.lvl];pkLog(_L`הבליינדים עולים ל-${fmt(s.sb)}/${fmt(s.bb)}`);toast(_L`רמה ${T.lvl+1}: בליינדים ${fmt(s.sb)}/${fmt(s.bb)}`);}
  return false;}

/* ================= PUSH / FOLD ================= */
const PF_BASE={UTG:.10,MP:.14,CO:.22,BTN:.34,SB:.46,BB:1};
function posOf(i){const s=PK.st,n=s.seats.length;const act=[];for(let k=1;k<=n;k++){const j=(s.btn+k)%n;if(!s.seats[j].out)act.push(j);}const m=act.length;const d=act.indexOf(i);
  if(m===2)return d===1?'SB':'BB';if(d===m-1)return 'BTN';if(d===0)return 'SB';if(d===1)return 'BB';if(d===m-2)return 'CO';if(d===m-3&&m>=6)return 'MP';return 'UTG';}
function pushPct(bbs,pos){const f=clamp(10/Math.max(1,bbs),.7,2.2);return Math.min(1,(PF_BASE[pos]||.12)*Math.pow(f,.85));}
function pfTable(){const st=[5,8,10,12,15];const ps=['UTG','MP','CO','BTN','SB'];return _L`<div class="scroll"><table class="t"><tr><th>בליינדים בסטאק</th>${ps.map(p=>`<th>${p}</th>`).join('')}</tr>${st.map(b=>`<tr><td class="n">${b}</td>${ps.map(p=>`<td class="n">${pct(pushPct(b,p),0)}</td>`).join('')}</tr>`).join('')}</table></div><p class="note">האחוז = כמה מהידיים הטובות ביותר דוחפים אול-אין כשאף אחד לא נכנס לפניך. ב-10 בליינדים מהכפתור: כל זוג, כל A, ורוב קלפי התמונה.</p>`;}

/* ================= HUD ================= */
function hudOf(p){if(!PK.hud)PK.hud={};return PK.hud[p.n]||(PK.hud[p.n]={h:0,vp:0,pfr:0,ra:0,ca:0});}
function hudAct(p,kind,pre){const H=hudOf(p);if(pre){if(!p.hx.vp){p.hx.vp=1;H.vp++;}if(kind==='raise'&&!p.hx.pf){p.hx.pf=1;H.pfr++;}}else{if(kind==='raise')H.ra++;else H.ca++;}}
function hudRead(H){if(H.h<8)return _T('עוד אין מספיק ידיים');const v=H.vp/H.h,r=H.pfr/H.h;if(v<.2&&r>=.12)return _T('טייט-אגרסיבי (TAG) — שחקן חזק, כבד את ההימורים שלו');if(v<.2)return _T('טייט-פסיבי (סלע) — נכנס רק עם ידיים טובות');if(v>.35&&r<.12)return _T('לוז-פסיבי (דג) — קורא הרבה, אל תבלף אותו');if(v>.35)return _T('לוז-אגרסיבי (LAG) — לוחץ הרבה, תן לו להמר לתוכך');return _T('מאוזן');}
function hudLine(p){const H=PK.hud&&PK.hud[p.n];if(!H||H.h<5)return '';return `<div class="hud">VPIP ${Math.round(H.vp/H.h*100)} · PFR ${Math.round(H.pfr/H.h*100)}</div>`;}
function openHud(i){const p=PK.st.seats[i];const H=hudOf(p);const af=H.ca?H.ra/H.ca:H.ra;

   <div class="kv" style="margin-top:8px"><div><small>אגרסיביות (AF)</small><b>${af.toFixed(1)}</b></div><div><small>הימורים אחרי פלופ</small><b>${H.ra}</b></div><div><small>קריאות אחרי פלופ</small><b>${H.ca}</b></div></div>
   <p class="note" style="margin-top:10px"><b style="color:var(--ivory)">קריאה:</b> ${hudRead(H)}.<br>VPIP = כמה ידיים שיחק מרצון לפני הפלופ. PFR = כמה מהן העלה. AF = הימורים חלקי קריאות אחרי הפלופ.</p><div class="row" style="margin-top:12px"><button class="btn grow" data-a="closemodal">סגור</button></div>`);}

const SIMS=[{k:'feel',n:_T('"מחקה את הדילר"'),c:'var(--bad)'},{k:'basic',n:_T('אסטרטגיה בסיסית'),c:'var(--brass-2)'},{k:'count',n:_T('ספירה + הימור משתנה'),c:'var(--good)'}];
let SIM={N:50000,h17:0,pay:'1.5',running:false,runs:null,done:0};
function simStart(){const rules={decks:6,h17:SIM.h17,bjpay:+SIM.pay,ls:1};const sv={st:BJ.st,shoe:BJ.shoe,cut:BJ.cut,decks:BJ.decks,rec:BJ.rec,streak:BJ.streak,chal:BJ.chal};
  SIM.runs=SIMS.map(x=>{bjCreate([{n:'sim',t:'sim',c:1e12}],10,rules);const r={k:x.k,st:BJ.st,shoe:BJ.shoe,cut:BJ.cut,units:0,wager:0,pts:[0],peak:0,dd:0,sq:0};return r;});
  Object.assign(BJ,{st:sv.st,shoe:sv.shoe,cut:sv.cut,decks:sv.decks,rec:sv.rec,streak:sv.streak,chal:sv.chal});
  SIM.done=0;SIM.running=true;render();setTimeout(simChunk,20);}
function simRound(k){const s=BJ.st,p=s.seats[0];if(s.phase!=='bet')bjNewRound();const tc=bjTC();
  const units=k==='count'?(tc>=5?8:tc>=4?6:tc>=3?4:tc>=2?2:1):1;p.bet=units*10;p.pp=0;p.t3=0;const before=p.c;bjDeal();let g=0;
  while(s.phase!=='done'&&g++<100){if(s.phase==='ins'){bjAct(0,k==='count'&&bjTC()>=3?'ins':'noins');continue;}
    if(s.phase==='play'){const hd=p.hands[s.th];const L=bjLegal(0);const up=bjVal(s.dl[0]);const u2=up===1?11:up;let a;
      if(k==='feel')a=bjTot(hd.cd).t<17?'hit':'stand';else{a=bsAction(hd.cd,u2,L,!!s.rules.h17);if(k==='count'){const dv=bjDeviation(hd.cd,u2,bjTC(),L,!!s.rules.h17);if(dv)a=dv.a;}}
      bjAct(0,a);continue;}
    if(s.phase==='dealer')bjDealerStep();}
  return {net:(p.c-before)/10,wag:units};}
function simChunk(){if(!SIM.running)return;if(CUR.v!=='bjsim'){SIM.running=false;return;}
  const sv={st:BJ.st,shoe:BJ.shoe,cut:BJ.cut,decks:BJ.decks,rec:BJ.rec,streak:BJ.streak,chal:BJ.chal};const step=Math.max(1,Math.floor(SIM.N/100));const M=Math.min(600,SIM.N-SIM.done);
  try{BJ.chal=null;SIM.runs.forEach(r=>{BJ.st=r.st;BJ.shoe=r.shoe;BJ.cut=r.cut;BJ.decks=6;for(let i=0;i<M;i++){const o=simRound(r.k);r.units+=o.net;r.wager+=o.wag;r.sq+=o.net*o.net;r.peak=Math.max(r.peak,r.units);r.dd=Math.max(r.dd,r.peak-r.units);if((SIM.done+i+1)%step===0)r.pts.push(r.units);}r.shoe=BJ.shoe;r.cut=BJ.cut;});}
  finally{Object.assign(BJ,sv);}
  SIM.done+=M;if(SIM.done>=SIM.N)SIM.running=false;render();if(SIM.running)setTimeout(simChunk,0);}
function simChart(){const R=SIM.runs;const all=R.flatMap(r=>r.pts);let mn=Math.min(0,...all),mx=Math.max(0,...all);if(mx-mn<10){mx+=5;mn-=5;}

   ${R.map((r,k)=>`<path d="${r.pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')}" fill="none" stroke="${SIMS[k].c}" stroke-width="2"/>`).join('')}
   <text x="${W-8}" y="${H-4}" fill="var(--muted)" font-size="9" text-anchor="end" font-family="IBM Plex Mono,monospace">${fmt(SIM.done)} ידיים</text></svg></div>
   <div class="legend">${SIMS.map(x=>`<span style="color:${x.c}">━ ${x.n}</span>`).join('')}</div>`;}
function rBjSim(V){let h=_L`<div class="tbar"><button class="btn ghost sm" data-a="acad">חזרה</button><h2>סימולטור אסטרטגיה</h2></div><div class="stack" style="margin-top:12px">

function b64e(str){const by=new TextEncoder().encode(str);let bin='';for(let i=0;i<by.length;i+=8192)bin+=String.fromCharCode.apply(null,by.subarray(i,i+8192));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64d(t){t=String(t).trim().replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const bin=atob(t);const by=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);return new TextDecoder().decode(by);}

function hashStr(x){let h=0;for(const ch of String(x))h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h);}

let BAL_SHOWN=null,BAL_MODE=null;
function animBal(){const el=$('#balv');if(!el)return;const target=bal();if(BAL_SHOWN===null||BAL_MODE!==S.practice){BAL_SHOWN=target;BAL_MODE=S.practice;el.textContent=fmt(target);return;}
  const from=BAL_SHOWN,diff=target-from;if(!diff)return;BAL_SHOWN=target;floatDelta(diff);
