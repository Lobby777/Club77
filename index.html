<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>קזינו 77</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* layout: one-column phone app — a felt table stage framed by a mahogany rail, brass controls docked under it, solver drawer below */
:root{
  --night:#081b16; --felt:#0f3a2d; --felt-2:#17523f; --rail:#2c170f; --rail-2:#4a2717;
  --brass:#cf9f42; --brass-2:#f1cf80; --ivory:#f3ebd7; --muted:#9fb3a4; --line:#1f3d33; --line-2:#3a5e50;
  --panel:#0d2820; --panel-2:#123429; --card:#fbf7ec; --ink:#1b1a17; --suit-red:#c1272d; --back:#7d201c; --back-2:#93302a;
  --good:#63d38f; --bad:#ff806f; --warn:#f3c453; --info:#7fc3ff; --chip-red:#c4403a; --chip-blue:#2f6cae; --chip-blk:#26262b; --chip-grn:#2c8a5a; --chip-pur:#6a3fa0;
  --f-display:"Frank Ruhl Libre","David","Times New Roman",serif;
  --f-body:"Rubik","Arial Hebrew",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--night);color:var(--ivory);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
#app{min-height:100%;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button{font-family:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--night);border-bottom:1px solid var(--line)}
.brand{font:900 22px/1 var(--f-display);color:var(--brass-2);letter-spacing:.5px;background:none;border:0;padding:0;cursor:pointer}
.brand small{font:500 11px var(--f-body);color:var(--muted);display:block;letter-spacing:1px;margin-top:2px}
.spacer{flex:1}
.bal{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:999px;padding:5px 12px 5px 8px;font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.bal .dot{width:16px;height:16px;border-radius:50%;background:var(--chip-red);box-shadow:inset 0 0 0 3px var(--chip-red),inset 0 0 0 5px var(--ivory)}
.tag{font:600 11px var(--f-body);padding:2px 8px;border-radius:999px;background:var(--warn);color:#2b2000;letter-spacing:.3px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--ivory);font-size:18px;cursor:pointer}
.btn{appearance:none;border:0;border-radius:10px;padding:9px 14px;font:600 15px var(--f-body);background:linear-gradient(180deg,var(--brass-2),var(--brass));color:#2a1b06;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.ghost{background:transparent;color:var(--ivory);border:1px solid var(--line-2)}
.btn.dark{background:var(--panel-2);color:var(--ivory);border:1px solid var(--line-2)}
.btn.fold{background:#5b1f1b;color:var(--ivory)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn.wide{width:100%}
.btn.rec{box-shadow:0 0 0 2px var(--good),0 0 14px rgba(99,211,143,.45)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:focus-visible,.iconbtn:focus-visible,.tile:focus-visible{outline:2px solid var(--brass-2);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:24px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
/* hero + lobby */
.hero{margin-top:14px;border-radius:22px;padding:26px 20px 22px;background:radial-gradient(130% 120% at 85% 0%,var(--felt-2),var(--felt) 55%,var(--night));border:1px solid var(--line-2);position:relative;overflow:hidden}
.hero::after{content:"♠ ♥ ♦ ♣";position:absolute;left:-10px;bottom:-26px;font:900 90px/1 var(--f-display);color:rgba(241,207,128,.07);letter-spacing:-6px;white-space:nowrap}
.eyebrow{font:500 12px var(--f-body);letter-spacing:2px;color:var(--brass);text-transform:uppercase}
.hero h1{font-size:54px;font-weight:900;line-height:1;color:var(--ivory);margin-top:6px}
.hero h1 span{color:var(--brass-2)}
.lede{color:var(--muted);margin-top:10px;max-width:40ch}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:6px;text-align:right;padding:14px;border-radius:16px;border:1px solid var(--line-2);background:linear-gradient(160deg,var(--panel-2),var(--panel));color:var(--ivory);cursor:pointer;min-height:132px}
.tile .glyph{font:900 30px/1 var(--f-display);color:var(--brass-2);direction:ltr;text-align:right;height:38px;display:flex;align-items:center;justify-content:flex-end;gap:2px}
.tile .glyph .r{color:var(--bad)}
.tile b{font:700 17px var(--f-display)}
.tile small{color:var(--muted);font-size:12.5px;line-height:1.35}
.links{display:grid;gap:8px;margin-top:14px}
.linkrow{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--ivory);text-align:right;cursor:pointer;width:100%}
.linkrow .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--rail-2);font:700 18px var(--f-display);color:var(--brass-2);flex:none}
.linkrow b{display:block;font:700 16px var(--f-display)}
.linkrow small{color:var(--muted)}
/* setup */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--ivory);font:500 14px var(--f-body);cursor:pointer}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.lvlb{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font:900 20px var(--f-display);background:var(--brass);color:#2a1b06;box-shadow:inset 0 0 0 3px var(--brass-2)}
.a-Rs,.a-Rp{background:#e8e2d0;color:#1b1a17}
.bigcard .card{--cw:96px}
.seg button.on{background:var(--brass);color:#2a1b06;border-color:var(--brass);font-weight:700}
label.lbl{font:600 13px var(--f-body);color:var(--brass-2);letter-spacing:.3px}
input.txt{width:100%;min-height:42px;border-radius:10px;border:1px solid var(--line-2);background:var(--night);color:var(--ivory);padding:8px 12px;font:15px var(--f-body)}
.hint{font-size:13px;color:var(--muted)}
/* cards */
.card{--cw:44px;width:var(--cw);height:calc(var(--cw)*1.42);flex:none;background:var(--card);color:var(--ink);border-radius:calc(var(--cw)*.12);display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:calc(var(--cw)*.06) calc(var(--cw)*.1);box-shadow:0 2px 5px rgba(0,0,0,.45);direction:ltr;position:relative;user-select:none}
.card b{font:600 calc(var(--cw)*.4)/1 var(--f-mono)}
.card i{font-style:normal;font-size:calc(var(--cw)*.55);line-height:1;align-self:center;margin-bottom:calc(var(--cw)*.08)}
.card.red{color:var(--suit-red)}
.card.back{background:repeating-linear-gradient(45deg,var(--back) 0 4px,var(--back-2) 4px 8px);border:2px solid var(--card)}
.card.deal{animation:deal .32s ease-out both}
.card.sel{transform:translateY(-12px);box-shadow:0 0 0 3px var(--warn),0 6px 10px rgba(0,0,0,.5)}
.card.dim{filter:brightness(.55)}
.card.win{box-shadow:0 0 0 2px var(--brass-2),0 0 12px rgba(241,207,128,.6)}
@keyframes deal{from{opacity:0;transform:translateY(-18px) rotate(-6deg) scale(.9)}to{opacity:1;transform:none}}
.cards{display:flex;gap:4px;direction:ltr;justify-content:center;flex-wrap:nowrap}
.cards.ov .card+.card{margin-left:calc(var(--cw)*-.45)}
.cn{font-family:var(--f-mono);font-weight:600;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.cn.red{color:#ff8b80}
/* table */
.felt{background:radial-gradient(120% 85% at 50% 35%,var(--felt-2),var(--felt) 62%,#0a2a20);border:7px solid var(--rail);border-radius:26px;box-shadow:inset 0 0 0 2px var(--rail-2),inset 0 0 40px rgba(0,0,0,.45);padding:12px 8px;margin-top:12px}
.tbar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.tbar h2{font-size:20px}
.pill{font:600 12px var(--f-body);padding:3px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pill.gold{color:var(--brass-2);border-color:var(--brass)}
.opps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seat{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-width:0}
.seat .nm{font:600 12.5px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seat .ch{font:600 12px var(--f-mono);color:var(--brass-2)}
.seat .la{font-size:11.5px;color:var(--muted);min-height:16px;text-align:center}
.seat.turn{border-color:var(--brass-2);box-shadow:0 0 0 1px var(--brass-2),0 0 16px rgba(241,207,128,.25)}
.seat.folded{opacity:.45}
.seat .cards .card{--cw:26px}
.dbtn{position:absolute;top:-6px;left:-4px;width:22px;height:22px;border-radius:50%;background:var(--ivory);color:var(--ink);font:700 11px var(--f-mono);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.betchip{font:600 11.5px var(--f-mono);background:var(--chip-blue);color:#fff;border-radius:999px;padding:1px 8px;border:1px dashed rgba(255,255,255,.6)}
.board{display:flex;justify-content:center;gap:5px;direction:ltr;margin:14px 0 6px}
.board .card{--cw:46px}
.board .slot{width:46px;height:65px;border-radius:6px;border:1px dashed rgba(255,255,255,.18)}
.potline{text-align:center;font:600 15px var(--f-mono);color:var(--brass-2)}
.potline small{display:block;font:500 12px var(--f-body);color:var(--muted)}
.mine{margin-top:10px;border-top:1px dashed rgba(255,255,255,.12);padding-top:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mine .cards .card{--cw:56px}
.mine.v-omaha .cards .card,.mine.v-draw .cards .card{--cw:50px}
.mine .who{display:flex;gap:10px;align-items:center;font-size:14px}
.resline{text-align:center;font:600 14px var(--f-body);color:var(--brass-2);min-height:20px;margin-top:4px}
/* action bar */
.actions{position:sticky;bottom:0;z-index:4;background:linear-gradient(180deg,rgba(8,27,22,0),var(--night) 18%);padding-top:14px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));margin-top:6px}
.actions .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.actions .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.actions .grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.actions .who{font-size:13px;color:var(--muted);margin-bottom:6px;text-align:center}
.raise{display:flex;flex-direction:column;gap:6px;margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.raise input[type=range]{width:100%;accent-color:var(--brass)}
/* solver */
.solver{margin-top:12px;border:1px solid var(--line-2);border-radius:16px;background:linear-gradient(180deg,var(--panel-2),var(--panel));overflow:hidden}
.solver>header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.solver>header b{font:700 16px var(--f-display);color:var(--brass-2)}
.solver .body{padding:12px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:rgba(0,0,0,.22);border-radius:10px;padding:8px}
.kv small{display:block;font-size:11.5px;color:var(--muted)}
.kv b{font:600 17px var(--f-mono);font-variant-numeric:tabular-nums}
.recbox{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(99,211,143,.08);border:1px solid rgba(99,211,143,.35)}
.recbox .big{font:700 19px var(--f-display);color:var(--good)}
.recbox.bad{background:rgba(255,128,111,.08);border-color:rgba(255,128,111,.35)}
.recbox.bad .big{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:12.5px}
.bar .tr{height:10px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.bar .fl{height:100%;background:var(--brass);border-radius:6px}
.bar .fl.g{background:var(--good)}.bar .fl.r{background:var(--bad)}
.bar span:last-child{font-family:var(--f-mono);text-align:left;direction:ltr}
.eqbar{height:16px;border-radius:8px;background:rgba(255,128,111,.35);overflow:hidden;display:flex;direction:ltr}
.eqbar i{display:block;height:100%}
.note{font-size:13px;color:var(--muted);line-height:1.55}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.t td.n{font-family:var(--f-mono);direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
table.t tr.best td{color:var(--good);font-weight:600}
.scroll{overflow-x:auto}
/* blackjack */
.dealer{display:flex;flex-direction:column;align-items:center;gap:6px}
.dealer .cards .card{--cw:50px}
.lbl2{font:600 12px var(--f-body);letter-spacing:1.5px;color:var(--brass);}
.arc{text-align:center;font:700 12px var(--f-display);color:rgba(241,207,128,.55);letter-spacing:1px;margin:8px 0}
.bjseats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bjseat{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.bjseat.turn{border-color:var(--brass-2);box-shadow:0 0 0 1px var(--brass-2)}
.bjseat.picked{outline:2px dashed var(--warn);outline-offset:2px}
.bjseat .hd{display:flex;justify-content:space-between;gap:6px;font-size:13px}
.bjhand{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;border-radius:10px}
.bjhand.act{background:rgba(241,207,128,.1)}
.bjhand .cards .card{--cw:38px}
.tot{font:600 13px var(--f-mono);background:rgba(0,0,0,.4);padding:1px 8px;border-radius:999px}
.res{font:700 12px var(--f-body);padding:1px 8px;border-radius:999px}
.res.win,.res.bj{background:var(--good);color:#06240f}.res.lose,.res.bust{background:var(--bad);color:#2b0703}.res.push,.res.surr{background:var(--muted);color:#0b1a14}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{width:48px;height:48px;border-radius:50%;border:0;color:#fff;font:700 12px var(--f-mono);cursor:pointer;box-shadow:inset 0 0 0 4px rgba(255,255,255,.85),inset 0 0 0 7px currentColor;position:relative}
.chip::after{content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.55)}
.chip.on{transform:translateY(-4px);box-shadow:inset 0 0 0 4px var(--brass-2),inset 0 0 0 7px currentColor,0 6px 12px rgba(0,0,0,.5)}
.c5{background:var(--chip-grn)}.c10{background:var(--chip-blue)}.c25{background:var(--chip-grn)}.c50{background:var(--chip-blue)}.c100{background:var(--chip-blk)}.c500{background:var(--chip-pur)}.c1000{background:var(--chip-red)}
/* roulette */
.wheelwrap{display:flex;justify-content:center;position:relative;margin-top:4px}
.wheelwrap canvas{width:min(250px,70vw);height:auto;aspect-ratio:1;max-width:100%}
.ptr{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:16px solid var(--brass-2);filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.rlres{text-align:center;margin-top:6px;min-height:26px;font:700 18px var(--f-display)}
.hist{display:flex;gap:4px;overflow-x:auto;direction:ltr;padding:4px 0}
.hn{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font:600 12px var(--f-mono);color:#fff}
.hn.r{background:var(--suit-red)}.hn.b{background:var(--chip-blk)}.hn.g{background:var(--chip-grn)}
.rlboard{display:grid;grid-template-columns:1fr 1fr 1.25fr 1.25fr 1.25fr;gap:3px;direction:ltr;margin-top:10px;user-select:none}
.rc{min-height:31px;border-radius:5px;display:flex;align-items:center;justify-content:center;font:600 13px var(--f-mono);color:#fff;border:1px solid rgba(255,255,255,.18);cursor:pointer;position:relative;background:transparent;padding:0}
.rc.r{background:var(--suit-red)}.rc.b{background:var(--chip-blk)}.rc.g{background:var(--chip-grn)}
.rc.o{background:rgba(0,0,0,.25);font:600 12px var(--f-body)}
.rc.hit{box-shadow:0 0 0 2px var(--brass-2),0 0 10px var(--brass-2)}
.rc .bc{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;padding:0 4px;border-radius:999px;background:var(--brass-2);color:#2a1b06;font:700 10px var(--f-mono);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.6);z-index:1}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ptabs button{flex:none}
/* video poker */
.paytab{width:100%;border-collapse:collapse;font-size:12.5px;direction:rtl}
.paytab td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.06)}
.paytab td.n{font-family:var(--f-mono);text-align:left;direction:ltr}
.paytab td.on{color:var(--brass-2);font-weight:700}
.paytab tr.hit td{background:rgba(241,207,128,.18);color:var(--brass-2)}
.vpcards{display:flex;gap:6px;justify-content:center;direction:ltr;margin-top:14px}
.vpcards .slotc{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer}
.vpcards .card{--cw:min(17vw,62px)}
.held{font:700 11px var(--f-body);letter-spacing:1px;color:var(--warn);min-height:16px}
/* academy */
.lesson{line-height:1.7}
.lesson h3{margin-top:8px;color:var(--brass-2)}
.lesson ul{margin:4px 0;padding-inline-start:20px}
.lesson li{margin:3px 0}
.lesson p{max-width:65ch}
.chart{border-collapse:collapse;font:600 11.5px var(--f-mono);direction:ltr;margin:6px 0}
.chart th,.chart td{width:26px;height:24px;text-align:center;border:1px solid var(--night)}
.chart th{color:var(--muted);font-weight:500}
.a-H{background:#a33a32;color:#fff}.a-S{background:#d6b445;color:#231a00}.a-D,.a-Ds{background:#2f7d57;color:#fff}.a-P{background:#3765a8;color:#fff}.a-Rh{background:#e8e2d0;color:#1b1a17}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.legend span{padding:2px 8px;border-radius:6px}
.drill{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.score{display:flex;gap:14px;justify-content:center;font:600 14px var(--f-mono)}
/* modal & toast */

<script>
'use strict';
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Math.round(n);return (n<0?'−':'')+Math.abs(n).toLocaleString('en-US');};
const sgn=n=>(Math.round(n)>0?'+':'')+fmt(n);
const pct=(x,d=1)=>(x*100).toFixed(d)+'%';
const RNGBUF=new Uint32Array(256);let RNGI=256;
function rnd32(){if(RNGI>=256){try{crypto.getRandomValues(RNGBUF);}catch(e){for(let i=0;i<256;i++)RNGBUF[i]=Math.floor(Math.random()*4294967296);}RNGI=0;}return RNGBUF[RNGI++];}
/* unbiased integer in [0,n) — crypto source + rejection sampling, so no card or number is favored */
const rnd=n=>{const lim=4294967296-(4294967296%n);let x;do{x=rnd32();}while(x>=lim);return x%n;};
const pick=a=>a[rnd(a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toast(msg,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.innerHTML=msg;$('#toast').appendChild(t);setTimeout(()=>t.remove(),kind==='bad'?4200:2600);}

/* ================= storage & wallet ================= */
const SKEY='casino77-v1';
const DEF={chips:10000,pchips:10000,practice:false,solver:false,coach:false,stats:{},bonusAt:0,nick:'',ach:{},hist:[],sound:true,xp:0,daily:null,bk:[],luck:0,cert:{}};
let S=(()=>{try{const v=JSON.parse(localStorage.getItem(SKEY)||'null');return Object.assign(JSON.parse(JSON.stringify(DEF)),v||{});}catch(e){return JSON.parse(JSON.stringify(DEF));}})();
function save(){S.savedAt=Date.now();try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}try{cloudQueue();}catch(e){}}
if(!S.v2){S.solver=false;S.coach=false;S.v2=1;save();}
const bal=()=>S.practice?S.pchips:S.chips;
function addBal(d){if(S.practice)S.pchips+=d;else S.chips+=d;save();updTop();}
function stat(g){return S.stats[g]||(S.stats[g]={hands:0,net:0,dec:0,good:0,best:0,worst:0});}
function recHand(g,net,exp){const s=stat(g);s.hands++;s.net+=net;s.best=Math.max(s.best,net);s.worst=Math.min(s.worst,net);save();if(net>0){unlock('first_win');snd('win');}addXP(1);
  if(!S.practice){if(!S.bk)S.bk=[];if(!S.bk.length)S.bk.push([Date.now(),S.chips-net,Math.round(S.luck||0)]);S.luck=(S.luck||0)+(exp===undefined?0:net-exp);S.bk.push([Date.now(),S.chips,Math.round(S.luck)]);if(S.bk.length>400)S.bk=S.bk.filter((x,i)=>i>=200||i%2===0);save();}
  checkGeneral();}
function recDec(g,ok){const s=stat(g);s.dec++;if(ok){s.good++;addXP(1);}save();checkGeneral();}
function updTop(){const b=$('#balv');if(b)b.textContent=fmt(bal());const t=$('#ptag');if(t)t.hidden=!S.practice;const sb=$('#sndbtn');if(sb){sb.textContent=S.sound?'♪':'×';sb.setAttribute('aria-pressed',String(!!S.sound));sb.setAttribute('aria-label',S.sound?'השתק צלילים':'הפעל צלילים');}}

/* ================= cards ================= */
const SUITSYM=['♠','♥','♦','♣'];
const RCH=r=>r===14?'A':r===13?'K':r===12?'Q':r===11?'J':String(r);
const rk=c=>(c>>2)+2;
const isRed=c=>(c&3)===1||(c&3)===2;
const SEEN=new Set();
function cardHTML(c,cls='',key=null){
  if(key!==null){const k=key+':'+c;if(!SEEN.has(k)){SEEN.add(k);cls+=' deal';sndCard();if(SEEN.size>3000)SEEN.clear();}}
  if(c==null||c<0)return `<div class="card back ${cls}"></div>`;
  const R=RCH(rk(c));return `<div class="card ${isRed(c)?'red':''} ${cls}" aria-label="${R}${SUITSYM[c&3]}"><b>${R}</b><i>${SUITSYM[c&3]}</i></div>`;
}
const cname=c=>c<0?'?':`<span class="cn ${isRed(c)?'red':''}">${RCH(rk(c))}${SUITSYM[c&3]}</span>`;
function newDeck(n=1){const d=[];for(let k=0;k<n;k++)for(let c=0;c<52;c++)d.push(c);return shuffle(d);}

/* ================= hand evaluator ================= */
const RC=new Int8Array(15),SC=new Int8Array(4),SM=new Int32Array(4);
const B5=759375;
function score(cat,a,b,c,d,e){return ((((cat*15+(a||0))*15+(b||0))*15+(c||0))*15+(d||0))*15+(e||0);}
function straightHi(m){if(m&(1<<14))m|=2;for(let h=14;h>=5;h--){if(((m>>(h-4))&31)===31)return h;}return 0;}
function evalHand(cards,n){
  RC.fill(0);SC.fill(0);SM.fill(0);let mask=0;
  for(let i=0;i<n;i++){const c=cards[i],r=(c>>2)+2,s=c&3;RC[r]++;SC[s]++;SM[s]|=1<<r;mask|=1<<r;}
  for(let s=0;s<4;s++)if(SC[s]>=5){const sf=straightHi(SM[s]);if(sf)return score(8,sf);const k=[];for(let r=14;r>=2&&k.length<5;r--)if(SM[s]&(1<<r))k.push(r);return score(5,k[0],k[1],k[2],k[3],k[4]);}
  let quad=0,t1=0,t2=0,p1=0,p2=0,p3=0;
  for(let r=14;r>=2;r--){const k=RC[r];if(k===4)quad=r;else if(k===3){if(!t1)t1=r;else if(!t2)t2=r;}else if(k===2){if(!p1)p1=r;else if(!p2)p2=r;else if(!p3)p3=r;}}
  if(quad){let kk=0;for(let r=14;r>=2;r--)if(r!==quad&&RC[r]){kk=r;break;}return score(7,quad,kk);}
  if(t1&&(t2||p1))return score(6,t1,Math.max(t2,p1));
  const sh=straightHi(mask);if(sh)return score(4,sh);
  if(t1){const k=[];for(let r=14;r>=2&&k.length<2;r--)if(RC[r]&&r!==t1)k.push(r);return score(3,t1,k[0],k[1]);}
  if(p1&&p2){let kk=0;for(let r=14;r>=2;r--)if(RC[r]&&r!==p1&&r!==p2){kk=r;break;}return score(2,p1,p2,kk);}
  if(p1){const k=[];for(let r=14;r>=2&&k.length<3;r--)if(RC[r]===1)k.push(r);return score(1,p1,k[0],k[1],k[2]);}
  const k=[];for(let r=14;r>=2&&k.length<5;r--)if(RC[r])k.push(r);return score(0,k[0],k[1],k[2],k[3],k[4]);
}
const T5=[0,0,0,0,0];
function bestOmaha(h,b){let best=-1;const n=h.length,m=b.length;if(m<3)return -1;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)for(let x=0;x<m;x++)for(let y=x+1;y<m;y++)for(let z=y+1;z<m;z++){T5[0]=h[i];T5[1]=h[j];T5[2]=b[x];T5[3]=b[y];T5[4]=b[z];const s=evalHand(T5,5);if(s>best)best=s;}
  return best;}
function handScore(v,hole,board){if(v==='omaha')return bestOmaha(hole,board);if(v==='draw')return evalHand(hole,5);const a=hole.concat(board);return evalHand(a,a.length);}
const CATS=['קלף גבוה','זוג','שני זוגות','שלישייה','רצף','צבע','פול האוס','רביעייה','רצף צבע'];
const catOf=v=>Math.floor(v/B5);
const kick=(v,i)=>Math.floor(v/Math.pow(15,4-i))%15;
function handName(v){if(v<0)return '—';const c=catOf(v),a=RCH(kick(v,0)),b=RCH(kick(v,1));
  switch(c){case 0:return 'קלף גבוה '+a;case 1:return 'זוג '+a;case 2:return `שני זוגות ${a} ו-${b}`;case 3:return 'שלישיית '+a;case 4:return 'רצף עד '+a;case 5:return 'צבע, '+a+' גבוה';case 6:return `פול האוס ${a} על ${b}`;case 7:return 'רביעיית '+a;default:return kick(v,0)===14?'רויאל פלאש':'רצף צבע עד '+a;}}

/* Monte Carlo equity (hold'em / omaha) */
function mcEquity(v,hole,board,nOpp,iters,ranges){
  const used=new Uint8Array(52);hole.forEach(c=>used[c]=1);board.forEach(c=>used[c]=1);
  const d=[];for(let c=0;c<52;c++)if(!used[c])d.push(c);
  const hn=v==='omaha'?4:2,need=5-board.length,L=d.length;const fb=board.slice();const oh=new Array(hn);
  let win=0,tie=0,eq=0;const cats=new Float64Array(9);
  for(let it=0;it<iters;it++){
    let k=0;
    fb.length=board.length;
    for(let i=0;i<need;i++){const j=k+Math.floor(Math.random()*(L-k));const t=d[k];d[k]=d[j];d[j]=t;fb.push(d[k++]);}
    const my=handScore(v,hole,fb);cats[catOf(my)]++;
    let lost=false,ties=0;
    for(let o=0;o<nOpp&&!lost;o++){const rg=ranges&&ranges[o];let tries=0;
      for(;;){for(let i=0;i<hn;i++){const j=k+Math.floor(Math.random()*(L-k));const t=d[k];d[k]=d[j];d[j]=t;oh[i]=d[k++];}
        if(!rg||tries>=25||acceptOpp(v,oh,board,rg))break;k-=hn;tries++;}
      const s=handScore(v,oh,fb);if(s>my)lost=true;else if(s===my)ties++;}
    if(!lost){if(ties){tie++;eq+=1/(ties+1);}else{win++;eq+=1;}}
  }
  return {win:win/iters,tie:tie/iters,eq:eq/iters,cats:Array.from(cats,x=>x/iters)};
}
/* five-card draw: bot discard heuristic (max 3) */
function botDraw(h){
  const v=evalHand(h,5),c=catOf(v);if(c>=4)return [];
  const r=h.map(rk),cnt={};r.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  if(c>=1)return [0,1,2,3,4].filter(i=>cnt[r[i]]===1).sort((a,b)=>r[a]-r[b]).slice(0,3);
  const sc=[0,0,0,0];h.forEach(x=>sc[x&3]++);const fs=sc.indexOf(4);if(fs>=0)return [0,1,2,3,4].filter(i=>(h[i]&3)!==fs);
  const u=r.slice().sort((a,b)=>a-b);
  for(const drop of [0,4]){const rest=u.filter((x,k)=>k!==drop);if(rest[3]-rest[0]===3&&rest[3]<14)return [r.indexOf(u[drop])];}
  return [0,1,2,3,4].sort((a,b)=>r[b]-r[a]).slice(2);
}
function eqDraw(hand,disc,nOpp,iters){
  const used=new Uint8Array(52);hand.forEach(c=>used[c]=1);const d=[];for(let c=0;c<52;c++)if(!used[c])d.push(c);const L=d.length;
  let eq=0,imp=0;const cats=new Float64Array(9);const base=catOf(evalHand(hand,5));const my=[0,0,0,0,0],oh=[0,0,0,0,0];
  for(let it=0;it<iters;it++){
    let k=0;const take=()=>{const j=k+Math.floor(Math.random()*(L-k));const t=d[k];d[k]=d[j];d[j]=t;return d[k++];};
    for(let i=0;i<5;i++)my[i]=hand[i];for(const i of disc)my[i]=take();
    const ms=evalHand(my,5),mc=catOf(ms);cats[mc]++;if(mc>base)imp++;
    let lost=false,ties=0;
    for(let o=0;o<nOpp&&!lost;o++){for(let i=0;i<5;i++)oh[i]=take();for(const i of botDraw(oh))oh[i]=take();const s=evalHand(oh,5);if(s>ms)lost=true;else if(s===ms)ties++;}
    if(!lost)eq+=ties?1/(ties+1):1;
  }
  return {eq:eq/iters,imp:imp/iters,cats:Array.from(cats,x=>x/iters)};
}
function drawOptions(hand,nOpp){
  const opts=[];
  for(let m=0;m<32;m++){const disc=[];for(let i=0;i<5;i++)if(m&(1<<i))disc.push(i);if(disc.length>3)continue;
    const e=eqDraw(hand,disc,nOpp,disc.length?220:300);opts.push({m,disc,...e});}
  opts.sort((a,b)=>b.eq-a.eq);return opts;
}

/* ================= blackjack math ================= */
const bjVal=c=>{const r=rk(c);return r===14?1:r>=10?10:r;};
function bjTot(cd){let t=0,a=false;for(const c of cd){const v=bjVal(c);t+=v;if(v===1)a=true;}const soft=a&&t+10<=21;return {t:soft?t+10:t,hard:t,soft};}
const hiLo=c=>{const v=bjVal(c);return v>=2&&v<=6?1:(v===10||v===1)?-1:0;};
function dealerDist(up,p,h17){
  const memo=new Map();
  function rec(t,soft){const tot=soft&&t+10<=21?t+10:t;
    if(tot>=17&&!(h17&&soft&&t+10===17)){const r=[0,0,0,0,0,0];if(tot>21)r[5]=1;else r[tot-17]=1;return r;}
    const key=t*2+(soft?1:0);if(memo.has(key))return memo.get(key);
    const r=[0,0,0,0,0,0];for(let c=1;c<=10;c++){if(!p[c])continue;const s=rec(t+c,soft||c===1);for(let k=0;k<6;k++)r[k]+=p[c]*s[k];}
    memo.set(key,r);return r;}
  const r=[0,0,0,0,0,0];let norm=0;
  const skip=c=>(up===1&&c===10)||(up===10&&c===1);
  for(let c=1;c<=10;c++)if(!skip(c))norm+=p[c];
  for(let c=1;c<=10;c++){if(skip(c)||!p[c])continue;const s=rec(up+c,up===1||c===1);for(let k=0;k<6;k++)r[k]+=p[c]/norm*s[k];}
  return r;
}
function standEV(tot,D){if(tot>21)return -1;let ev=D[5];for(let k=0;k<5;k++){const dt=17+k;if(tot>dt)ev+=D[k];else if(tot<dt)ev-=D[k];}return ev;}
function bjEVs(cd,D,p,L){
  const memo=new Map();
  const totOf=(t,s)=>s&&t+10<=21?t+10:t;
  function best(t,s){const tot=totOf(t,s);if(tot>21)return -1;return Math.max(standEV(tot,D),hitEV(t,s));}
  function hitEV(t,s){const key=t*2+(s?1:0);if(memo.has(key))return memo.get(key);let ev=0;for(let c=1;c<=10;c++){if(!p[c])continue;const nt=t+c,ns=s||c===1;ev+=p[c]*(totOf(nt,ns)>21?-1:best(nt,ns));}memo.set(key,ev);return ev;}
  function dblEV(t,s){let ev=0;for(let c=1;c<=10;c++){if(!p[c])continue;ev+=p[c]*standEV(totOf(t+c,s||c===1),D);}return 2*ev;}
  let t=0,s=false;cd.forEach(c=>{const v=bjVal(c);t+=v;if(v===1)s=true;});
  const R={stand:standEV(totOf(t,s),D),hit:hitEV(t,s)};
  if(L.dbl)R.double=dblEV(t,s);

/* basic strategy: 6 decks, dealer stands soft 17, double after split, late surrender */
function bsRaw(cd,up,allowPair=true,h17=false){
  const v=cd.map(bjVal);const T=bjTot(cd);
  if(allowPair&&cd.length===2&&v[0]===v[1]){const pv=v[0];
    if(pv===8&&up===11&&h17)return 'Rp';if(pv===1||pv===8)return 'P';if(pv===10)return 'S';
    if(pv===9)return [7,10,11].includes(up)?'S':'P';
    if(pv===7)return up<=7?'P':'H';if(pv===6)return up<=6?'P':'H';
    if(pv===4)return up===5||up===6?'P':'H';
    if(pv===2||pv===3)return up<=7?'P':'H';}
  if(T.soft){const t=T.t;
    if(t>=20)return 'S';if(t===19)return h17&&up===6?'Ds':'S';
    if(t===18)return (up>=3&&up<=6)||(h17&&up===2)?'Ds':(up===2||up===7||up===8)?'S':'H';
    if(t===17)return up>=3&&up<=6?'D':'H';
    if(t===15||t===16)return up>=4&&up<=6?'D':'H';
    return up>=5&&up<=6?'D':'H';}
  const t=T.t;
  if(t>=18)return 'S';if(t===17)return h17&&up===11?'Rs':'S';
  if(t===16)return up<=6?'S':up>=9?'Rh':'H';
  if(t===15)return up<=6?'S':(up===10||(h17&&up===11))?'Rh':'H';
  if(t>=13)return up<=6?'S':'H';
  if(t===12)return up>=4&&up<=6?'S':'H';
  if(t===11)return up===11&&!h17?'H':'D';
  if(t===10)return up<=9?'D':'H';
  if(t===9)return up>=3&&up<=6?'D':'H';
  return 'H';
}
function bsAction(cd,up,L,h17){let a=bsRaw(cd,up,!!L.split,h17);
  if(a==='Rp')a=L.surr?'Rp':'P';if(a==='Rp')return 'surr';
  if(a==='P'&&!L.split)a=bsRaw(cd,up,false,h17);
  if(a==='Rs')return L.surr?'surr':'stand';
  if(a==='D')return L.dbl?'double':'hit';if(a==='Ds')return L.dbl?'double':'stand';
  if(a==='Rh')return L.surr?'surr':'hit';
  return {H:'hit',S:'stand',P:'split'}[a];}

const BJ={st:null,shoe:[],decks:6,cut:78,timer:null,betSeat:-1,chip:0,solveKey:'',solve:null};
function bjCreate(seats,min,rules){BJ.chal=null;const RU=rules||{decks:6,h17:0,bjpay:1.5,ls:1};BJ.decks=RU.decks;BJ.st={g:'bj',rules:RU,min,max:min*100,round:0,phase:'bet',ts:-1,th:-1,dl:[],hid:true,rc:0,left:0,counts:null,msg:'',
  seats:seats.map(x=>({n:x.n,t:x.t,c:x.t==='me'?bal():x.c,sty:x.sty||null,peer:x.peer||null,bet:0,last:x.t==='bot'?0:min,hands:[],ins:0,insd:true,net:0,ready:false,pp:0,t3:0,rpp:0,rt3:0,side:[],sideNet:0}))};BJ.target='main';
  BJ.st.seats.forEach(p=>{if(p.t!=='bot')p.bet=Math.min(min,chipsOf(p));});
  BJ.chip=min;BJ.betSeat=BJ.st.seats.findIndex(p=>isHere(p));bjShuffle();}
function bjShuffle(){BJ.shoe=newDeck(BJ.decks);BJ.cut=Math.floor(52*BJ.decks*.25);BJ.st.rc=0;BJ.st.msg='הנעל עורבבה מחדש';}
function bjDraw(counted=true){if(!BJ.shoe.length)bjShuffle();const c=BJ.shoe.pop();if(counted)BJ.st.rc+=hiLo(c);return c;}
function bjUpdCounts(){const s=BJ.st;const cnt=new Array(11).fill(0);BJ.shoe.forEach(c=>cnt[bjVal(c)]++);if(s.hid&&s.dl.length>1)cnt[bjVal(s.dl[1])]++;s.counts=cnt;s.left=cnt.reduce((a,b)=>a+b,0);}
const bjTC=()=>{const s=BJ.st;return s.left?s.rc/(s.left/52):0;};
const chipsOf=p=>p.t==='me'?bal():p.c;
function seatPay(p,d){if(p.t==='me'){addBal(d);p.c=bal();}else p.c+=d;}
function botBjBet(p){const s=BJ.st;if(p.c<s.min){p.c=s.min*100;}
  if(p.sty==='count'){const tc=bjTC();return Math.min(p.c,tc>=2?s.min*Math.min(8,Math.floor(tc)*2):s.min);}
  if(p.sty==='wild')return Math.min(p.c,s.min*pick([1,2,3,5]));return s.min;}
function bjLegal(i){const s=BJ.st,p=s.seats[i];const hd=p&&p.hands[s.th];if(!hd||hd.done)return {};
  const two=hd.cd.length===2,ch=chipsOf(p);
  return {dbl:two&&ch>=hd.b,split:two&&bjVal(hd.cd[0])===bjVal(hd.cd[1])&&p.hands.length<4&&!(hd.sp&&bjVal(hd.cd[0])===1)&&ch>=hd.b,surr:two&&p.hands.length===1&&!hd.sp&&!!s.rules.ls};}
function bjDeal(){const s=BJ.st;if(s.phase!=='bet')return;
  s.seats.forEach(p=>{if(p.t==='bot'){p.bet=botBjBet(p);p.pp=p.sty==='wild'&&Math.random()<.4?s.min:0;p.t3=p.sty==='wild'&&Math.random()<.3?s.min:0;}p.bet=Math.min(p.bet,chipsOf(p));if(p.bet>0&&p.bet<s.min)p.bet=chipsOf(p)>=s.min?s.min:0;
    p.rpp=p.bet>0?p.pp:0;p.rt3=p.bet>0?p.t3:0;if(p.bet+p.rpp+p.rt3>chipsOf(p)){p.rpp=0;p.rt3=0;}});
  const meS=s.seats.find(p=>p.t==='me');if(meS&&meS.bet>=4*s.min&&bjTC()>=2)unlock('tc_bet');BJ.rec={dec:[]};
  if(BJ.chal){const C=BJ.chal;if(C.round>=CH_ROUNDS)return;s.seats[0].bet=10;s.seats[0].rpp=0;s.seats[0].rt3=0;BJ.shoe=seededDeck(6,C.seed*1000+C.round);s.rc=0;C.round++;s.msg=`אתגר ${C.code} · יד ${C.round}/${CH_ROUNDS}`;}
  if(!s.seats.some(p=>p.bet>0)){toast('אף אחד לא הימר');return;}
  if(BJ.chal){}else if(BJ.shoe.length<BJ.cut)bjShuffle();else s.msg='';
  s.round++;s.dl=[];s.hid=true;
  s.seats.forEach(p=>{p.hands=[];p.ins=0;p.insd=true;p.net=0;p.ready=false;p.side=[];p.sideNet=0;if(p.bet>0){seatPay(p,-(p.bet+p.rpp+p.rt3));p.last=p.bet;p.hands=[{cd:[],b:p.bet,done:false,dbl:false,sp:false,res:''}];}});
  for(let r=0;r<2;r++){s.seats.forEach(p=>{if(p.hands.length)p.hands[0].cd.push(bjDraw());});s.dl.push(bjDraw(r===0));}
  bjSideSettle();
  if(bjVal(s.dl[0])===1){s.phase='ins';const tc=bjTC();
    s.seats.forEach(p=>{if(!p.hands.length)return;if(p.t==='bot'){if(p.sty==='count'&&tc>=3&&p.c>=p.bet/2){p.ins=Math.floor(p.bet/2);seatPay(p,-p.ins);}p.insd=true;}else p.insd=false;});
    if(s.seats.every(p=>p.insd))bjPeek();}
  else bjPeek();}
function bjPeek(){const s=BJ.st;const up=bjVal(s.dl[0]);
  if((up===1||up===10)&&bjTot(s.dl).t===21){s.hid=false;s.rc+=hiLo(s.dl[1]);s.msg='לדילר בלאק ג׳ק';bjSettle();return;}
  if(up===1||up===10)s.msg='הדילר הציץ — אין לו בלאק ג׳ק';
  s.phase='play';s.ts=-1;s.th=0;bjNext();}
function bjNext(){const s=BJ.st;let i=s.ts<0?0:s.ts,h=s.ts<0?0:s.th;
  for(;i<s.seats.length;i++,h=0){const p=s.seats[i];for(;h<p.hands.length;h++){const hd=p.hands[h];if(hd.done)continue;
      if(hd.cd.length===1){hd.cd.push(bjDraw());if(hd.sp&&bjVal(hd.cd[0])===1){hd.done=true;continue;}}
      if(bjTot(hd.cd).t>=21){hd.done=true;continue;}
      s.ts=i;s.th=h;return;}}
  s.ts=-1;s.th=-1;s.phase='dealer';}
function bjAct(i,a,amt,d){const s=BJ.st,p=s.seats[i];if(!p)return false;
  if(s.phase==='bet'){if(a==='bet'){let v=clamp(Math.round(amt||0),0,Math.min(s.max,chipsOf(p)));if(v>0&&v<s.min)v=chipsOf(p)>=s.min?s.min:0;p.bet=v;p.ready=true;
      if(d&&typeof d==='object'){const cap=Math.floor(s.max/5);p.pp=clamp(Math.round(+d.pp||0),0,cap);p.t3=clamp(Math.round(+d.t3||0),0,cap);if(p.bet+p.pp+p.t3>chipsOf(p)){p.pp=0;p.t3=0;}}return true;}return false;}
  if(s.phase==='ins'){if(p.insd)return false;if(a==='ins'){const x=Math.floor(p.bet/2);if(chipsOf(p)>=x){p.ins=x;seatPay(p,-x);}}p.insd=true;if(s.seats.every(q=>q.insd))bjPeek();return true;}
  if(s.phase!=='play'||s.ts!==i)return false;
  const hd=p.hands[s.th];const L=bjLegal(i);
  if(a==='hit'){hd.cd.push(bjDraw());if(bjTot(hd.cd).t>=21)hd.done=true;}
  else if(a==='stand')hd.done=true;
  else if(a==='double'&&L.dbl){seatPay(p,-hd.b);hd.b*=2;hd.dbl=true;hd.cd.push(bjDraw());hd.done=true;}
  else if(a==='split'&&L.split){seatPay(p,-hd.b);const c2=hd.cd.pop();p.hands.splice(s.th+1,0,{cd:[c2],b:hd.b,done:false,dbl:false,sp:true,res:''});hd.sp=true;bjNext();return true;}
  else if(a==='surr'&&L.surr){hd.res='surr';hd.done=true;}
  else return false;
  if(hd.done)bjNext();return true;}
function bjDealerStep(){const s=BJ.st;if(s.hid){s.hid=false;s.rc+=hiLo(s.dl[1]);return;}
  const live=s.seats.some(p=>p.hands.some(h=>h.res!=='surr'&&bjTot(h.cd).t<=21&&!(h.cd.length===2&&!h.sp&&p.hands.length===1&&bjTot(h.cd).t===21)));
  const dT=bjTot(s.dl);if(live&&(dT.t<17||(s.rules.h17&&dT.soft&&dT.t===17))){s.dl.push(bjDraw());return;}
  bjSettle();}
function bjSettle(){const s=BJ.st;s.hid=false;const d=bjTot(s.dl),dBJ=s.dl.length===2&&d.t===21;
  s.seats.forEach(p=>{if(!p.hands.length)return;let pay=0,stake=p.ins;if(p.ins&&dBJ)pay+=p.ins*3;
    p.hands.forEach(h=>{stake+=h.b;const t=bjTot(h.cd).t;const nat=h.cd.length===2&&!h.sp&&p.hands.length===1&&t===21;let r;
      if(h.res==='surr'){pay+=h.b/2;r='surr';}
      else if(nat){if(dBJ){pay+=h.b;r='push';}else{pay+=h.b*(1+s.rules.bjpay);r='bj';}}
      else if(t>21)r='bust';else if(dBJ)r='lose';
      else if(d.t>21||t>d.t){pay+=h.b*2;r='win';}else if(t===d.t){pay+=h.b;r='push';}else r='lose';
      h.res=r;h.done=true;});
    pay=Math.floor(pay);if(pay)seatPay(p,pay);p.net=pay-stake+(p.sideNet||0);
    if(p.t==='me'){const SF=sideEdgeFull(BJ.decks);recHand('bj',p.net,-(bjEdge(s.rules)/100)*p.last+(p.rpp||0)*SF.pp.ev+(p.rt3||0)*SF.t3.ev);p.hands.forEach(h=>{if(h.res==='bj')unlock('bj_nat');if(h.cd.length>=5&&h.res==='win')unlock('bj_5card');if(h.res==='win'||h.res==='bj')chal('bj_win5');});
      if(BJ.chal){BJ.chal.net+=p.net;if(BJ.chal.round>=CH_ROUNDS)chalFinish(BJ.chal,'bj');}
      histPush({g:'bj',t:Date.now(),hands:p.hands.map(h=>({cd:h.cd.slice(),res:h.res,b:h.b})),dl:s.dl.slice(),net:p.net,side:p.side||[],ins:p.ins,dec:BJ.rec?BJ.rec.dec:[]});}});
  s.phase='done';s.ts=-1;}
function bjNewRound(){const s=BJ.st;if(s.phase!=='done')return;s.phase='bet';s.dl=[];s.hid=true;
  s.seats.forEach(p=>{p.hands=[];p.ins=0;p.net=0;p.ready=false;p.side=[];p.sideNet=0;if(p.t!=='bot'){p.bet=Math.min(p.last||s.min,chipsOf(p));if(p.bet+p.pp+p.t3>chipsOf(p)){p.pp=0;p.t3=0;}}if(p.t==='bot'&&p.c<s.min)p.c=s.min*100;});}
/* side bets */
const PP_PAY={perf:25,col:12,mix:6},T3_PAY=[100,40,30,10,5],T3_NAME=['שלישייה באותה צורה','רצף צבע','שלישייה','רצף','צבע'];
function ppEval(a,b){if(rk(a)!==rk(b))return null;if(a===b||(a&3)===(b&3))return {n:'זוג מושלם',pay:25,k:'perf'};if(isRed(a)===isRed(b))return {n:'זוג צבעוני',pay:12,k:'col'};return {n:'זוג מעורב',pay:6,k:'mix'};}
function t3Cat(a,b,c){const ra=rk(a),rb=rk(b),rc=rk(c);const fl=(a&3)===(b&3)&&(b&3)===(c&3);const trips=ra===rb&&rb===rc;
  if(trips)return fl?0:2;
  let st=false;if(ra!==rb&&rb!==rc&&ra!==rc){const r=[ra,rb,rc].sort((x,y)=>x-y);st=(r[2]-r[0]===2)||(r[0]===2&&r[1]===3&&r[2]===14);}
  if(st&&fl)return 1;if(st)return 3;if(fl)return 4;return -1;}
function bjSideSettle(){const s=BJ.st;s.seats.forEach(p=>{if(!p.hands.length)return;const [c1,c2]=p.hands[0].cd;const up=s.dl[0];
  if(p.rpp){const r=ppEval(c1,c2);const win=r?p.rpp*(r.pay+1):0;if(win){seatPay(p,win);if(p.t==='me')chal('side_win');}p.sideNet+=win-p.rpp;p.side.push({k:'pp',n:r?r.n:'',x:win-p.rpp});if(r&&r.k==='perf'&&p.t==='me')unlock('side_perfect');}
  if(p.rt3){const c=t3Cat(c1,c2,up);const win=c>=0?p.rt3*(T3_PAY[c]+1):0;if(win){seatPay(p,win);if(p.t==='me')chal('side_win');}p.sideNet+=win-p.rt3;p.side.push({k:'t3',n:c>=0?T3_NAME[c]:'',x:win-p.rt3});if(c===0&&p.t==='me')unlock('side_suited');}});}
let SIDECACHE={k:'',v:null};
function bjSideEV(){const guest=NET&&NET.role==='guest';const key=guest?'g':BJ.shoe.length+'|'+(BJ.st?BJ.st.round:0);if(SIDECACHE.k===key)return SIDECACHE.v;
  const n=new Array(52).fill(0);if(!guest&&BJ.shoe.length)BJ.shoe.forEach(c=>n[c]++);else n.fill(BJ.decks);
  const v=sideEVfrom(n);SIDECACHE={k:key,v};return v;}
function sideEVfrom(n){const N=n.reduce((a,b)=>a+b,0);let perf=0,col=0,mix=0;
  for(let a=0;a<52;a++){if(!n[a])continue;for(let b=0;b<52;b++){if(rk(a)!==rk(b))continue;const nb=n[b]-(a===b?1:0);if(nb<=0)continue;const q=n[a]/N*nb/(N-1);if(a===b||(a&3)===(b&3))perf+=q;else if(isRed(a)===isRed(b))col+=q;else mix+=q;}}
  const P=[0,0,0,0,0];
  for(let a=0;a<52;a++){if(!n[a])continue;const pa=n[a]/N;for(let b=0;b<52;b++){const nb=n[b]-(a===b?1:0);if(nb<=0)continue;const pb=pa*nb/(N-1);
    for(let c=0;c<52;c++){const nc=n[c]-(a===c?1:0)-(b===c?1:0);if(nc<=0)continue;const k=t3Cat(a,b,c);if(k>=0)P[k]+=pb*nc/(N-2);}}}
  return {pp:{perf,col,mix,ev:perf*26+col*13+mix*7-1},t3:{P,ev:P.reduce((a,x,k)=>a+x*(T3_PAY[k]+1),0)-1}};}
function botBj(i){const s=BJ.st,p=s.seats[i];const hd=p.hands[s.th];const L=bjLegal(i);const up=bjVal(s.dl[0]);const u2=up===1?11:up;let a=bsAction(hd.cd,u2,L,!!s.rules.h17);if(p.sty==='count'){const dv=bjDeviation(hd.cd,u2,bjTC(),L,!!s.rules.h17);if(dv)a=dv.a;}
  if(p.sty==='wild'&&Math.random()<.2)a=bjTot(hd.cd).t<17?'stand':'hit';bjAct(i,a);}
function bjTick(){const s=BJ.st;if(!s||(NET&&NET.role==='guest'))return;clearTimeout(BJ.timer);bjUpdCounts();netBroadcast();if(CUR.v==='bj')bjRender();
  if(s.phase==='dealer'){BJ.timer=setTimeout(()=>{bjDealerStep();bjTick();},700);return;}
  if(s.phase==='play'){const p=s.seats[s.ts];if(p&&(p.t==='bot'))BJ.timer=setTimeout(()=>{botBj(s.ts);bjTick();},600);return;}
  if(s.phase==='done'&&NET){BJ.timer=setTimeout(()=>{bjNewRound();bjTick();},5000);return;}}
function bjProbs(){const s=BJ.st;const cnt=s.counts||new Array(11).fill(1);const tot=cnt.slice(1).reduce((a,b)=>a+b,0)||1;const pr=[0];for(let v=1;v<=10;v++)pr[v]=cnt[v]/tot;return pr;}
function bjSolve(i){const s=BJ.st;const p=s.seats[i];if(s.phase==='ins'){const pr=bjProbs();return {ins:true,p10:pr[10],ev:3*pr[10]-1};}
  const hd=p.hands[s.th];if(!hd)return null;const L=bjLegal(i);const pr=bjProbs();const up=bjVal(s.dl[0]);const D=dealerDist(up,pr,!!s.rules.h17);
  const ev=bjEVs(hd.cd,D,pr,L);const h17=!!s.rules.h17;let best='stand';Object.keys(ev).forEach(k=>{if(ev[k]>ev[best])best=k;});
  const T=bjTot(hd.cd);let bust=0;if(!T.soft)for(let c=1;c<=10;c++)if(T.hard+c>21)bust+=pr[c];
  const u2=up===1?11:up;return {ev,best,bs:bsAction(hd.cd,u2,L,h17),dev:bjDeviation(hd.cd,u2,bjTC(),L,h17),D,bust,tot:T,tc:bjTC(),b:hd.b};}
function bjSolveCached(i){const s=BJ.st;const p=s.seats[i];const hd=p&&p.hands[s.th];const key=[s.round,s.phase,i,s.th,hd?hd.cd.join(','):'',s.left].join('|');if(BJ.solveKey!==key){BJ.solve=bjSolve(i);BJ.solveKey=key;}return BJ.solve;}
function bjCanControl(i){if(i<0)return false;const p=BJ.st.seats[i];if(NET&&NET.role==='guest')return i===NET.mySeat;return isHere(p);}
function bjDo(i,a,amt){const s=BJ.st;if(!bjCanControl(i))return;
  if(s.seats[i].t==='me'&&(s.phase==='play'&&s.ts===i||s.phase==='ins')){if(!BJ.rec)BJ.rec={dec:[]};
    if(s.phase==='ins'){const pr=bjProbs();BJ.rec.dec.push({ins:1,a,p10:pr[10]});}
    else{const R=bjSolve(i);const hd=s.seats[i].hands[s.th];if(R.ev[a]!=null){if(BJ.chal){BJ.chal.dec++;if(R.ev[R.best]-R.ev[a]<.01)BJ.chal.good++;}BJ.streak=(R.ev[R.best]-R.ev[a]<.01)?(BJ.streak||0)+1:0;chal('bj_streak10',BJ.streak,true);}BJ.rec.dec.push({cd:hd.cd.slice(),up:s.dl[0],a,best:R.best,bs:R.bs,ev:Object.fromEntries(Object.entries(R.ev).map(([k,v])=>[k,Math.round(v*1000)/1000])),tc:Math.round(R.tc*10)/10});}}
  if(S.coach&&s.phase==='play'&&s.ts===i){const R=bjSolveCached(i);if(R&&R.ev[a]!=null){const loss=R.ev[R.best]-R.ev[a];const ok=loss<.01;recDec('bj',ok);
      if(!ok)toast(`הסולבר: ${BJA[R.best]} (EV ${sgn(R.ev[R.best]*R.b)}) — ${BJA[a]} שווה ${sgn(R.ev[a]*R.b)}`,'bad');}}
  if(S.coach&&s.phase==='ins'&&a!=='bet'){const pr=bjProbs();const ev=3*pr[10]-1;const ok=(a==='ins')===(ev>0);recDec('bj',ok);if(!ok)toast(a==='ins'?`ביטוח מפסיד כאן: ${pct(pr[10],0)} סיכוי ל-10 בחור (צריך מעל 33%)`:'הפעם הביטוח היה רווחי — הספירה גבוהה','bad');}
  if(NET&&NET.role==='guest'){netSend(a,amt);return;}
  if(bjAct(i,a,amt))bjTick();}
function bjHandHTML(p,i,h,hd){const s=BJ.st;const T=bjTot(hd.cd);const act=s.phase==='play'&&s.ts===i&&s.th===h;
  return `<div class="bjhand ${act?'act':''}"><div class="cards ov">${hd.cd.map((c,k)=>cardHTML(c,'',`bj${s.round}s${i}h${h}k${k}`)).join('')}</div>
   <div class="row" style="justify-content:center"><span class="tot">${T.soft&&T.t<21?(T.t-10)+'/'+T.t:T.t}</span><span class="betchip">${fmt(hd.b)}${hd.dbl?' ×2':''}</span>${hd.res?`<span class="res ${hd.res}">${{win:'ניצחון',bj:'בלאק ג׳ק!',lose:'הפסד',bust:'נשרף',push:'תיקו',surr:'כניעה'}[hd.res]}</span>`:''}</div></div>`;}
function bjRender(V=$('#view')){const s=BJ.st;if(!s){go('home');return;}
  const up=s.dl[0];const dT=s.hid?null:bjTot(s.dl);
  let h=`<div class="tbar"><button class="btn ghost sm" data-a="bjleave">קום</button><h2>בלאק ג׳ק</h2><span class="pill gold">מינ׳ ${fmt(s.min)}</span>${NET?`<span class="pill">חדר ${esc(NET.code)}</span>`:''}<span class="pill">${s.left} קלפים בנעל</span>${helpBtn()}</div>
  <div class="felt"><div class="dealer"><span class="lbl2">דילר</span><div class="cards ov">${s.dl.map((c,k)=>cardHTML(k===1&&s.hid?-1:c,'',`bj${s.round}d${k}${k===1&&s.hid?'h':''}`)).join('')||'<div style="height:71px"></div>'}</div>
   ${s.dl.length?`<span class="tot">${dT?dT.t:bjTot([up]).t}</span>`:''}</div>
   <p class="arc">BLACKJACK PAYS ${s.rules.bjpay===1.2?'6 TO 5':'3 TO 2'} · DEALER ${s.rules.h17?'HITS':'STANDS ON'} SOFT 17 · ${s.rules.decks} DECK${s.rules.decks>1?'S':''}</p>
   ${s.msg?`<p class="resline" style="margin-bottom:6px">${esc(s.msg)}</p>`:''}

onmessage=e=>{const hand=e.data.hand;const pay=PAY.slice();pay[0]=e.data.royal;const used=new Uint8Array(52);hand.forEach(c=>used[c]=1);const rem=[];for(let c=0;c<52;c++)if(!used[c])rem.push(c);const N=rem.length;

for(let m=31;m>=0;m--){let k=0;for(let i=0;i<5;i++)if(m&(1<<i))h[k++]=hand[i];const need=5-k;const cnt=new Float64Array(10);let total=0;

    if(bank>=1100)goal++;else if(bank<=0)bust++;sum+=bank-1000;}
  $('#martout').innerHTML=`<b class="good">${pct(goal/N,1)}</b> מהסשנים הגיעו ליעד (+100) · <b class="bad">${pct(bust/N,1)}</b> נמחקו לגמרי · תוצאה ממוצעת לסשן: <b class="${sum<0?'bad':'good'}">${sgn(sum/N)}</b>. רוב הזמן מרוויחים קצת — ופעם בכמה סשנים מאבדים הכל. התוחלת נשארת שלילית.`;}

/* ================= ONLINE (room presence) ================= */
let NET=null,ROOMAPI;
async function roomApi(){if(ROOMAPI!==undefined)return ROOMAPI;try{ROOMAPI=(window.claude&&typeof window.claude.use==='function')?await window.claude.use('room'):null;}catch(e){ROOMAPI=null;}return ROOMAPI;}
function rOnline(V){
  if(ROOMAPI===undefined){V.innerHTML=`<div class="tbar"><button class="btn ghost sm" data-a="home">חזרה</button><h2>אונליין</h2></div><p class="muted" style="margin-top:16px">בודק חיבור…</p>`;roomApi().then(()=>{if(CUR.v==='online')render();});return;}
  let h=`<div class="tbar"><button class="btn ghost sm" data-a="netback">חזרה</button><h2>שחק עם חברים</h2></div><div class="stack" style="margin-top:12px">`;
  if(!ROOMAPI){h+=`<div class="panel stack"><h3>אונליין לא זמין כאן</h3><p class="muted">משחק אונליין עובד כשהמשחק פתוח בתוך Claude וכל החברים נכנסים לאותו קישור שיתוף כשהם מחוברים לחשבון. בינתיים אפשר לשחק עם חברים מאותו טלפון.</p><button class="btn" data-a="setup" data-g="bj">בלאק ג׳ק מאותו טלפון</button><button class="btn dark" data-a="setup" data-g="poker" data-var="holdem">פוקר מאותו טלפון</button></div>`;}
  else if(!NET){h+=`<div class="panel stack"><label class="lbl" for="nick">הכינוי שלך</label><input class="txt" id="nick" maxlength="14" value="${esc(S.nick)}" placeholder="למשל: אורי"></div>
    <div class="panel stack"><h3>פתח חדר</h3>${seg('netg',[['bj','בלאק ג׳ק'],['holdem','הולדם'],['omaha','אומהה'],['draw','5 קלפים']],SETUP.netg||'holdem')}<button class="btn" data-a="netcreate">צור חדר וקבל קוד</button></div>
    <div class="panel stack"><h3>הצטרף לחדר</h3><input class="txt" id="joincode" maxlength="6" placeholder="קוד בן 4 תווים" style="direction:ltr;text-align:center;letter-spacing:4px"><button class="btn dark" data-a="netjoin">הצטרף</button></div>
    <p class="note">החברים צריכים לפתוח את אותו קישור של המשחק (שיתוף מתוך Claude). הצ׳יפים בחדר הם צ׳יפים של השולחן — היתרה האישית לא משתנה.</p>`;}
  else if(NET.role==='host'){const g=NET.game;h+=`<div class="panel stack"><p class="lbl">קוד החדר</p><div class="code">${esc(NET.code)}</div><p class="hint" style="text-align:center">שלחו לחברים את הקוד ואת הקישור למשחק</p></div>
    <div class="panel stack"><h3>בחדר (${1+Object.keys(NET.guests).length})</h3><div class="plist"><div><span>${esc(S.nick||'מארח')}</span><span class="muted">מארח</span></div>${Object.values(NET.guests).map(x=>`<div><span>${esc(x.nick)}</span><span class="muted">מחובר</span></div>`).join('')}</div>
    <label class="lbl">בוטים נוספים</label>${seg('netbots',[0,1,2,3],NET.bots)}</div><button class="btn" data-a="netstart" ${Object.keys(NET.guests).length?'':'disabled'}>התחל ${g==='bj'?'בלאק ג׳ק':VAR_NAME[g]}</button>${Object.keys(NET.guests).length?'':'<p class="hint">ממתינים שלפחות חבר אחד יצטרף…</p>'}`;}
  else{h+=`<div class="panel stack"><p class="lbl">חדר</p><div class="code">${esc(NET.code)}</div>${NET.host?`<p style="text-align:center">מחובר! ${esc(NET.host.presence.nick||'המארח')} יתחיל את המשחק בקרוב.</p>`:`<p class="muted" style="text-align:center">מחפש את המארח… ודא שהקוד נכון.</p>`}</div>`;}
  h+=`</div>`;V.innerHTML=h;const ni=$('#nick');if(ni)ni.addEventListener('input',()=>{S.nick=ni.value.trim();save();});}
async function netCreate(){const R=await roomApi();if(!R)return;const code=Math.random().toString(36).slice(2,6);
  try{const r=await R.join('c77-'+code);NET={role:'host',code,r,game:SETUP.netg||'holdem',phase:'lobby',guests:{},bots:1,last:{}};
    await r.presence({role:'host',nick:S.nick||'מארח',game:NET.game,phase:'lobby'});NET.unsub=r.onPeers(netPeers);chatRender();render();}
  catch(e){toast('לא הצלחתי לפתוח חדר: '+esc(e.code||e.message||''),'bad');}}
async function netJoin(){const code=($('#joincode')?.value||'').trim().toLowerCase();if(!/^[a-z0-9]{4}$/.test(code)){toast('הקוד צריך להיות 4 תווים','bad');return;}const R=await roomApi();if(!R)return;
  try{const r=await R.join('c77-'+code);NET={role:'guest',code,r,seq:Date.now(),myPeer:null,host:null,mySeat:-1};await r.presence({role:'guest',nick:S.nick||'אורח'});NET.unsub=r.onPeers(netPeers);chatRender();render();}
  catch(e){toast('לא הצלחתי להצטרף: '+esc(e.code||e.message||''),'bad');}}
function netPeers(ch){if(!NET)return;const peers=ch.peers||[];netChatScan(peers);
  if(NET.role==='host'){
    peers.forEach(p=>{if(p.sameTab||!p.presence||p.presence.role!=='guest')return;if(!NET.guests[p.peer])NET.guests[p.peer]={nick:String(p.presence.nick||'אורח').slice(0,14)};
      const act=p.presence.act;if(act&&typeof act.n==='number'&&act.n>(NET.last[p.peer]||0)){NET.last[p.peer]=act.n;netApply(p.peer,act);}});
    (ch.left||[]).forEach(p=>{delete NET.guests[p.peer];const st=NET.game==='bj'?BJ.st:PK.st;if(st&&NET.phase==='play'){const s=st.seats.find(x=>x.peer===p.peer);if(s){s.t='bot';s.sty=NET.game==='bj'?'basic':'pro';s.n+=' (בוט)';toast(esc(s.n)+' התנתק — בוט ממשיך במקומו');NET.game==='bj'?bjTick():pkTick();}}});
    if(CUR.v==='online')render();return;}
  const me=peers.find(p=>p.sameTab);if(me)NET.myPeer=me.peer;
  const host=peers.find(p=>p.presence&&p.presence.role==='host');
  if(!host&&NET.host){NET.host=null;toast('המארח עזב את החדר','bad');}
  NET.host=host||null;if(!host){if(CUR.v==='online')render();return;}
  const pr=host.presence;
  if(pr.phase==='play'&&pr.s){const st=pr.s;if(st.g==='pk'){PK.st=st;}else{BJ.st=st;}NET.mySeat=st.seats.findIndex(x=>x.peer===NET.myPeer);
    const view=st.g==='pk'?'pk':'bj';if(CUR.v!==view){CUR={v:view};}if(view==='bj'&&NET.mySeat>=0)BJ.betSeat=NET.mySeat;render();}
  else if(CUR.v==='online')render();}
function netApply(peer,act){const st=NET.game==='bj'?BJ.st:PK.st;if(!st||NET.phase!=='play')return;const i=st.seats.findIndex(x=>x.peer===peer);if(i<0)return;
  if(NET.game==='bj'){if(bjAct(i,String(act.a),+act.amt||0,act.d))bjTick();}
  else{const ok=act.a==='draw'?pkDrawAct(i,Array.isArray(act.d)?act.d.map(Number):[]):pkAct(i,String(act.a),+act.amt||0);if(ok)pkTick();}}
function netSend(a,amt,d){if(!NET||NET.role!=='guest')return;NET.seq++;NET.r.presence({act:{n:NET.seq,a,amt:amt||0,d:d||null}}).catch(()=>{});}
function netStart(){const g=NET.game;const guests=Object.entries(NET.guests);
  if(g==='bj'){const seats=[{n:S.nick||'מארח',t:'local',c:5000},...guests.map(([peer,x])=>({n:x.nick,t:'remote',peer,c:5000}))];botsFor(NET.bots).forEach(([n],k)=>seats.push({n,t:'bot',sty:['count','basic','wild'][k%3],c:5000}));
    bjCreate(seats,50);BJ.betSeat=0;NET.phase='play';go('bj');bjTick();}
  else{const seats=[{n:S.nick||'מארח',t:'local',c:5000},...guests.map(([peer,x])=>({n:x.nick,t:'remote',peer,c:5000}))];botsFor(Math.min(NET.bots,6-seats.length)).forEach(([n,s])=>seats.push({n,t:'bot',sty:s,c:5000}));
    pkCreate(g,seats,25,50);NET.phase='play';go('pk');pkNextHand();}}
function netBroadcast(){if(!NET||NET.role!=='host'||NET.phase!=='play')return;const src=NET.game==='bj'?BJ.st:PK.st;if(!src)return;
  const st=JSON.parse(JSON.stringify(src));if(st.g==='bj'&&st.hid&&st.dl.length>1)st.dl[1]=-1;st.log=(st.log||[]).slice(0,3);
  if(JSON.stringify(st).length>3600)st.log=[];
  NET.r.presence({phase:'play',game:NET.game,s:st}).catch(()=>{});}
function netLeave(){if(!NET)return;try{NET.unsub&&NET.unsub();NET.r.leave();}catch(e){}NET=null;chatRender();}

const TCP={phase:'bet',ante:25,pp:0,target:'ante',ph:[],dh:[],res:null,play:false,key:0,deck:[]};
const TC_CATS=['קלף גבוה','זוג','צבע','רצף','שלישייה','רצף צבע'];
const TC_PP=[0,1,4,6,30,40],TC_AB=[0,0,0,1,4,5];
function tc3(h){const r=h.map(rk).sort((a,b)=>b-a);const fl=(h[0]&3)===(h[1]&3)&&(h[1]&3)===(h[2]&3);let st=0;
  if(r[0]!==r[1]&&r[1]!==r[2]){if(r[0]-r[2]===2)st=r[0];else if(r[0]===14&&r[1]===3&&r[2]===2)st=3;}
  let cat,k;if(st&&fl){cat=5;k=[st];}else if(r[0]===r[2]){cat=4;k=[r[0]];}else if(st){cat=3;k=[st];}else if(fl){cat=2;k=r;}
  else if(r[0]===r[1]||r[1]===r[2]){cat=1;k=[r[1],r[0]===r[1]?r[2]:r[0]];}else{cat=0;k=r;}

function tcpInit(){TCP.phase='bet';TCP.ante=25;TCP.pp=0;TCP.target='ante';TCP.ph=[];TCP.dh=[];TCP.res=null;TCP.play=false;}

  addBal(-(TCP.ante+TCP.pp));TCP.deck=newDeck();TCP.ph=[TCP.deck.pop(),TCP.deck.pop(),TCP.deck.pop()];TCP.dh=[TCP.deck.pop(),TCP.deck.pop(),TCP.deck.pop()];TCP.phase='decide';TCP.play=false;TCP.res=null;TCP.key++;TCP.solve=null;tcpRender();}
function tcpSolve(){if(TCP.solve)return TCP.solve;const used=new Set(TCP.ph);const rem=[];for(let c=0;c<52;c++)if(!used.has(c))rem.push(c);
  const pv=tc3(TCP.ph);const ab=TC_AB[tcCat(pv)];let ev=0,n=0,q=0,w=0,t=0;const h=[0,0,0];const L=rem.length;

/* ================= BACCARAT ================= */
const BAC={shoe:[],cut:14,bets:{},prev:{},chip:25,phase:'bet',coup:null,order:[],step:0,res:null,road:[],key:0,mc:null,mcKey:-1,timer:null};
const bv=c=>{const r=rk(c);return r===14?1:r>=10?0:r;};
const bTot=h=>h.reduce((a,c)=>a+bv(c),0)%10;
function bacInit(){BAC.shoe=newDeck(8);BAC.shoe.pop();BAC.cut=14+rnd(10);BAC.bets={};BAC.prev={};BAC.phase='bet';BAC.coup=null;BAC.res=null;BAC.road=[];BAC.mcKey=-1;}
function bacCoup(draw){const P=[draw(),draw()],B=[draw(),draw()];const pt=bTot(P),bt=bTot(B);
  if(pt<8&&bt<8){let p3=null;if(pt<=5){p3=draw();P.push(p3);}
    if(p3===null){if(bt<=5)B.push(draw());}
    else{const v=bv(p3);if(bt<=2||(bt===3&&v!==8)||(bt===4&&v>=2&&v<=7)||(bt===5&&v>=4&&v<=7)||(bt===6&&(v===6||v===7)))B.push(draw());}}
  return {P,B,pt:bTot(P),bt:bTot(B)};}
const BAC_SPOT={p:['שחקן','1:1'],b:['בנקאי','0.95:1'],t:['טאי','8:1'],pp:['זוג שחקן','11:1'],bp:['זוג בנקאי','11:1']};
function bacBet(k){if(BAC.phase!=='bet')return;const tot=Object.values(BAC.bets).reduce((a,b)=>a+b,0);if(tot+BAC.chip>bal()){toast('אין מספיק צ׳יפים','bad');return;}BAC.bets[k]=(BAC.bets[k]||0)+BAC.chip;bacRender();}
function bacDeal(){if(BAC.phase!=='bet')return;const tot=Object.values(BAC.bets).reduce((a,b)=>a+b,0);if(!tot){toast('הניחו הימור');return;}if(tot>bal()){toast('אין מספיק צ׳יפים','bad');return;}
  if(BAC.shoe.length<BAC.cut){BAC.shoe=newDeck(8);BAC.shoe.pop();BAC.cut=14+rnd(10);BAC.road=[];toast('נעל חדשה — 8 חפיסות');}
  addBal(-tot);BAC.prev={...BAC.bets};BAC.stake={...BAC.bets};BAC.coup=bacCoup(()=>BAC.shoe.pop());
  const c=BAC.coup;BAC.order=[['P',0],['B',0],['P',1],['B',1]];if(c.P[2]!=null)BAC.order.push(['P',2]);if(c.B[2]!=null)BAC.order.push(['B',2]);
  BAC.step=0;BAC.key++;BAC.phase='deal';BAC.res=null;bacStep();}
function bacStep(){BAC.step++;if(CUR.v==='bac')bacRender();if(BAC.step<BAC.order.length)BAC.timer=setTimeout(bacStep,520);else BAC.timer=setTimeout(bacSettle,450);}
function bacSettle(){const c=BAC.coup;const w=c.pt>c.bt?'p':c.bt>c.pt?'b':'t';const pp=rk(c.P[0])===rk(c.P[1]),bp=rk(c.B[0])===rk(c.B[1]);let ret=0;const B=BAC.stake;
  if(B.p)ret+=w==='p'?B.p*2:w==='t'?B.p:0;if(B.b)ret+=w==='b'?B.b*1.95:w==='t'?B.b:0;if(B.t&&w==='t')ret+=B.t*9;if(B.pp&&pp)ret+=B.pp*12;if(B.bp&&bp)ret+=B.bp*12;
  ret=Math.floor(ret);if(ret)addBal(ret);const tot=Object.values(B).reduce((a,b)=>a+b,0);const net=ret-tot;recHand('bac',net,-(B.b||0)*.0106-(B.p||0)*.0124-(B.t||0)*.1436-((B.pp||0)+(B.bp||0))*.1036);if(B.t&&w==='t')unlock('bac_tie');if(B.b&&w==='b')chal('bac_b5');
  BAC.road.push(w);if(BAC.road.length>90)BAC.road.shift();BAC.res={w,net,pp,bp};BAC.phase='bet';BAC.bets={};bacRender();}
function bacMC(){if(BAC.mcKey===BAC.shoe.length&&BAC.mc)return BAC.mc;const d=BAC.shoe.slice();const L=d.length;const N=12000;let p=0,b=0,t=0,pp=0,bp=0;
  for(let i=0;i<N;i++){let k=0;const draw=()=>{const j=k+Math.floor(Math.random()*(L-k));const x=d[k];d[k]=d[j];d[j]=x;return d[k++];};const r=bacCoup(draw);
    if(r.pt>r.bt)p++;else if(r.bt>r.pt)b++;else t++;if(rk(r.P[0])===rk(r.P[1]))pp++;if(rk(r.B[0])===rk(r.B[1]))bp++;}
  p/=N;b/=N;t/=N;pp/=N;bp/=N;BAC.mc={p,b,t,pp,bp,ev:{p:p-b,b:.95*b-p,t:8*t-(1-t),pp:11*pp-(1-pp),bp:11*bp-(1-bp)}};BAC.mcKey=BAC.shoe.length;return BAC.mc;}
function bacRender(V=$('#view')){const c=BAC.coup;const shownN=BAC.phase==='deal'?BAC.step:(c?9:0);
  const shown=(side,k)=>{const i=BAC.order.findIndex(([s,j])=>s===side&&j===k);return i>=0&&i<shownN;};
  const hand=side=>{const arr=c?(side==='P'?c.P:c.B):[];const vis=arr.filter((x,k)=>shown(side,k));return {html:arr.map((x,k)=>shown(side,k)?cardHTML(x,'',`bac${BAC.key}${side}${k}`):'').join(''),tot:vis.length?bTot(vis):null};};
  const P=hand('P'),Bh=hand('B');const r=BAC.res;const bets=BAC.phase==='deal'?BAC.stake:BAC.bets;
  let h=`<div class="tbar"><button class="btn ghost sm" data-a="home">קום</button><h2>באקרה</h2><span class="pill gold">8 חפיסות</span><span class="pill">${BAC.shoe.length} קלפים</span>${helpBtn()}</div>

   <div class="resline">${r?`${{p:'השחקן מנצח',b:'הבנקאי מנצח',t:'טאי'}[r.w]}${r.pp?' · זוג שחקן':''}${r.bp?' · זוג בנקאי':''} · <b class="${r.net>0?'good':r.net<0?'bad':''}">${sgn(r.net)}</b>`:BAC.phase==='deal'?'מחלקים…':'הניחו הימורים'}</div>
   <div class="bspots">${['pp','t','bp','p','b'].map(k=>`<button class="bspot ${k==='p'||k==='b'?'big':''} ${k[0]==='p'&&k!=='pp'?'p':''} ${k==='b'?'b':''} ${k==='t'?'t':''} ${r&&((k===r.w)||(k==='pp'&&r.pp)||(k==='bp'&&r.bp))?'hit':''}" data-a="bacbet" data-k="${k}" ${BAC.phase!=='bet'?'disabled':''}>${BAC_SPOT[k][0]}<small>${BAC_SPOT[k][1]}</small>${bets[k]?`<span class="bc">${bets[k]>=1000?(bets[k]/1000).toFixed(1)+'K':bets[k]}</span>`:''}</button>`).join('')}</div>
   ${BAC.road.length?`<div class="road">${BAC.road.map(x=>`<span class="bead ${x}">${{p:'P',b:'B',t:'T'}[x]}</span>`).join('')}</div>`:''}</div>
  <div class="actions"><div class="chips">${[5,25,100,500,1000].map(x=>`<button class="chip c${x} ${BAC.chip===x?'on':''}" data-a="bacchip" data-v="${x}">${x>=1000?'1K':x}</button>`).join('')}</div>
   <div class="grid" style="margin-top:8px"><button class="btn dark" data-a="bacclear" ${BAC.phase!=='bet'?'disabled':''}>נקה</button><button class="btn dark" data-a="bacrebet" ${BAC.phase!=='bet'||!Object.keys(BAC.prev).length?'disabled':''}>שוב</button><button class="btn" data-a="bacdeal" ${BAC.phase!=='bet'?'disabled':''}>חלק</button></div></div>`;
  if(S.solver){const M=bacMC();const cnt={p:0,b:0,t:0};BAC.road.forEach(x=>cnt[x]++);

function snd(t){if(!S.sound)return;try{if(!ACTX){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ACTX=new A();}const c=ACTX;if(c.state==='suspended')c.resume();const n=c.currentTime;
  const tone=(f,st,d,type='sine',vol=.08)=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,n+st);g.gain.setValueAtTime(0,n+st);g.gain.linearRampToValueAtTime(vol,n+st+.005);g.gain.exponentialRampToValueAtTime(.0001,n+st+d);o.connect(g);g.connect(c.destination);o.start(n+st);o.stop(n+st+d+.02);};
  if(t==='card'){const len=Math.floor(c.sampleRate*.05);const b=c.createBuffer(1,len,c.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=2500;const g=c.createGain();g.gain.value=.25;s.connect(f);f.connect(g);g.connect(c.destination);s.start(n);}
  else if(t==='chip'){tone(2300,0,.05,'triangle',.06);tone(3100,.03,.06,'triangle',.05);}
  else if(t==='win'){tone(660,0,.18);tone(880,.09,.18);tone(1320,.18,.3);}
  else if(t==='tick'){tone(1400,0,.02,'square',.025);}
  else if(t==='level'){[523,659,784,1046].forEach((f,i)=>tone(f,i*.1,.25,'triangle',.07));}
}catch(e){}}

function hudOf(p){if(!PK.hud)PK.hud={};return PK.hud[p.n]||(PK.hud[p.n]={h:0,vp:0,pfr:0,ra:0,ca:0});}
function hudAct(p,kind,pre){const H=hudOf(p);if(pre){if(!p.hx.vp){p.hx.vp=1;H.vp++;}if(kind==='raise'&&!p.hx.pf){p.hx.pf=1;H.pfr++;}}else{if(kind==='raise')H.ra++;else H.ca++;}}
function hudRead(H){if(H.h<8)return 'עוד אין מספיק ידיים';const v=H.vp/H.h,r=H.pfr/H.h;if(v<.2&&r>=.12)return 'טייט-אגרסיבי (TAG) — שחקן חזק, כבד את ההימורים שלו';if(v<.2)return 'טייט-פסיבי (סלע) — נכנס רק עם ידיים טובות';if(v>.35&&r<.12)return 'לוז-פסיבי (דג) — קורא הרבה, אל תבלף אותו';if(v>.35)return 'לוז-אגרסיבי (LAG) — לוחץ הרבה, תן לו להמר לתוכך';return 'מאוזן';}
function hudLine(p){const H=PK.hud&&PK.hud[p.n];if(!H||H.h<5)return '';return `<div class="hud">VPIP ${Math.round(H.vp/H.h*100)} · PFR ${Math.round(H.pfr/H.h*100)}</div>`;}
function openHud(i){const p=PK.st.seats[i];const H=hudOf(p);const af=H.ca?H.ra/H.ca:H.ra;
  modal(`<h3>${esc(p.n)}</h3><div class="kv" style="margin-top:10px"><div><small>ידיים</small><b>${H.h}</b></div><div><small>VPIP</small><b>${H.h?pct(H.vp/H.h,0):'—'}</b></div><div><small>PFR</small><b>${H.h?pct(H.pfr/H.h,0):'—'}</b></div></div>
   <div class="kv" style="margin-top:8px"><div><small>אגרסיביות (AF)</small><b>${af.toFixed(1)}</b></div><div><small>הימורים אחרי פלופ</small><b>${H.ra}</b></div><div><small>קריאות אחרי פלופ</small><b>${H.ca}</b></div></div>
   <p class="note" style="margin-top:10px"><b style="color:var(--ivory)">קריאה:</b> ${hudRead(H)}.<br>VPIP = כמה ידיים שיחק מרצון לפני הפלופ. PFR = כמה מהן העלה. AF = הימורים חלקי קריאות אחרי הפלופ.</p><div class="row" style="margin-top:12px"><button class="btn grow" data-a="closemodal">סגור</button></div>`);}

const SIMS=[{k:'feel',n:'"מחקה את הדילר"',c:'var(--bad)'},{k:'basic',n:'אסטרטגיה בסיסית',c:'var(--brass-2)'},{k:'count',n:'ספירה + הימור משתנה',c:'var(--good)'}];
let SIM={N:50000,h17:0,pay:'1.5',running:false,runs:null,done:0};
function simStart(){const rules={decks:6,h17:SIM.h17,bjpay:+SIM.pay,ls:1};const sv={st:BJ.st,shoe:BJ.shoe,cut:BJ.cut,decks:BJ.decks,rec:BJ.rec,streak:BJ.streak,chal:BJ.chal};
  SIM.runs=SIMS.map(x=>{bjCreate([{n:'sim',t:'sim',c:1e12}],10,rules);const r={k:x.k,st:BJ.st,shoe:BJ.shoe,cut:BJ.cut,units:0,wager:0,pts:[0],peak:0,dd:0,sq:0};return r;});
  Object.assign(BJ,{st:sv.st,shoe:sv.shoe,cut:sv.cut,decks:sv.decks,rec:sv.rec,streak:sv.streak,chal:sv.chal});
  SIM.done=0;SIM.running=true;render();setTimeout(simChunk,20);}
function simRound(k){const s=BJ.st,p=s.seats[0];if(s.phase!=='bet')bjNewRound();const tc=bjTC();
  const units=k==='count'?(tc>=5?8:tc>=4?6:tc>=3?4:tc>=2?2:1):1;p.bet=units*10;p.pp=0;p.t3=0;const before=p.c;bjDeal();let g=0;
  while(s.phase!=='done'&&g++<100){if(s.phase==='ins'){bjAct(0,k==='count'&&bjTC()>=3?'ins':'noins');continue;}
    if(s.phase==='play'){const hd=p.hands[s.th];const L=bjLegal(0);const up=bjVal(s.dl[0]);const u2=up===1?11:up;let a;
      if(k==='feel')a=bjTot(hd.cd).t<17?'hit':'stand';else{a=bsAction(hd.cd,u2,L,!!s.rules.h17);if(k==='count'){const dv=bjDeviation(hd.cd,u2,bjTC(),L,!!s.rules.h17);if(dv)a=dv.a;}}
      bjAct(0,a);continue;}
    if(s.phase==='dealer')bjDealerStep();}
  return {net:(p.c-before)/10,wag:units};}
function simChunk(){if(!SIM.running)return;if(CUR.v!=='bjsim'){SIM.running=false;return;}
  const sv={st:BJ.st,shoe:BJ.shoe,cut:BJ.cut,decks:BJ.decks,rec:BJ.rec,streak:BJ.streak,chal:BJ.chal};const step=Math.max(1,Math.floor(SIM.N/100));const M=Math.min(600,SIM.N-SIM.done);
  try{BJ.chal=null;SIM.runs.forEach(r=>{BJ.st=r.st;BJ.shoe=r.shoe;BJ.cut=r.cut;BJ.decks=6;for(let i=0;i<M;i++){const o=simRound(r.k);r.units+=o.net;r.wager+=o.wag;r.sq+=o.net*o.net;r.peak=Math.max(r.peak,r.units);r.dd=Math.max(r.dd,r.peak-r.units);if((SIM.done+i+1)%step===0)r.pts.push(r.units);}r.shoe=BJ.shoe;r.cut=BJ.cut;});}
  finally{Object.assign(BJ,sv);}
  SIM.done+=M;if(SIM.done>=SIM.N)SIM.running=false;render();if(SIM.running)setTimeout(simChunk,0);}
function simChart(){const R=SIM.runs;const all=R.flatMap(r=>r.pts);let mn=Math.min(0,...all),mx=Math.max(0,...all);if(mx-mn<10){mx+=5;mn-=5;}
  const W=340,H=170,pad=40;const n=Math.max(...R.map(r=>r.pts.length));const X=i=>pad+(W-pad-8)*i/Math.max(1,100),Y=v=>8+(H-24)*(1-(v-mn)/(mx-mn));
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:640px;display:block" direction="ltr" role="img" aria-label="רווח מצטבר לפי אסטרטגיה">
   ${[mx,0,mn].map(v=>`<line x1="${pad}" x2="${W-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${v===0?'stroke-width="1.5"':''}/><text x="${pad-4}" y="${Y(v)+3}" fill="var(--muted)" font-size="9" text-anchor="end" font-family="IBM Plex Mono,monospace">${short(v)}</text>`).join('')}
   ${R.map((r,k)=>`<path d="${r.pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')}" fill="none" stroke="${SIMS[k].c}" stroke-width="2"/>`).join('')}
   <text x="${W-8}" y="${H-4}" fill="var(--muted)" font-size="9" text-anchor="end" font-family="IBM Plex Mono,monospace">${fmt(SIM.done)} ידיים</text></svg></div>
   <div class="legend">${SIMS.map(x=>`<span style="color:${x.c}">━ ${x.n}</span>`).join('')}</div>`;}
function rBjSim(V){let h=`<div class="tbar"><button class="btn ghost sm" data-a="acad">חזרה</button><h2>סימולטור אסטרטגיה</h2></div><div class="stack" style="margin-top:12px">

function netSay(t){if(!NET)return;NET.r.presence({say:{n:Date.now(),t:String(t).slice(0,80)}}).catch(()=>{});}
function netChatScan(peers){if(!NET)return;if(!NET.said)NET.said={};if(!NET.chat)NET.chat=[];let got=false;
  peers.forEach(p=>{const sy=p.presence&&p.presence.say;if(!sy||typeof sy.n!=='number')return;if(sy.n<=(NET.said[p.peer]||0))return;NET.said[p.peer]=sy.n;
    const who=p.sameTab?'אני':String(p.presence.nick||'שחקן').slice(0,14);NET.chat.push({who,t:String(sy.t||'').slice(0,80)});if(NET.chat.length>40)NET.chat.shift();got=true;
    if(!p.sameTab){if(!NET.chatOpen)NET.unread=(NET.unread||0)+1;toast(`<b>${esc(who)}:</b> ${esc(String(sy.t||'').slice(0,80))}`);}});
  if(got)chatRender();}
LESSONS.push({id:'pk9',g:'פוקר',t:'Push/Fold — סוף טורניר',fn:'pftable',b:`<p>כשנשארים עם 15 בליינדים או פחות, אין מקום לרייז קטן ולפלופ: אם תעלה ותקבל רייז, תצטרך לזרוק. לכן משחקים "דחוף או קפל" — אול-אין או פולד.</p><ul><li>ככל שהסטאק קצר יותר — דוחפים יותר ידיים.</li><li>ככל שהפוזיציה מאוחרת יותר — דוחפים יותר (פחות שחקנים יכולים להתעורר עם יד).</li><li>היתרון של הדחיפה הוא שגם כשמקבלים קול, יש לך עדיין 30–50% לנצח, ופעמים רבות כולם פשוט מקפלים.</li></ul><p>בטורנירים הסולבר עובר אוטומטית לטבלה הזו כשהסטאק שלך מתחת ל-15 בליינדים.</p>`});
/* ================= events ================= */
const ACT={
  home:()=>{if(CUR.v==='pk'&&PK.st){pkLeave();return;}if(CUR.v==='bj'&&BJ.st){bjLeave();return;}if(VP.chal){if(!VP.chal.done){S.solver=VP.chal.prev.solver;S.coach=VP.chal.prev.coach;save();}VP.chal=null;go('chal');return;}go('home');},
  go:d=>{if(d.v==='chal'){VP.chal=null;}if(d.v==='drill'){newDrill(d.id);return;}go(d.v,{id:d.id,h17:BJ.st&&d.id==='bj2'?BJ.st.rules.h17:0});},
  acad:()=>go('academy'),backbj:()=>{go('bj');bjTick();},
  settings:openSettings,closemodal:closeModal,
  resetp:()=>{S.pchips=10000;save();updTop();openSettings();},
  bonus:()=>{const now=Date.now();if(now-S.bonusAt<3600e3&&bal()>=200){toast('הבונוס הבא זמין בעוד '+Math.ceil((3600e3-(now-S.bonusAt))/60000)+' דקות');return;}S.bonusAt=now;addBal(5000);toast('קיבלת 5,000 צ׳יפים','good');render();},
  setup:d=>openSetup(d.g,d.var,d.kind),
  quick:quickPlay,fbin:fbSignIn,fbout:()=>{FB.auth&&FB.auth.signOut();closeModal();toast('התנתקת');},
  fbsave:()=>{const v=($('#fbcfg')||{}).value||'';let o;try{const t=v.trim().replace(/^[^{]*/,'').replace(/[^}]*$/,'');o=JSON.parse(t.replace(/([{,]\s*)([A-Za-z_]+)\s*:/g,'$1"$2":').replace(/'/g,'"'));}catch(e){toast('ה-config לא תקין — הדביקו את האובייקט מ-Firebase Console','bad');return;}
    if(!o.apiKey||!o.authDomain){toast('חסרים apiKey או authDomain','bad');return;}S.fbcfg=JSON.stringify(o);save();closeModal();fbInit().then(()=>toast('Firebase הופעל — אפשר להתחבר','good'));},hud:d=>openHud(+d.i),simrun:simStart,
  chalnew:d=>startChal(newChalCode(d.g)),chaljoin:()=>startChal(($('#chalcode')||{}).value),
  copyshare:d=>{const t=chalShareTxt(d.code);try{navigator.clipboard.writeText(t).then(()=>toast('ההודעה הועתקה','good'),()=>toast(t));}catch(e){toast(t);}},
  cloudload:()=>{closeModal();cloudApply(CLOUD.pending);CLOUD.ready=true;},cloudkeep:()=>{closeModal();CLOUD.pending=null;CLOUD.ready=true;cloudPush();toast('השמירה מהמכשיר הזה עלתה לענן');},cloudnow:()=>{cloudPush().then(()=>openSettings());},
  onbnext:d=>showOnb(+d.i),onbskip:()=>{S.onb=1;save();closeModal();},onbagain:()=>{closeModal();showOnb(0);},
  chatopen:()=>{NET.chatOpen=true;NET.unread=0;chatRender();},chatclose:()=>{NET.chatOpen=false;chatRender();},chatq:d=>netSay(d.v),
  sound:()=>{S.sound=!S.sound;save();updTop();if(S.sound)snd('chip');},
  lbtab:d=>{LB.tab=d.v;render();},lbpub:()=>{lbPublish();},
  exam:d=>startExam(d.g),exans:d=>{if(EX.ans!=null)return;EX.ans=d.v;if(d.v===EX.qs[EX.i].a)EX.ok++;render();},exnext:()=>{EX.i++;EX.ans=null;render();window.scrollTo(0,0);},
  charth17:d=>{CUR.h17=+d.v;render();},
  cstart:()=>{const N=Math.min(44,8+DR.lvl*4);DR.ms=Math.max(330,1400-140*(DR.lvl-1));const d=newDeck(2);DR.cards=d.slice(0,N);DR.rc=DR.cards.reduce((a,c)=>a+hiLo(c),0);DR.i=0;DR.guess=0;DR.run=(DR.run||0)+1;DR.phase='show';render();DR.timer=setTimeout(countStep,DR.ms);},
  cguess:d=>{DR.guess+=+d.v;render();},
  ccheck:()=>{const ok=DR.guess===DR.rc;DR.n++;DR.lastOk=ok;if(ok){DR.ok++;DR.streak++;DR.lvl=Math.min(12,DR.lvl+1);S.cnt=DR.lvl;save();chal('count_ok');chal('drill15');if(DR.streak>=10)unlock('drill10');}else DR.streak=0;recDec('drill',ok);DR.phase='res';render();},
  helpcycle:()=>{if(!S.solver){S.solver=true;S.coach=false;}else if(!S.coach)S.coach=true;else{S.solver=false;S.coach=false;}save();toast(helpLbl());render();},
  touragain:()=>{const v=PK.st.v;PK.st=null;openSetup('poker',v,'tour');},
  tcptarget:d=>{TCP.target=d.v;tcpRender();},tcpchip:d=>{snd('chip');tcpChip(+d.v);},tcpclear:()=>{TCP.ante=0;TCP.pp=0;tcpRender();},tcpdeal:tcpDeal,tcpplay:()=>tcpDecide(true),tcpfold:()=>tcpDecide(false),tcpnew:()=>{TCP.phase='bet';TCP.res=null;TCP.ph=[];TCP.dh=[];TCP.play=false;tcpRender();},
  bacbet:d=>{snd('chip');bacBet(d.k);},bacchip:d=>{BAC.chip=+d.v;bacRender();},bacclear:()=>{BAC.bets={};bacRender();},bacrebet:()=>{const t=Object.values(BAC.prev).reduce((a,b)=>a+b,0);if(t>bal()){toast('אין מספיק צ׳יפים','bad');return;}BAC.bets={...BAC.prev};bacRender();},bacdeal:bacDeal,
  set:d=>{const k=d.k;let v=d.v;if(['bots','stakes','denom','hbots','help','buy','decks','h17','ls','mttN'].includes(k))v=+v;if(k==='simN'){SIM.N=+v;render();return;}if(k==='simh17'){SIM.h17=+v;render();return;}if(k==='simpay'){SIM.pay=v;render();return;}if(k==='netbots'){NET.bots=+v;render();return;}if(k==='netg'){SETUP.netg=v;render();return;}SETUP[k]=v;if(k==='mode'&&v==='hotseat'&&SETUP.g==='poker'&&SETUP.variant==='draw'&&SETUP.names.length>6)SETUP.names.length=6;render();},
  addname:()=>{SETUP.names.push('שחקן '+(SETUP.names.length+1));render();},
  rmname:d=>{SETUP.names.splice(+d.i,1);render();},
  start:startGame,
  pk:d=>pkDo(d.x),pkraise:()=>pkDo('raise',PK.raiseTo),
  pkpre:d=>{PK.raiseTo=+d.v;const r=$('#raiseRange');if(r)r.value=PK.raiseTo;$('#raiseVal').textContent=fmt(PK.raiseTo);},
  pksel:d=>{const k=+d.k;const i=PK.sel.indexOf(k);if(i>=0)PK.sel.splice(i,1);else if(PK.sel.length<3)PK.sel.push(k);else toast('אפשר להחליף עד 3 קלפים');pkRender();},
  pkdraw:pkDoDraw,
  pkhint:()=>{const R=pkSolveCached(PK.st.turn);if(R&&R.opts){PK.sel=R.opts[0].disc.slice();pkRender();toast(R.opts[0].disc.length?'סימנתי את הקלפים שהסולבר ממליץ להחליף':'הסולבר ממליץ לעמוד');}},
  pknext:()=>{if(NET&&NET.role==='guest')return;pkNextHand();},
  pkreveal:()=>{PK.viewer=PK.cover;PK.cover=-1;PK.solveKey='';pkRender();},
  pkleave:pkLeave,
  pkrebuy:()=>{const s=PK.st;const me=s.seats.find(p=>p.t==='me');me.c=Math.min(bal(),s.bb*100);PK.needRebuy=false;pkNextHand();},
  bj:d=>bjDo(+d.i,d.x),
  bjpick:d=>{BJ.betSeat=+d.i;bjRender();},
  bjchip:d=>{snd('chip');const s=BJ.st;const i=BJ.betSeat;if(!bjCanControl(i))return;const p=s.seats[i];const k=BJ.target==='main'?'bet':BJ.target;const cap=k==='bet'?s.max:Math.floor(s.max/5);
    const nv=Math.min(p[k]+(+d.v),cap);const total=p.bet+p.pp+p.t3-p[k]+nv;if(total>chipsOf(p)){toast('אין מספיק צ׳יפים','bad');return;}p[k]=nv;if(NET&&NET.role==='guest'){p.ready=false;}bjRender();},
  bjtarget:d=>{BJ.target=d.v;bjRender();},
  bjclear:()=>{const p=BJ.st.seats[BJ.betSeat];if(p&&bjCanControl(BJ.betSeat)){p.bet=0;p.pp=0;p.t3=0;bjRender();}},
  bjmin:()=>{const p=BJ.st.seats[BJ.betSeat];if(p&&bjCanControl(BJ.betSeat)){p.bet=Math.min(BJ.st.min,chipsOf(p));bjRender();}},
  bjready:()=>{const p=BJ.st.seats[BJ.betSeat];netSend('bet',p.bet,{pp:p.pp,t3:p.t3});toast('ההימור נשלח למארח');},
  bjdeal:()=>{if(NET&&NET.role==='host'){const s=BJ.st;s.seats.forEach(p=>{if(p.t==='remote'&&!p.ready)p.bet=0;});}bjDeal();bjTick();},
  bjnew:()=>{bjNewRound();bjTick();},
  bjleave:bjLeave,
  rlbet:d=>{snd('chip');rlBet(d.k);},rlchip:d=>{RL.chip=+d.v;rlRender();},rlspin:rlSpin,
  rlclear:()=>{RL.players[RL.act].bets={};rlRender();},
  rlrebet:()=>{const p=RL.players[RL.act];const tot=Object.values(p.prev).reduce((a,b)=>a+b,0);if(tot>rlChips(p)){toast('אין מספיק צ׳יפים','bad');return;}p.bets={...p.prev};rlRender();},
  rlplayer:d=>{RL.act=+d.i;rlRender();},
  vpdeal:vpDeal,vpdraw:vpDrawCards,
  vphold:d=>{VP.held[+d.i]=!VP.held[+d.i];vpRender();},
  vpcoin:()=>{VP.coins=VP.coins%5+1;vpRender();},
  vpbest:()=>{if(!VP.solve)return;const m=VP.solve[0].m;VP.held=[0,1,2,3,4].map(i=>!!(m&(1<<i)));vpRender();},
  mart:runMart,
  dans:d=>{DR.ans=d.v;DR.n++;if(d.v===DR.correct){DR.ok++;DR.streak++;chal('drill15');if(DR.streak>=10)unlock('drill10');}else DR.streak=0;recDec('drill',d.v===DR.correct);render();},
  dnext:()=>newDrill(DR.id),
  askreset:()=>{$('#resetbox').innerHTML=`<div class="panel row"><span class="grow">למחוק את כל הסטטיסטיקה?</span><button class="btn fold sm" data-a="doreset">מחק</button><button class="btn ghost sm" data-a="go" data-v="stats">ביטול</button></div>`;},
  doreset:()=>{S.stats={};save();render();toast('הסטטיסטיקה אופסה');},
  netcreate:netCreate,netjoin:netJoin,netstart:netStart,
  netback:()=>{if(NET&&NET.phase!=='play')netLeave();go('home');},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f){e.preventDefault();f(b.dataset,b);}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click();}});
render();
if(!S.onb)showOnb(0);
cloudInit();
fbInit();
